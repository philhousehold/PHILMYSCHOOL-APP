function escapeHTML(value){

  if(value===null || value===undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function showAuthMessage(message,type=""){

  const box=document.getElementById("authMessage");

  if(!box)return;

  box.textContent=message;

  box.className="authMessage show "+type;
}


function clearAuthMessage(){

  const box=document.getElementById("authMessage");

  if(!box)return;

  box.textContent="";
  box.className="authMessage";
}

/* =========================================================
   REGISTER
========================================================= */

async function register(event){

  event.preventDefault();

  clearAuthMessage();

  const firstName=
    document.getElementById("firstName").value.trim();

  const lastName=
    document.getElementById("lastName").value.trim();

  const email=
    document.getElementById("registerEmail").value.trim();

  const password=
    document.getElementById("registerPassword").value;

  const button=
    document.getElementById("registerButton");

  if(button){
    button.disabled=true;
    button.textContent="Creating account...";
  }

  showAuthMessage(
    "Creating your account...",
    ""
  );


  try{

    const result=
      await db.auth.signUp({

        email,
        password,

        options:{
          data:{
            first_name:firstName,
            last_name:lastName,
            requested_role:selectedRole
          }
        }

      });


    if(result.error){

      showAuthMessage(
        result.error.message,
        "error"
      );

      if(button){
        button.disabled=false;
        button.textContent="Create Account";
      }

      return;
    }


    /*
      If email confirmation is enabled,
      there may be no session yet.
    */

    if(!result.data.session){

      showAuthMessage(
        "Account created successfully. Please check your email and confirm your account, then sign in.",
        "success"
      );

      if(button){
        button.disabled=false;
        button.textContent="Create Account";
      }

      return;
    }


    /*
      If Supabase immediately gives a session,
      load the user's dashboard.
    */

    await loadCurrentUser();


  }catch(error){

    console.error(error);

    showAuthMessage(
      error.message || "Registration failed.",
      "error"
    );

    if(button){
      button.disabled=false;
      button.textContent="Create Account";
    }

  }

}

/* =========================================================
   CURRENT USER
========================================================= */

async function loadCurrentUser(){

  try{

    const auth=
      await db.auth.getUser();


    if(auth.error || !auth.data.user){

      user=null;
      profile=null;
      role=null;

      renderLanding();

      return;
    }


    user=auth.data.user;


    /*
      Get profile.
    */

    const profileResult=
      await db
        .from("profiles")
        .select("*")
        .eq("id",user.id)
        .maybeSingle();


    if(profileResult.error){

      console.warn(
        "Profile:",
        profileResult.error.message
      );

    }


    profile=
      profileResult.data || {

        id:user.id,
        email:user.email,
        display_name:user.email

      };


    /*
      Get role.
    */

    const roleResult=
      await db
        .from("user_roles")
        .select("role,is_active,created_at")
        .eq("user_id",user.id)
        .eq("is_active",true)
        .order("created_at",{ascending:true})
        .limit(1)
        .maybeSingle();


    if(roleResult.error){

      console.warn(
        "Role:",
        roleResult.error.message
      );

    }


    role=
      roleResult.data?.role || "student";


    openPortal();


  }catch(error){

    console.error(error);

    renderLanding();

  }

}

/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadStudents(){

  const area=
    document.getElementById("studentManagementArea");

  if(!area)return;


  area.innerHTML=`

    <div class="loading">
      Loading students...
    </div>

  `;


  try{

    const rolesResult=
      await db
        .from("user_roles")
        .select(
          "id,user_id,role,is_active,created_at"
        )
        .eq("role","student")
        .order(
          "created_at",
          {ascending:false}
        );


    if(rolesResult.error){

      area.innerHTML=`

        <div class="errorBox">

          <strong>
            Unable to load students.
          </strong>

          <br><br>

          ${escapeHTML(
            rolesResult.error.message
          )}

        </div>

      `;

      return;
    }


    const roles=
      rolesResult.data||[];


    const userIds=
      roles
        .map(x=>x.user_id)
        .filter(Boolean);


    if(userIds.length===0){

      allStudents=[];

      updateStudentStats();


      area.innerHTML=`

        <div class="tableEmpty">

          <h3>
            No students yet
          </h3>

          <p style="margin-top:8px">
            Registered student accounts will appear here.
          </p>

        </div>

      `;

      return;
    }


    const profilesResult=
      await db
        .from("profiles")
        .select(`
          id,
          email,
          first_name,
          last_name,
          display_name,
          phone,
          avatar_url,
          date_of_birth,
          gender,
          state,
          lga,
          country,
          account_status,
          onboarding_completed,
          created_at,
          updated_at
        `)
        .in("id",userIds);


    if(profilesResult.error){

      area.innerHTML=`

        <div class="errorBox">

          <strong>
            Student profiles could not be loaded.
          </strong>

          <br><br>

          ${escapeHTML(
            profilesResult.error.message
          )}

        </div>

      `;

      return;
    }


    const profiles=
      profilesResult.data||[];


    allStudents=
      roles.map(roleRow=>{

        const p=
          profiles.find(
            profileRow=>
              profileRow.id===roleRow.user_id
          )||{};


        return{

          ...p,

          user_id:roleRow.user_id,

          role:roleRow.role,

          is_active:roleRow.is_active,

          role_created_at:
            roleRow.created_at

        };

      });


    updateStudentStats();

    renderStudentTable(allStudents);


  }catch(error){

    console.error(error);


    area.innerHTML=`

      <div class="errorBox">

        <strong>
          Something went wrong.
        </strong>

        <br><br>

        ${escapeHTML(
          error.message ||
          "Unable to load students."
        )}

      </div>

    `;

  }

}


/* =========================================================
   STUDENT STATS
========================================================= */

function updateStudentStats(){

  const total=
    allStudents.length;

  const active=
    allStudents.filter(
      student=>
        student.is_active!==false
    ).length;

  const inactive=
    total-active;


  const totalEl=
    document.getElementById("totalStudents");

  const activeEl=
    document.getElementById("activeStudents");

  const inactiveEl=
    document.getElementById("inactiveStudents");

  const showingEl=
    document.getElementById("showingStudents");


  if(totalEl)
    totalEl.textContent=total;

  if(activeEl)
    activeEl.textContent=active;

  if(inactiveEl)
    inactiveEl.textContent=inactive;

  if(showingEl)
    showingEl.textContent=total;

}


/* =========================================================
   FILTER
========================================================= */

function filterStudents(){

  const input=
    document.getElementById("studentSearch");

  if(!input)return;


  const search=
    input.value
      .trim()
      .toLowerCase();


  if(!search){

    renderStudentTable(allStudents);

    const showingEl=
      document.getElementById("showingStudents");

    if(showingEl)
      showingEl.textContent=
        allStudents.length;

    return;
  }


  const filtered=
    allStudents.filter(student=>{

      const name=
        `
        ${student.first_name||""}
        ${student.last_name||""}
        ${student.display_name||""}
        `
        .toLowerCase();


      const email=
        (student.email||"")
        .toLowerCase();


      const phone=
        (student.phone||"")
        .toLowerCase();


      return(
        name.includes(search)||
        email.includes(search)||
        phone.includes(search)
      );

    });


  const showingEl=
    document.getElementById("showingStudents");


  if(showingEl)
    showingEl.textContent=
      filtered.length;


  renderStudentTable(filtered);

}


/* =========================================================
   STUDENT TABLE
========================================================= */

function renderStudentTable(students){

  const area=
    document.getElementById(
      "studentManagementArea"
    );


  if(!area)return;


  if(!students.length){

    area.innerHTML=`

      <div class="tableEmpty">

        <h3>
          No students found
        </h3>

        <p style="margin-top:8px">
          Try another search.
        </p>

      </div>

    `;

    return;
  }


  let rows="";


  students.forEach((student,index)=>{

    const fullName=
      student.display_name||
      `
      ${student.first_name||""}
      ${student.last_name||""}
      `
      .trim()||
      "Unnamed Student";


    const email=
      student.email||
      "No email";


    const location=
      [
        student.state,
        student.lga
      ]
      .filter(Boolean)
      .join(", ")||
      "—";


    const status=
      student.is_active!==false;


    rows+=`

      <tr>

        <td>
          ${index+1}
        </td>


        <td>

          <div class="studentName">
            ${escapeHTML(fullName)}
          </div>

          <div class="studentEmail">
            ${escapeHTML(email)}
          </div>

        </td>


        <td>
          ${escapeHTML(student.phone||"—")}
        </td>


        <td>
          ${escapeHTML(location)}
        </td>


        <td>

          <span class="badge ${
            status
            ?"badgeGreen"
            :"badgeRed"
          }">

            ${status?"Active":"Inactive"}

          </span>

        </td>


        <td>

          <button
            class="btn secondary"
            style="padding:8px 12px"
            onclick="viewStudent('${student.id||student.user_id}')">

            View

          </button>

        </td>

      </tr>

    `;

  });


  area.innerHTML=`

    <table class="studentTable">

      <thead>

        <tr>

          <th>#</th>
          <th>Student</th>
          <th>Phone</th>
          <th>Location</th>
          <th>Status</th>
          <th>Action</th>

        </tr>

      </thead>

      <tbody>

        ${rows}

      </tbody>

    </table>

  `;

}

/* =========================================================
   LOGOUT — FIXED
========================================================= */

let loggingOut=false;


async function logout(){

  if(loggingOut)return;

  loggingOut=true;


  try{

    /*
      Sign out from Supabase.
    */

    const result=
      await db.auth.signOut();


    if(result.error){

      console.error(
        "Logout error:",
        result.error
      );

      /*
        Even if the local logout request
        has a problem, clear the local UI.
      */

    }

  }catch(error){

    console.error(
      "Logout exception:",
      error
    );

  }


  /*
    Always clear local application state.
  */

  user=null;
  profile=null;
  role=null;
  allStudents=[];


  /*
    Remove any cached Supabase session
    from the browser.
  */

  try{

    localStorage.removeItem(
      `sb-${new URL(SUPABASE_URL).hostname.split(".")[0]}-auth-token`
    );

  }catch(e){

    console.warn(e);

  }


  loggingOut=false;


  /*
    Send user to login page.
  */

  renderLogin();

}


/* =========================================================
   AUTH STATE LISTENER
========================================================= */

db.auth.onAuthStateChange(
  async(event,session)=>{

    console.log(
      "AUTH EVENT:",
      event
    );


    if(event==="SIGNED_OUT"){

      user=null;
      profile=null;
      role=null;
      allStudents=[];

      renderLogin();

      return;
    }


    /*
      Do not repeatedly rebuild the portal
      while the page is already loading.
    */

    if(
      event==="INITIAL_SESSION" &&
      session
    ){

      /*
        Initial session is handled below.
      */

      return;
    }

  }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

(async function(){

  try{

    const sessionResult=
      await db.auth.getSession();


    if(sessionResult.error){

      console.error(
        sessionResult.error
      );

      renderLanding();

      return;
    }


    if(sessionResult.data.session){

      await loadCurrentUser();

    }else{

      renderLanding();

    }


  }catch(error){

    console.error(error);


    document.getElementById("app").innerHTML=`

      <div style="
        padding:40px;
        font-family:Arial;
      ">

        <h2>
          PHILMYSCHOOL
        </h2>

        <p style="
          margin-top:10px;
          color:#718096;
        ">

          The application could not finish loading.

        </p>


        <button
          class="btn primary"
          style="margin-top:20px"
          onclick="renderLanding()">

          Reload PHILMYSCHOOL

        </button>

      </div>

    `;

  }

})();
