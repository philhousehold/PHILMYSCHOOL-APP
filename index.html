<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --navy:#10233f;
 --navy2:#19395e;
 --blue:#155eef;
 --blue2:#6ba9ff;
 --light:#f5f7fb;
 --white:#fff;
 --muted:#718096;
 --border:#e3e8ef;
 --green:#159447;
 --red:#d92d20;
 --orange:#b54708;
}

body{
 font-family:Arial,Helvetica,sans-serif;
 background:var(--light);
 color:var(--navy)
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.btn{
 border:0;
 border-radius:9px;
 padding:11px 17px;
 font-weight:700
}

.primary{background:var(--blue);color:#fff}
.secondary{background:#eaf2ff;color:var(--blue)}
.danger{background:#fff0ef;color:#b42318}
.success{background:#e9f8ef;color:#126b35}
.warning{background:#fff4e5;color:#9a4d00}

.navbar{
 height:74px;
 background:#fff;
 border-bottom:1px solid var(--border);
 padding:0 6%;
 display:flex;
 align-items:center;
 justify-content:space-between
}

.logo{
 display:flex;
 align-items:center;
 gap:10px;
 font-weight:800;
 font-size:19px
}

.logoIcon{
 width:39px;
 height:39px;
 border-radius:10px;
 background:var(--blue);
 color:#fff;

 place-items:center;
 font-weight:900

.navButtons{
 display:flex;
 gap:10px

/* LANDING */

.hero{
 max-width:1180px;
 margin:auto;
 padding:80px 25px;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:55px;
 align-items:center
}

.eyebrow{
 color:var(--blue);
 font-weight:800;
 font-size:12px;
 letter-spacing:.08em
}

.hero h1{
 font-size:60px;
 line-height:1;
 letter-spacing:-2px;
 margin:18px 0
}

.hero h1 span{color:var(--blue)}

.heroText{
 color:#68778c;
 font-size:18px;
 line-height:1.7
}

.heroButtons{
 display:flex;
 gap:10px;
 margin-top:28px
}

.preview{
 background:var(--navy);
 color:#fff;
 border-radius:25px;
 padding:27px
}

.progress{
 height:8px;
 background:#2a4260;
 border-radius:20px;
 margin:18px 0
}

.progress span{
 display:block;
 width:82%;
 height:100%;
 background:#6ba9ff;
 border-radius:20px
}

.previewGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.previewCard{
 background:#193756;
 border-radius:12px;
 padding:18px
}

.previewCard small{color:#b4c2d4}

.previewCard strong{
 display:block;
 margin-top:6px;
 font-size:24px
}

.features{
 padding:75px 6%;
 background:#fff

.sectionTitle{
 text-align:center;

 margin:auto

.sectionTitle h2{
 font-size:40px;
 margin:10px 0

.muted{

}

.featureGrid{

.feature{

 padding:24px;
 background:#fff

.featureIcon{font-size:30px}

.feature h3{margin:14px 0 8px}

.feature p{

 line-height:1.6

/* AUTH */

.authPage{

.authBrand{

.authBrand .logoIcon{

.authBrand h1{

.authBrand p{

.authBoxWrap{

.authBox{

.authBox h2{

.formGroup{margin-top:15px}

.formGroup label{

 font-size:13px;
 font-weight:700;
 margin-bottom:7px

.formGroup input,
.formGroup select,

 width:100%;
 padding:12px;
 border:1px solid #d8e0e9;
 border-radius:9px;
 outline:none;

.formGroup textarea{

 resize:vertical
}

.formGroup input:focus,
.formGroup select:focus,
.formGroup textarea:focus{

}

.roleGrid{

 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:16px

.roleChoice{

 border-radius:9px;
 font-weight:700

.roleChoice.active{

 background:#eaf2ff;

}

.authMessage{

 padding:11px;
 border-radius:8px;
 font-size:13px;
 display:none
}

.authMessage.show{
 display:block;
 background:#fff3dc;
 color:#7a510e
}

.authMessage.error{
 display:block;
 background:#fff0ef;
 color:#b42318
}

.authMessage.success{
 display:block;

 color:#126b35
}

.authSwitch{
 text-align:center;
 margin-top:18px;
 font-size:13px
}

.linkButton{

 background:none;
 color:var(--blue);
 font-weight:700

/* PORTAL */

.portal{min-height:100vh}

.sidebar{
 width:250px;
 position:fixed;
 left:0;
 top:0;
 bottom:0;
 background:var(--navy);

 z-index:100;
 overflow-y:auto
}

.sidebarLogo{
 display:flex;
 align-items:center;
 gap:10px;
 font-weight:800;

.sidebarLogoIcon{

 height:35px;
 border-radius:9px;
 background:#fff;
 color:var(--navy);

.sideLabel{

.sideButton{

 color:#b7c6d9;

.sideButton:hover,
.sideButton.active{

.logoutButton{

.main{

}

.topbar{

 align-items:center;
 padding:0 30px;

.topUser{

 display:flex;
 align-items:center;

.mobileLogout{

 padding:9px 12px;

 font-weight:700

.content{

 padding:30px

.content h1{
 font-size:34px;
 margin-bottom:7px

.stats{

 grid-template-columns:repeat(4,1fr);
 gap:15px;

.stat{

 padding:20px

.stat small{color:var(--muted)}

.stat strong{

.panelGrid{

 gap:16px;

.panel{

 padding:24px

.panel h2{margin-bottom:10px}

.panel p{

}

.status{

 background:#e9f8ef;
 color:#126b35;
 border-radius:9px;
 font-size:13px

.mobileMenu{

 border:0;
 background:#eaf2ff;

 border-radius:8px;
 padding:9px 12px;
 font-weight:700

.managementHeader{

 justify-content:space-between;
 align-items:center;
 gap:15px;
 margin-top:25px;

.searchBox{

 border-radius:9px;
 background:#fff;

}

.studentTableWrap{

.studentTable{

.studentEmail{

.badge{

.badgeGreen{

.badgeRed{

.badgeOrange{

.tableEmpty,

.detailGrid{

.detailItem small{

.errorBox{

.modal{

.modalBox{

.closeBtn{

.notice{

.subjectGrid{

 grid-template-columns:repeat(3,1fr);

.subjectCard{

.subjectCard h3{

 margin-bottom:7px

.subjectCard p{

 font-size:13px;

.examSetupCard{
 background:#fff;
 border:1px solid var(--border);
 border-radius:18px;
 padding:25px;

.examBody{

.questionNumber{

.option.selected .optionLetter{

.examLayout{

.questionNavigator{

 border-radius:15px;

.examActions{

 .subjectGrid{grid-template-columns:1fr}
 .examBody{padding:15px}
 .questionText{font-size:18px}
 .resultGrid{grid-template-columns:1fr}
}
</style>

function escapeHTML(value){
 if(value===null||value===undefined)return "";

 return String(value)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function showAuthMessage(message,type=""){
 const box=document.getElementById("authMessage");

 if(!box)return;

 box.textContent=message;
 box.className="authMessage show "+type;
}

function clearAuthMessage(){
 const box=document.getElementById("authMessage");

 if(!box)return;

 box.textContent="";
 box.className="authMessage";
}

function money(value){
 const n=Number(value||0);

 return "₦"+
 n.toLocaleString("en-NG",{
  minimumFractionDigits:0
 });
}

function dateText(value){
 if(!value)return "—";

 const d=new Date(value);

 return isNaN(d)
  ?"—"
  :d.toLocaleDateString("en-NG");
}

function dateTimeText(value){
 if(!value)return "—";

 const d=new Date(value);

 return isNaN(d)
  ?"—"
  :d.toLocaleString("en-NG");
}

function safeJSON(value){
 try{
  return JSON.stringify(value||{});
 }catch(e){
  return "{}";
 }
}

function notify(message){
 alert(message);
}

async function register(event){

 event.preventDefault();

 clearAuthMessage();

 const firstName=
 document.getElementById("firstName").value.trim();

 const lastName=
 document.getElementById("lastName").value.trim();

 const email=
 document.getElementById("registerEmail").value.trim();

 const password=
 document.getElementById("registerPassword").value;

 const button=
 document.getElementById("registerButton");

 button.disabled=true;
 button.textContent="Creating account...";

 showAuthMessage("Creating your account...");

 try{

  const result=await db.auth.signUp({

   email,
   password,

   options:{
    data:{
     first_name:firstName,
     last_name:lastName,
     requested_role:selectedRole
    }
   }

  });

  if(result.error){

   showAuthMessage(
    result.error.message,
    "error"
   );

   button.disabled=false;
   button.textContent="Create Account";

   return;
  }

  if(!result.data.session){

   showAuthMessage(
    "Account created. Please confirm your email, then sign in.",
    "success"
   );

   button.disabled=false;
   button.textContent="Create Account";

   return;
  }

  await loadCurrentUser();

 }catch(error){

  console.error(error);

  showAuthMessage(
   error.message||"Registration failed.",
   "error"
  );

  button.disabled=false;
  button.textContent="Create Account";
 }
}

async function login(event){

 event.preventDefault();

 clearAuthMessage();

 const email=
 document.getElementById("loginEmail").value.trim();

 const button=

 button.disabled=true;
 button.textContent="Signing in...";

  );

  button.disabled=false;
  button.textContent="Sign In";
 }
}

async function loadCurrentUser(){

 try{

  const auth=await db.auth.getUser();

  if(auth.error||!auth.data.user){

   user=null;
   profile=null;
   role=null;

   renderLanding();

   return;
  }

  user=auth.data.user;

  const profileResult=
  await db
   .from("profiles")
   .select("*")
   .eq("id",user.id)
   .maybeSingle();

  profile=
   profileResult.data||
   {
    id:user.id,
    email:user.email,
    display_name:user.email
   };

  const roleResult=
  await db
   .from("user_roles")
   .select("role,is_active,created_at")
   .eq("user_id",user.id)
   .eq("is_active",true)
   .order("created_at",{ascending:true})
   .limit(1)
   .maybeSingle();

  role=
   roleResult.data?.role||
   "student";

  openPortal();

 }catch(error){

  console.error(error);

  renderLanding();
 }
}

function openPortal(){

 if(!user){

  return;
 }

 if(role==="admin"){
  renderAdmin();
  return;

 if(role==="tutor"){

  return;
 }

 renderStudent();
}

async function loadStudentStats(){

 if(!user)return;

 try{

  const result=
  await db
   .from("exam_attempts")
   .select("id,score,total_marks")
   .eq("user_id",user.id);

  const rows=result.data||[];

  const exams=
   document.getElementById("studentExamCount");

  if(exams)
   exams.textContent=rows.length;

  if(rows.length){

   const totalScore=
   rows.reduce(
    (sum,x)=>sum+Number(x.score||0),
    0
   );

   const totalMarks=
   rows.reduce(
    (sum,x)=>sum+Number(x.total_marks||0),
    0
   );

   const accuracy=
    totalMarks?
    Math.round(
     totalScore/totalMarks*100
    )+"%":
    "—";

   const el=
    document.getElementById(
     "studentAccuracy"
    );

   if(el)
    el.textContent=accuracy;
  }

 }catch(e){}
}

function filterStudentSubjects(){

 const q=
 (
  document.getElementById(
   "studentSubjectSearch"
  )?.value||""
 )
 .toLowerCase()
 .trim();

 const rows=
 !q
 ?subjects
 :subjects.filter(s=>
  JSON.stringify(s)
  .toLowerCase()
  .includes(q)
 );

 renderStudentSubjectCards(rows);
}

/* =========================================================
   RANDOM SUBJECT PRACTICE
========================================================= */

async function startSubjectPractice(
 subjectId,
 count=10
){

 if(examState.active){

  if(!confirm(
   "You already have an active examination. Start another one?"
  ))return;

  stopExamTimer();
 }

 const subject=
 subjects.find(
  x=>x.id===subjectId
 );

 try{

  const result=
  await db.rpc(
   "get_random_subject_questions",
   {
    p_subject_id:subjectId,
    p_question_count:count
   }
  );

  if(result.error){

   alert(
    "Could not load questions:\n\n"+
    result.error.message
   );

   return;
  }

  const questions=result.data||[];

  if(!questions.length){

   alert(
    "There are no questions available for this subject yet."
   );

   return;
  }

  examState={
   active:true,
   exam:{
    id:null,
    title:"Subject Practice"
   },
   subject:
    subject||
    {
     id:subjectId,
     subject_name:"Subject"
    },
   questions:questions,
   answers:{},
   current:0,
   startedAt:new Date(),
   endAt:null,
   timer:null,
   submitted:false
  };

  renderActiveExam();

 }catch(error){

  alert(
   "Practice could not start:\n\n"+
   error.message
  );
 }
}

   </span>

    id="examTimer">

   </div>

 </div>

       q.question||
       q.text||
       ""
      )}
     </div>

     ${renderQuestionOptions(q)}

     <div class="examActions">

      <button
       class="btn secondary"
       onclick="previousExamQuestion()"
       ${examState.current===0?"disabled":""}>
       ← Previous
      </button>

      ${

       total-1
       ?
       `<button
        class="btn primary"
        onclick="nextExamQuestion()">
        Next →
       </button>`
       :
       `<button
        class="btn primary"
        onclick="confirmSubmitExam()">
        Submit Exam
       </button>`
      }

     </div>

    </div>

   </div>

   <div class="questionNavigator">

    <strong>Questions</strong>

    <div class="questionNumbers">

     ${examState.questions.map(
      (_,i)=>`

       <button
        class="qNum
        ${i===examState.current?"current":""}
        ${examState.answers[i]!==undefined?"answered":""}"
        onclick="goExamQuestion(${i})">
        ${i+1}
       </button>

      `
     ).join("")}

    </div>

     Answered:
     <strong>
      ${
       Object.keys(
        examState.answers
       ).length
      }
     </strong>
     /
     ${total}

    </div>

     class="btn danger"

     onclick="confirmSubmitExam()">
     Submit Now
    </button>

   </div>

  </div>

 </main>`;

 updateExamTimer();
}

function extractOptions(q){

 if(q.options&&typeof q.options==="object"){

  if(Array.isArray(q.options))
   return q.options;

  return [
   q.options.A||q.options.a||"",
   q.options.B||q.options.b||"",
   q.options.C||q.options.c||"",
   q.options.D||q.options.d||""
  ];
 }

 const result=[];

 ["A","B","C","D","E"].forEach(letter=>{

  const value=
   q["option_"+letter.toLowerCase()]||
   q["option_"+letter]||
   q["choice_"+letter.toLowerCase()]||
   q["choice_"+letter];

  if(value!==undefined&&value!==null)
   result.push(value);
 });

 return result;
}

function renderQuestionOptions(q){

 const options=
 extractOptions(q);

 if(!options.length){

  return `
   <div class="notice">
    This question does not have answer
    options configured.
   </div>`;
 }

 const selected=
  examState.answers[
   examState.current
  ];

 return options.map(
  (option,i)=>{

   const letter=
    String.fromCharCode(
     65+i
    );

   return `

    <button
     class="option ${
      selected===i
      ?"selected"
      :""
     }"
     onclick="answerExamQuestion(${i})">

     <span class="optionLetter">
      ${letter}
     </span>

     <span>
      ${escapeHTML(option)}
     </span>

    </button>`;

  }
 ).join("");
}

function answerExamQuestion(index){

 examState.answers[
  examState.current
 ]=index;

 renderActiveExam();
}

function nextExamQuestion(){

 if(
  examState.current<
  examState.questions.length-1
 ){

  examState.current++;

  renderActiveExam();
 }
}

function previousExamQuestion(){

 if(examState.current>0){

  examState.current--;

  renderActiveExam();
 }
}

function goExamQuestion(index){

 if(
  index>=0&&
  index<examState.questions.length
 ){

  examState.current=index;

  renderActiveExam();
 }
}

function confirmSubmitExam(){

 const unanswered=
 examState.questions.length-
 Object.keys(
  examState.answers
 ).length;

 if(unanswered>0){

  if(!confirm(
   `${unanswered} question(s) are unanswered. Submit anyway?`
  ))return;
 }

 submitActiveExam();
}

/* =========================================================
   TIMER
========================================================= */

function updateExamTimer(){

 const el=
 document.getElementById(
  "examTimer"
 );

 if(!el)return;

 if(!examState.active){

  el.textContent="";

  return;
 }

 if(!examState.endAt){

  el.textContent="Practice";

  return;
 }

 const remaining=
 Math.max(
  0,
  new Date(
   examState.endAt
  ).getTime()-
  Date.now()
 );

 const seconds=
 Math.floor(
  remaining/1000
 );

 const mins=
 Math.floor(seconds/60);

 const secs=
 seconds%60;

 el.textContent=
 `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;

 if(remaining<=0){

  stopExamTimer();

  alert(
   "Time is up. Your examination will be submitted automatically."
  );

  submitActiveExam();

  return;
 }

 examState.timer=
 setTimeout(
  updateExamTimer,
  1000
 );
}

function stopExamTimer(){

 if(examState.timer){

  clearTimeout(
   examState.timer
  );

  examState.timer=null;
 }
}

/* =========================================================
   SUBMIT EXAM
========================================================= */

async function submitActiveExam(){

 if(
  examState.submitted||
  !examState.active
 )return;

 examState.submitted=true;

 stopExamTimer();

 let correct=0;
 let totalMarks=0;

 const answerRows=[];

 examState.questions.forEach(
  (q,index)=>{

   const marks=
    Number(q.marks||1);

   totalMarks+=marks;

   const chosen=
    examState.answers[index];

   const correctValue=
    q.correct_answer ??
    q.correct_option ??
    q.answer ??
    q.correct_index;

   let isCorrect=false;

   if(
    typeof correctValue==="number"
   ){

    isCorrect=
     chosen===correctValue;

   }else if(
    typeof correctValue==="string"
   ){

    const clean=
     correctValue.trim().toUpperCase();

    const chosenLetter=
     chosen===undefined
     ?""
     :
     String.fromCharCode(
      65+chosen
     );

    isCorrect=
     clean===chosenLetter||
     clean===String(chosen);
   }

   if(isCorrect)
    correct+=marks;

   answerRows.push({
    question_id:q.id,
    selected_answer:
     chosen===undefined
     ?null
     :chosen,
    is_correct:isCorrect,
    marks_awarded:isCorrect?marks:0
   });

  }
 );

 const score=correct;

 let attemptId=null;

 try{

  const attemptPayload={
   user_id:user.id,
   exam_id:examState.exam?.id||null,
   subject_id:
    examState.subject?.id||null,
   score:score,
   total_marks:totalMarks,
   percentage:
    totalMarks?
    Math.round(
     score/totalMarks*100
    ):0,
   started_at:
    examState.startedAt?
    new Date(
     examState.startedAt
    ).toISOString():
    null,
   submitted_at:
    new Date().toISOString()
  };

  const result=
   await db
    .from("exam_attempts")
    .insert(attemptPayload)
    .select("id")
    .maybeSingle();

  if(!result.error)
   attemptId=result.data?.id;

 }catch(error){

  console.warn(
   "Could not save attempt:",
   error
  );
 }

 try{

  if(
   attemptId&&
   answerRows.length
  ){

   const rows=
    answerRows.map(x=>({
     ...x,
     attempt_id:attemptId
    }));

   await db
    .from("exam_answers")
    .insert(rows);
  }

 }catch(error){

  console.warn(
   "Could not save exam answers:",
   error
  );
 }

 const percentage=
  totalMarks?
  Math.round(
   score/totalMarks*100
  ):0;

 examState.active=false;

 renderExamResult({
  correct:score,
  total:totalMarks,
  percentage:percentage,
  answered:Object.keys(
   examState.answers
  ).length,
  questions:examState.questions.length,
  attemptId:attemptId
 });
}

/* =========================================================
   START DATABASE EXAM
========================================================= */

async function startExam(examId){

 try{

  const examResult=
  await db
   .from("exams")
   .select("*")
   .eq("id",examId)
   .maybeSingle();

  if(examResult.error){

   alert(
    examResult.error.message
   );

   return;
  }

  const exam=examResult.data;

  if(!exam){

   alert("Examination not found.");

   return;
  }

  const subjectId=
   exam.subject_id||
   null;

  let subject=null;

  if(subjectId){

   const sr=
    await db
     .from("subjects")
     .select("*")
     .eq("id",subjectId)
     .maybeSingle();

   subject=sr.data||null;
  }

  const count=
   Number(
    exam.total_questions||10
   );

  let questions=[];

  if(subjectId){

   const qr=
    await db.rpc(
     "get_random_subject_questions",
     {
      p_subject_id:subjectId,
      p_question_count:count
     }
   );

   if(qr.error){

    alert(
     "Could not load examination questions:\n\n"+
     qr.error.message
    );

    return;
   }

   questions=qr.data||[];

  }else{

   const qr=
    await db
     .from("questions")
     .select("*")
     .eq("status","published")
     .limit(count);

   if(qr.error){

    alert(
     qr.error.message
    );

    return;
   }

   questions=qr.data||[];
  }

  if(!questions.length){

   alert(
    "No questions are available for this examination."
   );

   return;
  }

  examState={
   active:true,
   exam:exam,
   subject:subject,
   questions:questions,
   answers:{},
   current:0,
   startedAt:new Date(),
   endAt:
    exam.duration_minutes?
    Date.now()+
    Number(
     exam.duration_minutes
    )*60000:
    null,
   timer:null,
   submitted:false
  };

  renderActiveExam();

 }catch(error){

  alert(
   "Unable to start exam:\n\n"+
   error.message
  );
 }
}

async function countTable(
 table,
 filters=[]
){

 try{

  let q=
   db
    .from(table)
    .select("*",{count:"exact",head:true});

  filters.forEach(
   ([column,value])=>
    q=q.eq(column,value)
  );

  const r=await q;

  return r.error
   ?0
   :(r.count||0);

 }catch(e){

  return 0;
 }
}

async function loadAdminSubjects(){

 const area=
 document.getElementById(
  "adminSubjectsArea"
 );

 if(!area)return;

 area.innerHTML=
 `<div
   class="loading"
   style="grid-column:1/-1">
   Loading subjects...
  </div>`;

 try{

  const result=
   await db
    .from("subjects")
    .select("*")
    .order("subject_name")
    .limit(2000);

  if(result.error){

   area.innerHTML=
   `<div
    class="errorBox"
    style="grid-column:1/-1">
    ${escapeHTML(result.error.message)}
   </div>`;

   return;
  }

  subjects=result.data||[];

  if(
   document.getElementById(
    "subjectTotal"
   )
  )
   document.getElementById(
    "subjectTotal"
   ).textContent=
   subjects.length;

  const ids=
   subjects
   .map(x=>x.id)
   .filter(Boolean);

  let questionRows=[];

  if(ids.length){

   const qr=
    await db
     .from("questions")
     .select("id,subject_id")
     .in("subject_id",ids)
     .limit(50000);

   questionRows=
    qr.data||[];
  }

  if(
   document.getElementById(
    "subjectQuestionsTotal"
   )
  )
   document.getElementById(
    "subjectQuestionsTotal"
   ).textContent=
   questionRows.length;

  const withQuestions=
   new Set(
    questionRows
     .map(x=>x.subject_id)
     .filter(Boolean)
   );

  if(
   document.getElementById(
    "subjectsWithQuestions"
   )
  )
   document.getElementById(
    "subjectsWithQuestions"
   ).textContent=
   withQuestions.size;

  if(
   document.getElementById(
    "emptySubjectBanks"
   )
  )
   document.getElementById(
    "emptySubjectBanks"
   ).textContent=
   Math.max(
    0,
    subjects.length-
    withQuestions.size
   );

  renderAdminSubjectCards(
   subjects,
   questionRows
  );

 }catch(error){

  area.innerHTML=
   `<div
    class="errorBox"
    style="grid-column:1/-1">
    ${escapeHTML(error.message)}
   </div>`;
 }
}

function filterAdminSubjects(){

 const q=
 (
  document.getElementById(
   "adminSubjectSearch"
  )?.value||""
 )
 .toLowerCase()
 .trim();

 const rows=
 !q
 ?subjects
 :subjects.filter(s=>
  [
   s.subject_name,
   s.subject_code,
   s.description
  ]
  .filter(Boolean)
  .join(" ")
  .toLowerCase()
  .includes(q)
 );

 renderAdminSubjectCards(
  rows,
  []
 );
}

 ).value.trim();

  alert(
   "Subject name and subject code are required."
  );

  return;
 }

 const payload={
  subject_name:name,
  subject_code:code.toUpperCase(),
  description:description||null
 };

 try{

  let result;

  if(id){

   result=
    await db
     .from("subjects")
     .update(payload)
     .eq("id",id);

  }else{

   result=
    await db
     .from("subjects")
     .insert(payload);

  if(result.error){

   const box=

 }

async function saveQuestion(
 id,
 subjectId
){

 const question=
 document.getElementById(
  "qQuestion"
 ).value.trim();

 const optionA=
 document.getElementById(
  "qA"
 ).value.trim();

 const optionB=
 document.getElementById(
  "qB"
 ).value.trim();

 const optionC=
 document.getElementById(
  "qC"
 ).value.trim();

 const optionD=
 document.getElementById(
  "qD"
 ).value.trim();

 const correct=
 document.getElementById(
  "qCorrect"
 ).value;

 const difficulty=
 document.getElementById(
  "qDifficulty"
 ).value;

 const marks=
 Number(
  document.getElementById(
   "qMarks"
  ).value||1
 );

 const status=
 document.getElementById(
  "qStatus"
 ).value;

 const examType=
 document.getElementById(
  "qExamType"
 ).value.trim();

 const explanation=
 document.getElementById(
  "qExplanation"
 ).value.trim();

 if(!question){

  alert("Question text is required.");

  return;
 }

 if(!subjectId){

  alert(
   "A subject is required for this question."
  );

  return;
 }

 const payload={
  question_text:question,
  subject_id:subjectId,
  option_a:optionA,
  option_b:optionB,
  option_c:optionC,
  option_d:optionD,
  correct_answer:
   correct===""?
   null:
   Number(correct),
  difficulty:difficulty,
  marks:marks,
  status:status,
  exam_type:examType||null,
  explanation:explanation||null
 };

 try{

  let result;

  if(id){

   result=
    await db
     .from("questions")
     .update(payload)
     .eq("id",id);

  }else{

   payload.created_by=
    user.id;

   result=
    await db
     .from("questions")
     .insert(payload);
  }

  if(result.error){

   const box=
    document.getElementById(
     "questionFormMessage"
    );

   if(box){

    box.innerHTML=
     `<div
      class="authMessage error show">
      ${escapeHTML(
       result.error.message
      )}
     </div>`;
   }

   return;
  }

  closeQuestionModal();

  await viewSubjectQuestions(
   subjectId
  );

 }catch(error){

  alert(
   "Question could not be saved:\n\n"+
   error.message
  );
 }
}

/* =========================================================
   MODULE FORM
========================================================= */

function openModuleForm(
 module,
 id=null
){

 const cfg=MODULES[module];

 const existing=
  id?
  currentModuleRows.find(
   x=>x.id===id
  ):
  null;

 const fields=
  cfg.fields.map(f=>{

   const [
    key,
    label,
    type,
    required
   ]=f;

   let value=
    existing?.[key];

   if(
    value===undefined||
    value===null
   )
    value=
     cfg.defaults?.[key]??"";

   if(type==="checkbox"){

    return `

     <div class="formGroup">

      <label>

       <input
        type="checkbox"
        id="field_${key}"
        ${value?"checked":""}
        style="width:auto">

       ${escapeHTML(label)}

      </label>

     </div>`;
   }

   if(type==="textarea"){

    return `

     <div class="formGroup full">

      <label>
       ${escapeHTML(label)}
      </label>

      <textarea
       id="field_${key}"
       ${required?"required":""}>${escapeHTML(
        typeof value==="object"
        ?safeJSON(value)
        :value
       )}</textarea>

     </div>`;
   }

   return `

    <div class="formGroup">

     <label>
      ${escapeHTML(label)}
     </label>

     <input
      id="field_${key}"
      type="${type}"
      value="${escapeHTML(
       type==="datetime-local"&&value
       ?String(value).slice(0,16)
       :value
      )}"
      ${required?"required":""}>

    </div>`;

  }).join("");

 document.body.insertAdjacentHTML(
  "beforeend",
  `

  <div
   class="modal"
   id="moduleModal">

   <div class="modalBox">

    <div class="modalHead">

     <h2>
      ${id?"Edit":"Add"}
      ${escapeHTML(cfg.title)}
     </h2>

     <button
      class="closeBtn"
      onclick="closeModal()">
      ✕
     </button>

    </div>

    <div class="formGrid">

     ${fields}

    </div>

    <div
     id="moduleFormMessage">
    </div>

    <div
     style="display:flex;gap:10px;margin-top:20px">

     <button
      class="btn secondary"
      onclick="closeModal()">
      Cancel
     </button>

     <button
      class="btn primary"
      onclick='saveModuleRecord(
       "${module}",
       "${id||""}"
      )'>
      ${id?"Save Changes":"Create Record"}
     </button>

    </div>

   </div>

  </div>`
 );
}

function editModuleRecord(
 module,
 id
){

 openModuleForm(
  module,
  id
 );
}

function closeModal(){

 document
  .getElementById(
   "moduleModal"
  )
  ?.remove();
}

/* =========================================================
   SAVE MODULE
========================================================= */

async function saveModuleRecord(
 module,
 id
){

 const cfg=MODULES[module];

 const payload={};

 for(
  const f of cfg.fields
 ){

  const key=f[0];
  const type=f[2];

  const el=
   document.getElementById(
    "field_"+key
   );

  if(!el)continue;

  if(type==="checkbox"){

   payload[key]=el.checked;

   continue;
  }

  let value=el.value;

  if(value===""){

   payload[key]=null;

   continue;
  }

  if(type==="number"){

   payload[key]=Number(value);

   continue;
  }

  if(
   key==="eligible_states"||
   key==="eligible_countries"
  ){

   payload[key]=
    value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

   continue;
  }

  if(key==="metadata"){

   try{

    payload[key]=
     JSON.parse(
      value||"{}"
     );

   }catch(e){

    showModuleMessage(
     "Metadata must contain valid JSON.",
     "error"
    );

    return;
   }

   continue;
  }

  if(
   key==="created_by"||
   key==="reviewed_by"
  )
   continue;

  payload[key]=value;
 }

 if(
  (module==="exams"||
   module==="questions")&&
  !id
 ){

  payload.created_by=
   user.id;
 }

 try{

  let result;

  if(id){

   result=
    await db
     .from(cfg.table)
     .update(payload)
     .eq("id",id);

  }else{

   result=
    await db
     .from(cfg.table)
     .insert(payload);
  }

  if(result.error){

   showModuleMessage(
    result.error.message,
    "error"
   );

   return;
  }

  closeModal();

  await loadModule(module);

 }catch(error){

  showModuleMessage(
   error.message||
   "Save failed.",
   "error"
  );
}

}

function showModuleMessage(
 message,
 type
){

 const box=
  document.getElementById(
   "moduleFormMessage"
  );

 if(!box)return;

 box.innerHTML=
 `<div
  class="authMessage ${
   type==="error"
   ?"error"
   :"success"
  } show">
  ${escapeHTML(message)}
 </div>`;
}

async function deleteModuleRecord(
 module,
 id

 ))
  return;

 try{

  const result=
   await db
    .from(cfg.table)
    .delete()
    .eq("id",id);

  if(result.error){

   alert(

   );

   return;
  }

  await loadModule(module);

 }catch(error){

  alert(
   "Delete failed:\n\n"+
   error.message
  );
 }
}

async function loadStudents(){

 const area=
  document.getElementById(
   "studentManagementArea"
  );

 if(!area)return;

 area.innerHTML=
 `<div class="loading">
  Loading students...
 </div>`;

 try{

  const rolesResult=
   await db
    .from("user_roles")
    .select(
     "id,user_id,role,is_active,created_at"
    )
    .eq("role","student")
    .order("created_at",{
     ascending:false
    });

  if(rolesResult.error){

   area.innerHTML=
   `<div class="errorBox">
    ${escapeHTML(
     rolesResult.error.message
    )}
   </div>`;

   return;
  }

  const roles=
   rolesResult.data||[];

  const ids=
   roles
    .map(x=>x.user_id)
    .filter(Boolean);

  if(!ids.length){

   allStudents=[];

   updateStudentStats();

   area.innerHTML=
   `<div class="tableEmpty">
    <h3>No students yet</h3>
   </div>`;

   return;
  }

  const profilesResult=
   await db
    .from("profiles")
    .select("*")
    .in("id",ids);

  if(profilesResult.error){

   area.innerHTML=
   `<div class="errorBox">
    ${escapeHTML(
     profilesResult.error.message
    )}
   </div>`;

   return;
  }

  allStudents=
   roles.map(r=>{

    const p=
     (profilesResult.data||[])
      .find(
       x=>x.id===r.user_id
      )||{};

    return {
     ...p,
     user_id:r.user_id,
     role:r.role,
     is_active:r.is_active
    };
   });

  updateStudentStats();

  renderStudentTable(
   allStudents
  );

 }catch(error){

  area.innerHTML=
   `<div class="errorBox">
    ${escapeHTML(error.message)}
   </div>`;
 }
}

function updateStudentStats(){

 const total=

 const active=

  ).length;

 const el1=
  document.getElementById(
   "totalStudents"
  );

 if(el1)el1.textContent=total;

 const el2=
  document.getElementById(
   "activeStudents"
  );

 if(el2)el2.textContent=active;

 const el3=
  document.getElementById(
   "inactiveStudents"
  );

 if(el3)
  el3.textContent=
   total-active;

 const el4=
  document.getElementById(
   "showingStudents"
  );

 if(el4)
  el4.textContent=total;
}

async function loadTutors(){

 const area=
  document.getElementById(
   "tutorArea"
  );

 if(!area)return;

 const roles=
  await db
   .from("user_roles")
   .select(
    "user_id,role,is_active,created_at"
   )
   .eq("role","tutor")
   .order("created_at",{
    ascending:false
   });

 if(roles.error){

  area.innerHTML=
   `<div class="errorBox">
    ${escapeHTML(
     roles.error.message
    )}
   </div>`;

  return;
 }

 const ids=
  (roles.data||[])
  .map(x=>x.user_id);

 if(!ids.length){

  tutorRows=[];

  area.innerHTML=
   `<div class="tableEmpty">
    <h3>No tutors yet</h3>
   </div>`;

  return;
 }

 const profiles=
  await db
   .from("profiles")
   .select("*")
   .in("id",ids);

 if(profiles.error){

  area.innerHTML=
   `<div class="errorBox">
    ${escapeHTML(
     profiles.error.message
    )}
   </div>`;

  return;
 }

 tutorRows=
  (roles.data||[]).map(r=>{

   const p=
    (profiles.data||[])
    .find(
     x=>x.id===r.user_id
    )||{};

   return {
    ...p,
    user_id:r.user_id,
    is_active:r.is_active
   };
  });

 renderTutorTable(
  tutorRows
 );
}

function filterTutors(){

 const q=
  (
   document.getElementById(
    "tutorSearch"
   )?.value||""
  )
  .toLowerCase()
  .trim();

 const rows=
  !q
  ?tutorRows
  :tutorRows.filter(t=>
   JSON.stringify(t)
    .toLowerCase()
    .includes(q)
  );

 renderTutorTable(rows);
}

function renderTutorTable(rows){

 const area=
  document.getElementById(
   "tutorArea"
  );

 if(!area)return;

 if(!rows.length){

  area.innerHTML=
   `<div class="tableEmpty">
    <h3>No tutors found</h3>
   </div>`;

  return;
 }

 area.innerHTML=`

 <table class="studentTable">

  <thead>

   <tr>
    <th>Tutor</th>
    <th>Email</th>
    <th>Phone</th>
    <th>State</th>
    <th>Status</th>
   </tr>

  </thead>

  <tbody>

   ${rows.map(t=>{

    const name=
     t.display_name||
     `${t.first_name||""}
      ${t.last_name||""}`
     .trim()||
     "Tutor";

    return `

     <tr>

      <td>
       <strong>
        ${escapeHTML(name)}
       </strong>
      </td>

      <td>
       ${escapeHTML(
        t.email||"—"
       )}
      </td>

      <td>
       ${escapeHTML(
        t.phone||"—"
       )}
      </td>

      <td>
       ${escapeHTML(
        t.state||"—"
       )}
      </td>

      <td>

       <span
        class="badge ${
         t.is_active
         ?"badgeGreen"
         :"badgeRed"
        }">

        ${t.is_active
         ?"Active"
         :"Inactive"}

       </span>

      </td>

     </tr>`;

   }).join("")}

  </tbody>

 </table>`;
}

async function loadReports(){

 const ids=[

  [
   "reportStudents",
   "user_roles",
   [["role","student"]]
  ],

  [
   "reportTutors",
   "user_roles",
   [["role","tutor"]]
  ],

  [
   "reportSubjects",
   "subjects",
   []
  ],

  [
   "reportQuestions",
   "questions",
   []
  ],

  [
   "reportExams",
   "exams",
   []
  ],

  [
   "reportMaterials",
   "materials",
   []
  ],

  [
   "reportScholarships",
   "scholarships",
   []
  ],

  [
   "reportTransactions",
   "transactions",
   []
  ],

  [
   "reportWithdrawals",
   "withdrawals",
   []
  ]

 ];

 for(
  const [
   id,
   table,
   filters
  ] of ids
 ){

  const n=
   await countTable(
    table,
    filters
   );

  const el=
   document.getElementById(id);

  if(el)
   el.textContent=n;
 }

 try{

  const r=
   await db
    .from("transactions")
    .select("amount");

  const total=
   (r.data||[])
   .reduce(
    (sum,x)=>
     sum+
     Number(
      x.amount||0
     ),
    0
   );

  const el=
   document.getElementById(
    "reportRevenue"
   );

  if(el)
   el.textContent=
    money(total);

 }catch(e){}
}
