function escapeHTML(value){
 if(value===null||value===undefined)return "";
 return String(value)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function showAuthMessage(message,type=""){
 const box=document.getElementById("authMessage");
 if(!box)return;
 box.textContent=message;
 box.className="authMessage show "+type;
}

function clearAuthMessage(){
 const box=document.getElementById("authMessage");
 if(!box)return;
 box.textContent="";
 box.className="authMessage";
}

function money(value){
 const n=Number(value||0);
 return "₦"+n.toLocaleString("en-NG",{minimumFractionDigits:0});
}

function dateText(value){
 if(!value)return "—";
 const d=new Date(value);
 return isNaN(d)?"—":d.toLocaleDateString("en-NG");
}

function safeJSON(value){
 try{return JSON.stringify(value||{});}
 catch(e){return "{}";}

/* =========================================================
   AUTH
========================================================= */

async function register(event){
 event.preventDefault();
 clearAuthMessage();

 const firstName=document.getElementById("firstName").value.trim();
 const lastName=document.getElementById("lastName").value.trim();
 const email=document.getElementById("registerEmail").value.trim();
 const password=document.getElementById("registerPassword").value;
 const button=document.getElementById("registerButton");

 button.disabled=true;
 button.textContent="Creating account...";
 showAuthMessage("Creating your account...");

 try{
  const result=await db.auth.signUp({
   email,password,
   options:{
    data:{
     first_name:firstName,
     last_name:lastName,
     requested_role:selectedRole
    }
   }
  });

  if(result.error){
   showAuthMessage(result.error.message,"error");
   button.disabled=false;
   button.textContent="Create Account";
   return;
  }

  if(!result.data.session){
   showAuthMessage(
    "Account created. Please confirm your email, then sign in.",
    "success"
   );
   button.disabled=false;
   button.textContent="Create Account";
   return;
  }

  await loadCurrentUser();
 }catch(error){
  console.error(error);
  showAuthMessage(error.message||"Registration failed.","error");
  button.disabled=false;
  button.textContent="Create Account";
 }
}

async function login(event){
 event.preventDefault();
 clearAuthMessage();

 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPassword").value;
 const button=document.getElementById("loginButton");

 button.disabled=true;
 button.textContent="Signing in...";
 showAuthMessage("Signing you in...");

 try{
  const result=await db.auth.signInWithPassword({email,password});

  if(result.error){
   showAuthMessage(result.error.message,"error");
   button.disabled=false;
   button.textContent="Sign In";
   return;
  }

  await loadCurrentUser();
 }catch(error){
  console.error(error);
  showAuthMessage(error.message||"Login failed.","error");
  button.disabled=false;
  button.textContent="Sign In";
 }
}

async function loadCurrentUser(){
 try{
  const auth=await db.auth.getUser();

  if(auth.error||!auth.data.user){
   user=null;profile=null;role=null;
   renderLanding();
   return;
  }

  user=auth.data.user;

  const profileResult=await db
   .from("profiles")
   .select("*")
   .eq("id",user.id)
   .maybeSingle();

  profile=profileResult.data||{
   id:user.id,email:user.email,display_name:user.email
  };

  const roleResult=await db
   .from("user_roles")
   .select("role,is_active,created_at")
   .eq("user_id",user.id)
   .eq("is_active",true)
   .order("created_at",{ascending:true})
   .limit(1)
   .maybeSingle();

  role=roleResult.data?.role||"student";

  openPortal();
 }catch(error){
  console.error(error);
  renderLanding();
 }
}

function openPortal(){
 if(!user){renderLanding();return}
 if(role==="admin"){renderAdmin();return}
 if(role==="tutor"){renderTutor();return}
 renderStudent();
}

async function countTable(table,filters=[]){
 try{
  let q=db.from(table).select("*",{count:"exact",head:true});
  filters.forEach(([column,value])=>q=q.eq(column,value));
  const r=await q;
  return r.error?0:(r.count||0);
 }catch(e){return 0}
}

}

async function loadStudents(){
 const area=document.getElementById("studentManagementArea");
 if(!area)return;

 area.innerHTML=`<div class="loading">Loading students...</div>`;

 try{
  const rolesResult=await db.from("user_roles")
   .select("id,user_id,role,is_active,created_at")
   .eq("role","student")
   .order("created_at",{ascending:false});

  if(rolesResult.error){
   area.innerHTML=`<div class="errorBox">${escapeHTML(rolesResult.error.message)}</div>`;
   return;
  }

  const roles=rolesResult.data||[];
  const ids=roles.map(x=>x.user_id).filter(Boolean);

  if(!ids.length){
   allStudents=[];
   updateStudentStats();
   area.innerHTML=`<div class="tableEmpty"><h3>No students yet</h3></div>`;
   return;
  }

  const profilesResult=await db.from("profiles")
   .select("*").in("id",ids);

  if(profilesResult.error){
   area.innerHTML=`<div class="errorBox">${escapeHTML(profilesResult.error.message)}</div>`;
   return;
  }

  allStudents=roles.map(r=>{
   const p=(profilesResult.data||[]).find(x=>x.id===r.user_id)||{};
   return {...p,user_id:r.user_id,role:r.role,is_active:r.is_active};
  });

  updateStudentStats();
  renderStudentTable(allStudents);
 }catch(error){
  area.innerHTML=`<div class="errorBox">${escapeHTML(error.message)}</div>`;
 }
}

function updateStudentStats(){
 const total=allStudents.length;
 const active=allStudents.filter(x=>x.is_active!==false).length;

 if(document.getElementById("totalStudents"))
  document.getElementById("totalStudents").textContent=total;
 if(document.getElementById("activeStudents"))
  document.getElementById("activeStudents").textContent=active;
 if(document.getElementById("inactiveStudents"))
  document.getElementById("inactiveStudents").textContent=total-active;
 if(document.getElementById("showingStudents"))
  document.getElementById("showingStudents").textContent=total;
}

function filterStudents(){
 const search=(document.getElementById("studentSearch")?.value||"").toLowerCase().trim();

 if(!search){
  renderStudentTable(allStudents);
  if(document.getElementById("showingStudents"))
   document.getElementById("showingStudents").textContent=allStudents.length;
  return;
 }

 const rows=allStudents.filter(s=>{
  const text=[
   s.first_name,s.last_name,s.display_name,s.email,s.phone
  ].filter(Boolean).join(" ").toLowerCase();
  return text.includes(search);
 });

 if(document.getElementById("showingStudents"))
  document.getElementById("showingStudents").textContent=rows.length;

 renderStudentTable(rows);
}

function renderStudentTable(students){
 const area=document.getElementById("studentManagementArea");
 if(!area)return;

 if(!students.length){
  area.innerHTML=`<div class="tableEmpty"><h3>No students found</h3></div>`;
  return;
 }

 area.innerHTML=`
 <table class="studentTable">
 <thead><tr>
  <th>#</th><th>Student</th><th>Phone</th><th>Location</th><th>Status</th><th>Action</th>
 </tr></thead>
 <tbody>
 ${students.map((s,i)=>{
  const name=s.display_name||
   `${s.first_name||""} ${s.last_name||""}`.trim()||"Unnamed Student";
  const active=s.is_active!==false;
  return `<tr>
   <td>${i+1}</td>
   <td><div class="studentName">${escapeHTML(name)}</div>
   <div class="studentEmail">${escapeHTML(s.email||"No email")}</div></td>
   <td>${escapeHTML(s.phone||"—")}</td>
   <td>${escapeHTML([s.state,s.lga].filter(Boolean).join(", ")||"—")}</td>
   <td><span class="badge ${active?"badgeGreen":"badgeRed"}">

   <td><button class="btn secondary" style="padding:7px 11px"
   onclick="viewStudent('${s.id||s.user_id}')">View</button></td>
  </tr>`;
 }).join("")}
 </tbody></table>`;
}

 document.getElementById("app").innerHTML=`

  <h1>${cfg.icon} ${escapeHTML(cfg.title)}</h1>

    placeholder="Search..." oninput="filterModuleRows()">
   <button class="btn primary" onclick="openModuleForm('${module}')">

  </div>

 </main></div></div>`;

async function loadModule(module){
 const cfg=MODULES[module];
 const area=document.getElementById("moduleArea");
 if(!area)return;

 area.innerHTML=`<div class="loading">Loading ${escapeHTML(cfg.title)}...</div>`;

 try{
  const result=await db.from(cfg.table)
   .select("*")
   .order("created_at",{ascending:false})
   .limit(500);

  if(result.error){
   area.innerHTML=`
   <div class="errorBox">
    <strong>Could not load ${escapeHTML(cfg.title)}.</strong>
    <br><br>${escapeHTML(result.error.message)}
   </div>`;
   return;
  }

  currentModuleRows=result.data||[];
  renderModuleTable(module,currentModuleRows);
 }catch(error){
  area.innerHTML=`<div class="errorBox">${escapeHTML(error.message)}</div>`;
 }
}

function filterModuleRows(){
 const q=(document.getElementById("moduleSearch")?.value||"")
 .toLowerCase().trim();

 if(!q){
  const title=document.querySelector(".topbar strong")?.textContent||"";
  const module=Object.keys(MODULES).find(k=>MODULES[k].title===title);
  if(module)renderModuleTable(module,currentModuleRows);
  return;
 }

 const rows=currentModuleRows.filter(row=>
  JSON.stringify(row).toLowerCase().includes(q)
 );

 const title=document.querySelector(".topbar strong")?.textContent||"";
 const module=Object.keys(MODULES).find(k=>MODULES[k].title===title);
 if(module)renderModuleTable(module,rows);
}

 if(!area)return;

 if(!rows.length){
  area.innerHTML=`
  <div class="tableEmpty">
   <h3>No ${escapeHTML(cfg.title.toLowerCase())} found</h3>
   <p style="margin-top:8px">Click + Add to create the first record.</p>
  </div>`;
  return;
 }

 area.innerHTML=`
 <table class="studentTable">
 <thead>
 <tr>
  ${cfg.columns.map(c=>`<th>${escapeHTML(c[1])}</th>`).join("")}
  <th>Actions</th>
 </tr>
 </thead>
 <tbody>
 ${rows.map(row=>`
 <tr>
  ${cfg.columns.map(c=>{
   let v=row[c[0]];
   if(c[0].includes("at"))v=dateText(v);
   if(Array.isArray(v))v=v.join(", ");
   if(typeof v==="object"&&v!==null)v=safeJSON(v);
   return `<td>${escapeHTML(v??"—")}</td>`;
  }).join("")}
  <td>
   <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn secondary" style="padding:7px 10px"
     onclick='editModuleRecord("${module}","${row.id}")'>Edit</button>
    <button class="btn danger" style="padding:7px 10px"
     onclick='deleteModuleRecord("${module}","${row.id}")'>Delete</button>
   </div>
  </td>
 </tr>`).join("")}
 </tbody>
 </table>`;
}

/* =========================================================
   MODULE FORM
========================================================= */

function openModuleForm(module,id=null){
 const cfg=MODULES[module];
 const existing=id?currentModuleRows.find(x=>x.id===id):null;

 const fields=cfg.fields.map(f=>{
  const [key,label,type,required]=f;
  let value=existing?.[key];

  if(value===undefined||value===null)
   value=cfg.defaults?.[key]??"";

  if(type==="checkbox"){
   return `
   <div class="formGroup">
    <label>
     <input type="checkbox" id="field_${key}"
      ${value?"checked":""} style="width:auto">
     ${escapeHTML(label)}
    </label>
   </div>`;
  }

  if(type==="textarea"){
   return `
   <div class="formGroup full">
    <label>${escapeHTML(label)}</label>
    <textarea id="field_${key}" ${required?"required":""}>${escapeHTML(
     typeof value==="object"?safeJSON(value):value
    )}</textarea>
   </div>`;
  }

  return `
  <div class="formGroup">
   <label>${escapeHTML(label)}</label>
   <input id="field_${key}" type="${type}"
    value="${escapeHTML(
     type==="datetime-local"&&value
     ?String(value).slice(0,16)
     :value
    )}" ${required?"required":""}>
  </div>`;
 }).join("");

 document.body.insertAdjacentHTML("beforeend",`
 <div class="modal" id="moduleModal">
  <div class="modalBox">
   <div class="modalHead">
    <h2>${id?"Edit":"Add"} ${escapeHTML(cfg.title)}</h2>
    <button class="closeBtn" onclick="closeModal()">✕</button>
   </div>

   <p class="muted">
    ${id?"Update this record.":"Create a new record."}
   </p>

   <div class="formGrid">
    ${fields}
   </div>

   <div id="moduleFormMessage"></div>

   <div style="display:flex;gap:10px;margin-top:20px">
    <button class="btn secondary" onclick="closeModal()">Cancel</button>
    <button class="btn primary"
     onclick="saveModuleRecord('${module}','${id||""}')">
     ${id?"Save Changes":"Create Record"}
    </button>
   </div>
  </div>
 </div>`);
}

function editModuleRecord(module,id){
 openModuleForm(module,id);
}

function closeModal(){
 document.getElementById("moduleModal")?.remove();
}

/* =========================================================
   SAVE MODULE
========================================================= */

async function saveModuleRecord(module,id){
 const cfg=MODULES[module];
 const payload={};

 for(const f of cfg.fields){
  const key=f[0];
  const type=f[2];
  const el=document.getElementById("field_"+key);
  if(!el)continue;

  if(type==="checkbox"){
   payload[key]=el.checked;
   continue;
  }

  let value=el.value;

  if(value===""){
   payload[key]=null;
   continue;
  }

  if(type==="number"){
   payload[key]=Number(value);
   continue;
  }

  if(key==="eligible_states"||key==="eligible_countries"){
   payload[key]=value.split(",").map(x=>x.trim()).filter(Boolean);
   continue;
  }

  if(key==="metadata"){
   try{
    payload[key]=JSON.parse(value||"{}");
   }catch(e){
    showModuleMessage("Metadata must contain valid JSON.","error");
    return;
   }
   continue;
  }

  if(key==="created_by"||key==="reviewed_by"){
   continue;
  }

  payload[key]=value;
 }

 /*
  Automatically attach the logged-in admin
  where the database requires created_by.
 */
 if((module==="exams"||module==="questions")&&!id){
  payload.created_by=user.id;
 }

 try{
  let result;

  if(id){
   result=await db.from(cfg.table)
    .update(payload)
    .eq("id",id);
  }else{
   result=await db.from(cfg.table)
    .insert(payload);
  }

  if(result.error){
   showModuleMessage(result.error.message,"error");
   return;
  }

  closeModal();
  await loadModule(module);

 }catch(error){
  showModuleMessage(error.message||"Save failed.","error");
 }
}

function showModuleMessage(message,type){
 const box=document.getElementById("moduleFormMessage");
 if(!box)return;
 box.innerHTML=`
 <div class="authMessage ${type==="error"?"error":"success"} show">
 ${escapeHTML(message)}
 </div>`;
}

/* =========================================================
   DELETE
========================================================= */

async function deleteModuleRecord(module,id){
 const cfg=MODULES[module];

 if(!confirm(`Delete this ${cfg.title.toLowerCase()} record?`))
  return;

 try{
  const result=await db.from(cfg.table)
   .delete()
   .eq("id",id);

  if(result.error){
   alert("Delete failed:\n\n"+result.error.message);
   return;
  }

  await loadModule(module);
 }catch(error){
  alert("Delete failed:\n\n"+error.message);
 }
}

let tutorRows=[];

async function renderTutors(){
 document.getElementById("app").innerHTML=`
 <div class="portal">${adminSidebar()}<div class="main">
 ${portalHeader("Tutor Management")}
 <main class="content">
  <h1>👨‍🏫 Tutor Management</h1>
  <p class="muted">Registered tutor accounts.</p>

  <div class="moduleToolbar">
   <input id="tutorSearch" class="searchBox"
    placeholder="Search tutors..." oninput="filterTutors()">
   <button class="btn secondary" onclick="loadTutors()">↻ Refresh</button>
  </div>

  <div id="tutorArea" class="studentTableWrap">
   <div class="loading">Loading tutors...</div>
  </div>
 </main></div></div>`;

 await loadTutors();
}

async function loadTutors(){
 const area=document.getElementById("tutorArea");
 if(!area)return;

 const roles=await db.from("user_roles")
  .select("user_id,role,is_active,created_at")
  .eq("role","tutor")
  .order("created_at",{ascending:false});

 if(roles.error){
  area.innerHTML=`<div class="errorBox">${escapeHTML(roles.error.message)}</div>`;
  return;
 }

 const ids=(roles.data||[]).map(x=>x.user_id);

 if(!ids.length){
  tutorRows=[];
  area.innerHTML=`<div class="tableEmpty"><h3>No tutors yet</h3></div>`;
  return;
 }

 const profiles=await db.from("profiles")
  .select("*").in("id",ids);

 if(profiles.error){
  area.innerHTML=`<div class="errorBox">${escapeHTML(profiles.error.message)}</div>`;
  return;
 }

 tutorRows=(roles.data||[]).map(r=>{
  const p=(profiles.data||[]).find(x=>x.id===r.user_id)||{};
  return {...p,user_id:r.user_id,is_active:r.is_active};
 });

 renderTutorTable(tutorRows);
}

function filterTutors(){
 const q=(document.getElementById("tutorSearch")?.value||"")
 .toLowerCase().trim();

 const rows=!q?tutorRows:tutorRows.filter(t=>
  JSON.stringify(t).toLowerCase().includes(q)
 );

 renderTutorTable(rows);
}

function renderTutorTable(rows){
 const area=document.getElementById("tutorArea");
 if(!area)return;

 if(!rows.length){
  area.innerHTML=`<div class="tableEmpty"><h3>No tutors found</h3></div>`;
  return;
 }

 area.innerHTML=`
 <table class="studentTable">
 <thead><tr>
  <th>Tutor</th><th>Email</th><th>Phone</th><th>State</th><th>Status</th>
 </tr></thead>
 <tbody>
 ${rows.map(t=>{
  const name=t.display_name||
   `${t.first_name||""} ${t.last_name||""}`.trim()||"Tutor";
  return `<tr>
   <td><strong>${escapeHTML(name)}</strong></td>
   <td>${escapeHTML(t.email||"—")}</td>
   <td>${escapeHTML(t.phone||"—")}</td>
   <td>${escapeHTML(t.state||"—")}</td>
   <td><span class="badge ${t.is_active?"badgeGreen":"badgeRed"}">
    ${t.is_active?"Active":"Inactive"}
   </span></td>
  </tr>`;
 }).join("")}
 </tbody>
 </table>`;
}

  ["reportSubscriptions","subscriptions",[]],

 ];

  const r=await db.from("transactions").select("amount");

  if(el)el.textContent=money(total);
 }catch(e){}
}
