/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function safeJSON(value){

  try{
    return JSON.stringify(value);
  }catch{
    return String(value);
  }

}


function dateText(value){

  if(!value)return "—";

  try{
    return new Date(value).toLocaleString(
      "en-NG",
      {
        dateStyle:"medium",
        timeStyle:"short"
      }
    );
  }catch{
    return String(value);
  }

}


function initials(name){

  return String(name||"U")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();

}


function normalizeAnswer(value){

  if(value===null||value===undefined)
    return "";

  return String(value)
    .trim()
    .toUpperCase()
    .replace("OPTION ","");

}


function slugify(value){

  return String(value||"")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");

}


function showError(message){

  alert(message||"An error occurred.");

}


async function countTable(table,filters=[]){

  let query=db
    .from(table)
    .select("*",{count:"exact",head:true});

  filters.forEach(([column,value])=>{
    query=query.eq(column,value);
  });

  const result=await query;

  return result.count||0;

}

function renderLogin(){

  document.getElementById("app").innerHTML=`

    <div class="authScreen">

      <div class="authBox">

        <h1>PHILMYSCHOOL</h1>

        <p class="muted">
          Student and Admin Portal
        </p>

        <div class="authTabs">

          <button
            class="btn primary"
            id="loginTab"
            onclick="showAuthMode('login')">

            Login

          </button>

          <button
            class="btn secondary"

            onclick="showAuthMode('register')">

          </button>

      </div>

    </div>

  `;

function showAuthMode(mode){

  const area=document.getElementById("authArea");

  if(!area)return;

  area.innerHTML=`

    <form
      class="authForm"
      onsubmit="handleAuth(event,'${mode}')">

      ${
        mode==="register"
        ?`

        <input
          id="authFirstName"
          placeholder="First name"
          required>

        <input
          id="authLastName"
          placeholder="Last name"
          required>

        `
        :""
      }

      <input
        id="authEmail"
        type="email"
        placeholder="Email address"
        required>

      <input
        id="authPassword"
        type="password"
        placeholder="Password"
        minlength="6"
        required>

      <button
        class="btn primary"
        type="submit">

        ${
          mode==="login"
          ?"Login"
          :"Create Student Account"
        }

      </button>

      ${
        mode==="login"
        ?`

        <button
          type="button"
          class="btn secondary"
          onclick="forgotPassword()">

          Forgot Password?

        </button>

        `
        :""
      }

    </form>

    <div id="authMessage"></div>

  `;

}


async function handleAuth(event,mode){

  event.preventDefault();

  const message=
    document.getElementById("authMessage");

  try{

    if(mode==="login"){

      const email=
        document.getElementById("authEmail").value.trim();

      const password=
        document.getElementById("authPassword").value;

      const result=
        await db.auth.signInWithPassword({
          email,
          password
        });

      if(result.error){

        message.innerHTML=`
          <div class="errorBox">
            ${escapeHTML(result.error.message)}
          </div>`;

        return;
      }

      await loadCurrentUser();

      return;
    }


    const firstName=
      document.getElementById("authFirstName").value.trim();

    const lastName=
      document.getElementById("authLastName").value.trim();

    const email=
      document.getElementById("authEmail").value.trim();

    const password=
      document.getElementById("authPassword").value;


    const result=
      await db.auth.signUp({

        email,
        password,

        options:{
          data:{
            first_name:firstName,
            last_name:lastName,
            display_name:
              `${firstName} ${lastName}`.trim()
          }
        }

      });


    if(result.error){

      message.innerHTML=`
        <div class="errorBox">
          ${escapeHTML(result.error.message)}
        </div>`;

      return;
    }


    if(result.data.session){

      await loadCurrentUser();

    }else{

      message.innerHTML=`
        <div class="successBox">
          Account created successfully.
          Check your email if email confirmation
          is enabled, then log in.
        </div>`;

    }

  }catch(error){

    message.innerHTML=`
      <div class="errorBox">
        ${escapeHTML(error.message)}
      </div>`;

  }

}


async function forgotPassword(){

  const email=
    prompt("Enter your account email:");

  if(!email)return;

  const result=
    await db.auth.resetPasswordForEmail(
      email.trim(),
      {
        redirectTo:
          window.location.origin+
          window.location.pathname
      }
    );

  if(result.error){

    alert(result.error.message);

  }else{

    alert(
      "Password reset instructions have been sent."
    );

  }

}

async function loadCurrentUser(){

  const sessionResult=
    await db.auth.getSession();

  const session=
    sessionResult.data?.session;

  if(!session){

    renderLanding();
    return;
  }

  user=session.user;


  const profileResult=
    await db
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();


  profile=
    profileResult.data||{
      id:user.id,
      email:user.email
    };


  const roleResult=
    await db
      .from("user_roles")
      .select("role,is_active")
      .eq("user_id",user.id)
      .eq("is_active",true)
      .order("created_at",{ascending:false})
      .limit(1)
      .maybeSingle();


  role=
    roleResult.data?.role||
    "student";


  if(role==="admin"){

    renderAdmin();

  }else if(role==="tutor"){

    renderTutor();

  }else{

    role="student";
    renderStudent();

  }

}

async function loadAdminQuestions(){

  const area=
    document.getElementById("questionArea");

  if(!area)return;


  const result=
    await db
      .from("questions")
      .select(`
        *,
        topics(
          id,
          name,
          subject_id,
          subjects(
            id,
            name,
            code
          )
        ),
        question_options(
          id,
          option_label,
          option_text,
          is_correct
        )
      `)
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(5000);


  if(result.error){

    /*
      Fallback for installations where nested
      relationship names differ.
    */

    const fallback=
      await db
        .from("questions")
        .select("*")
        .order(
          "created_at",
          {ascending:false}
        )
        .limit(5000);


    if(fallback.error){

      area.innerHTML=`
        <div class="errorBox">
          ${escapeHTML(
            fallback.error.message
          )}
        </div>`;

      return;
    }


    adminQuestionRows=
      fallback.data||[];

  }else{

    adminQuestionRows=
      result.data||[];

  }


  renderAdminQuestionTable(
    adminQuestionRows
  );

}


function filterAdminQuestions(){

  const search=
    document.getElementById(
      "questionSearch"
    )?.value
    .toLowerCase()
    .trim()||"";


  const subject=
    document.getElementById(
      "questionSubject"
    )?.value||"";


  const rows=
    adminQuestionRows.filter(q=>{

      const text=
        JSON.stringify(q)
          .toLowerCase();


      const matchesSearch=
        !search||
        text.includes(search);


      const subjectId=
        q.topic?.subject_id||
        q.subject_id||
        "";


      const matchesSubject=
        !subject||
        subjectId===subject;


      return(
        matchesSearch&&
        matchesSubject
      );

    });


  renderAdminQuestionTable(rows);

}


function getQuestionOptions(q){

  if(
    Array.isArray(q.question_options)
  ){

    return q.question_options
      .slice()
      .sort((a,b)=>
        String(a.option_label||"")
          .localeCompare(
            String(b.option_label||"")
          )
      );

  }


  return [];

}

async function saveSubject(id){

  const name=
    document.getElementById(
      "subjectName"
    ).value.trim();


  const code=
    document.getElementById(
      "subjectCode"
    ).value.trim();


  const description=
    document.getElementById(
      "subjectDescription"
    ).value.trim();


  if(!name){

    alert("Subject name is required.");
    return;

  }


  /*
    The confirmed structure uses subjects.name
    and subjects.code.
  */

  const payload={
    name,
    code:code||null,
    description:description||null
  };


  let result;


  if(id){

    result=
      await db
        .from("subjects")
        .update(payload)
        .eq("id",id);

  }else{

    result=
      await db
        .from("subjects")
        .insert(payload);

  }


  if(result.error){

    document.getElementById(
      "subjectMessage"
    ).innerHTML=`

      <div class="errorBox">
        ${escapeHTML(
          result.error.message
        )}
      </div>

    `;

    return;

  }


  closeGenericModal("subjectModal");

  await renderSubjects();

}


async function deleteSubject(id){

  if(!confirm(
    "Delete this subject?"
  ))return;


  const result=
    await db
      .from("subjects")
      .delete()
      .eq("id",id);


  if(result.error){

    alert(result.error.message);
    return;

  }


  await renderSubjects();

}

async function saveQuestion(id){

  const subjectId=
    document.getElementById(
      "qSubject"
    ).value;


  const topicId=
    document.getElementById(
      "qTopic"
    ).value;


  const questionText=
    document.getElementById(
      "qText"
    ).value.trim();


  const answer=
    document.getElementById(
      "qAnswer"
    ).value;


  const difficulty=
    document.getElementById(
      "qDifficulty"
    ).value;


  const marks=
    Number(
      document.getElementById(
        "qMarks"
      ).value||1
    );


  const status=
    document.getElementById(
      "qStatus"
    ).value;


  const feedback=
    document.getElementById(
      "qFeedback"
    ).value.trim();


  const recommendation=
    document.getElementById(
      "qRecommendation"
    ).value.trim();


  const optionValues={};

  for(const letter of ["A","B","C","D"]){

    optionValues[letter]=
      document.getElementById(
        "qOption"+letter
      ).value.trim();

  }


  if(
    !subjectId||
    !topicId||
    !questionText||
    !optionValues.A||
    !optionValues.B||
    !optionValues.C||
    !optionValues.D
  ){

    alert(
      "Subject, topic, question and all four options are required."
    );

    return;

  }


  /*
    The question itself belongs to a topic.
    The subject is therefore represented through
    the topic relationship.
  */

  const payload={

    topic_id:topicId,

    question_text:questionText,

    difficulty,

    marks,

    status,

    feedback:
      feedback||null,

    recommendation:
      recommendation||null,

    created_by:
      id
      ?undefined
      :user.id

  };


  if(payload.created_by===undefined)
    delete payload.created_by;


  let result;


  if(id){

    result=
      await db
        .from("questions")
        .update(payload)
        .eq("id",id);

  }else{

    result=
      await db
        .from("questions")
        .insert(payload)
        .select("id")
        .single();

  }


  if(result.error){

    document.getElementById(
      "questionMessage"
    ).innerHTML=`

      <div class="errorBox">

        ${escapeHTML(
          result.error.message
        )}

      </div>

    `;

    return;

  }


  const questionId=
    id||
    result.data?.id;


  if(!questionId){

    alert(
      "Question saved, but its ID could not be determined."
    );

    return;

  }


  /*
    Replace the four options.
  */

  if(id){

    const deleteOptions=
      await db
        .from("question_options")
        .delete()
        .eq(
          "question_id",
          questionId
        );


    if(deleteOptions.error){

      document.getElementById(
        "questionMessage"
      ).innerHTML=`

        <div class="errorBox">
          Question saved but old options
          could not be replaced:
          ${escapeHTML(
            deleteOptions.error.message
          )}
        </div>

      `;

      return;

    }

  }


  const optionPayload=
    ["A","B","C","D"].map(letter=>({

      question_id:
        questionId,

      option_label:
        letter,

      option_text:
        optionValues[letter],

      is_correct:
        letter===answer

    }));


  const optionsResult=
    await db
      .from("question_options")
      .insert(optionPayload);


  if(optionsResult.error){

    document.getElementById(
      "questionMessage"
    ).innerHTML=`

      <div class="errorBox">

        Question saved, but options could
        not be saved:

        ${escapeHTML(
          optionsResult.error.message
        )}

      </div>

    `;

    return;

  }


  closeGenericModal(
    "questionModal"
  );


  await renderAdminQuestionBank();

}


async function deleteQuestion(id){

  if(!confirm(
    "Delete this question permanently?"
  ))return;


  /*
    Delete options first.
  */

  const optionsResult=
    await db
      .from("question_options")
      .delete()
      .eq("question_id",id);


  if(optionsResult.error){

    alert(
      optionsResult.error.message

  const result=
    await db
      .from("questions")
      .delete()
      .eq("id",id);


  if(result.error){

    alert(
      result.error.message
    );

    return;

  }


  await renderAdminQuestionBank();

}

function parseCSV(text){

  const rows=[];
  let row=[];
  let cell="";
  let quoted=false;


  for(let i=0;i<text.length;i++){

    const char=text[i];
    const next=text[i+1];


    if(char==='"'){

      if(quoted&&next==='"'){

        cell+='"';
        i++;

      }else{

        quoted=!quoted;

      }

      continue;

    }


    if(char===","&&!quoted){

      row.push(cell);
      cell="";
      continue;

    }


    if(
      (char==="\n"||
       char==="\r")&&!quoted
    ){

      if(
        char==="\r"&&
        next==="\n"
      ){
        i++;
      }


      row.push(cell);

      if(row.some(x=>x.trim()!==""))
        rows.push(row);


      row=[];
      cell="";
      continue;

    }


    cell+=char;

  }


  row.push(cell);


  if(
    row.some(x=>x.trim()!=="")
  )
    rows.push(row);


  return rows;

}


async function importCSVQuestions(){

  const file=
    document.getElementById(
      "csvFile"
    ).files[0];


  const message=
    document.getElementById(
      "csvMessage"
    );


  if(!file){

    message.innerHTML=`
      <div class="errorBox">
        Select a CSV file first.
      </div>
    `;

    return;

  }


  try{

    const text=
      await file.text();


    const rows=
      parseCSV(text);


    if(rows.length<2){

      throw new Error(
        "The CSV file is empty."
      );

    }


    const headers=
      rows[0].map(
        x=>x.trim().toLowerCase()
      );


    const required=[
      "subject_code",
      "topic",
      "question_text",
      "option_a",
      "option_b",
      "option_c",
      "option_d",
      "correct_answer"
    ];


    const missing=
      required.filter(
        x=>!headers.includes(x)
      );


    if(missing.length){

      throw new Error(
        "Missing columns: "+
        missing.join(", ")
      );

    }


    await loadSubjects();
    await loadTopics();


    let imported=0;
    let failed=0;
    const errors=[];


    for(
      let index=1;
      index<rows.length;
      index++
    ){

      const values=rows[index];


      const record={};

      headers.forEach((header,i)=>{
        record[header]=
          (values[i]||"").trim();
      });


      try{

        const subject=
          subjects.find(s=>
            String(
              s.code||
              s.subject_code||
              ""
            ).toLowerCase()
            ===
            record.subject_code
              .toLowerCase()
          );


        if(!subject){

          throw new Error(
            `Subject code ${record.subject_code} not found`
          );

        }


        let topic=
          topics.find(t=>
            t.subject_id===subject.id&&
            String(
              t.name||
              t.topic_name||
              ""
            ).toLowerCase()
            ===
            record.topic.toLowerCase()
          );


        if(!topic){

          const topicResult=
            await db
              .from("topics")
              .insert({
                subject_id:
                  subject.id,
                name:
                  record.topic
              })
              .select("*")
              .single();


          if(topicResult.error)
            throw topicResult.error;


          topic=
            topicResult.data;

          topics.push(topic);

        }


        const questionResult=
          await db
            .from("questions")
            .insert({

              topic_id:
                topic.id,

              question_text:
                record.question_text,

              difficulty:
                record.difficulty||
                "medium",

              marks:
                Number(
                  record.marks||1
                ),

              feedback:
                record.feedback||
                null,

              recommendation:
                record.recommendation||
                null,

              status:
                "published",

              created_by:
                user.id

            })
            .select("id")
            .single();


        if(questionResult.error)
          throw questionResult.error;


        const questionId=
          questionResult.data.id;


        const answer=
          normalizeAnswer(
            record.correct_answer
          );


        const optionPayload=
          ["A","B","C","D"].map(letter=>({

            question_id:
              questionId,

            option_label:
              letter,

            option_text:
              record[
                "option_"+
                letter.toLowerCase()
              ],

            is_correct:
              letter===answer

          }));


        const optionResult=
          await db
            .from("question_options")
            .insert(optionPayload);


        if(optionResult.error)
          throw optionResult.error;


        imported++;

      }catch(error){

        failed++;

        errors.push(
          `Row ${index+1}: ${error.message}`
        );

      }

    }


    message.innerHTML=`

      <div class="${
        failed
        ?"errorBox"
        :"successBox"
      }">

        Imported:
        <strong>${imported}</strong>

        <br>

        Failed:
        <strong>${failed}</strong>

        ${
          errors.length
          ?`

            <div style="
              margin-top:10px;
              max-height:180px;
              overflow:auto">

              ${errors.map(
                x=>`
                  <div>
                    ${escapeHTML(x)}
                  </div>
                `
              ).join("")}

            </div>

          `
          :""
        }

      </div>

    `;


    if(imported){

      await renderAdminQuestionBank();

    }

  }catch(error){

    message.innerHTML=`

      <div class="errorBox">

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}

async function saveExam(id){

  const slugInput=
    document.getElementById(

    ).value.trim();


  const payload={

    title,

    slug:
      slugInput||
      slugify(title),

    description:
      document.getElementById(
        "examDescription"
      ).value.trim()||null,

    exam_type:
      document.getElementById(
        "examType"
      ).value.trim()||"mock",

    mode:
      document.getElementById(
        "examMode"
      ).value.trim()||"cbt",

    duration_minutes:
      Number(
        document.getElementById(
          "examDuration"
        ).value||60
      ),

    total_questions:
      Number(
        document.getElementById(
          "examTotalQuestions"
        ).value||0
      ),

    total_marks:
      Number(
        document.getElementById(
          "examTotalMarks"
        ).value||0
      ),

    pass_mark:
      Number(
        document.getElementById(
          "examPassMark"
        ).value||40
      ),

    instructions:
      document.getElementById(
        "examInstructions"
      ).value.trim()||null,

    randomize_questions:
      document.getElementById(
        "examRandomQuestions"
      ).checked,

    randomize_options:
      document.getElementById(
        "examRandomOptions"
      ).checked,

    allow_back_navigation:
      document.getElementById(
        "examBackNavigation"
      ).checked,

    show_result_immediately:
      document.getElementById(
        "examImmediateResult"
      ).checked,

    access_level:
      document.getElementById(
        "examAccess"
      ).value,

    price:
      Number(
        document.getElementById(
          "examPrice"
        ).value||0
      ),

    currency:
      document.getElementById(
        "examCurrency"
      ).value.trim()||
      "NGN",

    status:
      document.getElementById(
        "examStatus"
      ).value

  };


  let result;


  if(id){

    result=
      await db
        .from("exams")
        .update(payload)
        .eq("id",id);

  }else{

    result=
      await db
        .from("exams")

async function saveExamQuestions(examId){

  const checks=
    [...document.querySelectorAll(
      ".examQuestionCheck:checked"
    )];


  const questionIds=
    checks.map(
      x=>x.value
    );


  const message=
    document.getElementById(
      "examQuestionMessage"
    );


  try{

    const remove=
      await db
        .from("exam_questions")
        .delete()
        .eq("exam_id",examId);


    if(remove.error)
      throw remove.error;


    if(questionIds.length){

      const payload=
        questionIds.map(
          (questionId,index)=>({

            exam_id:
              examId,

            question_id:
              questionId,

            question_order:
              index+1

          })
        );


      const insert=
        await db
          .from("exam_questions")
          .insert(payload);


      if(insert.error)
        throw insert.error;

    }


    closeGenericModal(
      "examQuestionsModal"
    );


    alert(
      `${questionIds.length} question(s) assigned to the exam.`
    );


    await renderAdminExams();

  }catch(error){

    message.innerHTML=`

      <div class="errorBox">

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}

async function startExam(examId){

  const examResult=
    await db
      .from("exams")
      .select("*")
      .eq("id",examId)
      .single();


  if(examResult.error){

    alert(
      examResult.error.message
    );

    return;

  }


  const exam=
    examResult.data;


  const questionsResult=
    await db
      .from("exam_questions")
      .select(`
        *,
        questions(
          *,
          topics(
            id,
            name,
            subject_id,
            subjects(
              id,
              name,
              code
            )
          ),
          question_options(
            id,
            option_label,
            option_text,
            is_correct
          )
        )
      `)
      .eq(
        "exam_id",
        examId
      )
      .order(
        "question_order"
      );


  if(questionsResult.error){

    alert(
      questionsResult.error.message
    );

    return;

  }


  let rows=
    (questionsResult.data||[])
      .map(x=>x.questions)
      .filter(Boolean);


  if(!rows.length){

    alert(
      "This examination has no questions assigned yet."
    );

    return;

  }


  if(exam.randomize_questions){

    rows=
      shuffle(rows);

  }


  currentExam=
    exam;


  currentExamQuestions=
    rows;


  currentQuestionIndex=0;


  selectedAnswers={};


  if(exam.randomize_options){

    currentExamQuestions=
      currentExamQuestions.map(q=>({

        ...q,

        question_options:
          shuffle(
            q.question_options||[]
          )

      }));

  }


  const attemptResult=
    await db
      .from("exam_attempts")
      .insert({

        exam_id:
          exam.id,

        student_id:
          user.id,

        started_at:
          new Date().toISOString(),

        status:
          "in_progress"

      })
      .select("*")
      .single();


  if(attemptResult.error){

    /*
      Some schemas may require different attempt
      status names. Display the actual Supabase
      error instead of silently failing.
    */

    alert(
      attemptResult.error.message
    );

    return;

  }


  currentAttempt=
    attemptResult.data;


  cbtSeconds=
    Number(
      exam.duration_minutes||60
    )*60;


  renderCBT();


  startCBTTimer();

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

  const copy=
    [...array];


  for(
    let i=copy.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );


    [
      copy[i],
      copy[j]
    ]=[
      copy[j],
      copy[i]
    ];

  }


  return copy;

}

  const q=

    submitCBT(true);
    return;

  }


  const options=
    q.question_options||[];


  const answered=

            }).join("")}

              }

              ?`

                  onclick="nextQuestion()">

                </button>

              `

                      index===currentQuestionIndex
                      ?"current"
                      :""
                    }
                    ${
                      selectedAnswers[item.id]
                      ?"answered"
                      :""
                    }"
                  onclick="
                    goToQuestion(${index})">

                  ${index+1}

                </button>

              `
            ).join("")}

          </div>

          <p class="muted"
             style="margin-top:12px">

            ${answered}
            /
            ${currentExamQuestions.length}

          </p>

        </div>

      </main>

    </div>

  `;


  updateTimerDisplay();

}


function chooseAnswer(questionId,answer){

  selectedAnswers[
    questionId
  ]=normalizeAnswer(answer);


  saveCurrentAnswer();


  renderCBT();

}


function previousQuestion(){

  if(currentQuestionIndex<=0)
    return;


  currentQuestionIndex--;

  renderCBT();

}


function nextQuestion(){

  if(
    currentQuestionIndex<
    currentExamQuestions.length-1
  ){

    currentQuestionIndex++;

    renderCBT();

  }

}


function goToQuestion(index){

  if(
    index>=0&&
    index<currentExamQuestions.length
  ){

    currentQuestionIndex=index;

    renderCBT();

  }

}

async function saveCurrentAnswer(){

  if(!currentAttempt)return;


  const q=
    currentExamQuestions[
      currentQuestionIndex
    ];


  if(!q)return;


  const answer=
    selectedAnswers[q.id]||
    null;


  /*
    Remove an existing answer first.
    This keeps one answer per question.
  */

  const remove=
    await db
      .from("exam_answers")
      .delete()
      .eq(
        "attempt_id",
        currentAttempt.id
      )
      .eq(
        "question_id",
        q.id
      );


  if(remove.error){

    console.warn(
      "Could not clear previous answer:",
      remove.error.message
    );

  }


  if(!answer)return;


  const result=
    await db
      .from("exam_answers")
      .insert({

        attempt_id:
          currentAttempt.id,

        question_id:
          q.id,

        selected_answer:
          answer

      });


  if(result.error){

    console.warn(
      "Could not save answer:",
      result.error.message
    );

  }

}


/* =========================================================
   TIMER
========================================================= */

function startCBTTimer(){

  clearInterval(cbtTimer);


  cbtTimer=
    setInterval(()=>{

      cbtSeconds--;


      updateTimerDisplay();


      if(cbtSeconds<=0){

        clearInterval(cbtTimer);

        submitCBT(true);

      }

    },1000);

}


function updateTimerDisplay(){

  const timer=
    document.getElementById(
      "cbtTimer"
    );


  if(!timer)return;


  const minutes=
    Math.floor(
      cbtSeconds/60
    );


  const seconds=
    cbtSeconds%60;


  timer.textContent=
    String(minutes).padStart(2,"0")+
    ":"+
    String(seconds).padStart(2,"0");


  if(cbtSeconds<=60){

    timer.classList.add(
      "warning"
    );

  }

}


function confirmSubmitCBT(){

  const unanswered=
    currentExamQuestions.length-
    Object.keys(
      selectedAnswers
    ).length;


  const message=
    unanswered>0
    ?`You have ${unanswered} unanswered question(s). Submit anyway?`
    :"Submit your examination now?";


  if(confirm(message)){

    submitCBT(false);

  }

}


/* =========================================================
   SUBMIT CBT
========================================================= */

async function submitCBT(autoSubmit=false){

  if(!currentAttempt)return;


  clearInterval(cbtTimer);


  /*
    Save current answer before calculating.
  */

  await saveCurrentAnswer();


  const questionIds=
    currentExamQuestions.map(
      q=>q.id
    );


  /*
    Load all saved answers.
  */

  const answersResult=
    await db
      .from("exam_answers")
      .select("*")
      .eq(
        "attempt_id",
        currentAttempt.id
      );


  if(answersResult.error){

    alert(
      answersResult.error.message
    );

    return;

  }


  const answers=
    answersResult.data||[];


  let correct=0;
  let wrong=0;
  let unanswered=0;
  let totalMarks=0;
  let earnedMarks=0;


  const detailedAnswers=[];


  currentExamQuestions.forEach(q=>{

    const answerRow=
      answers.find(
        a=>a.question_id===q.id
      );


    const selected=
      normalizeAnswer(
        answerRow?.selected_answer
      );


    const options=
      q.question_options||[];


    const correctOption=
      options.find(
        o=>o.is_correct
      );


    const correctAnswer=
      normalizeAnswer(
        correctOption?.option_label
      );


    const marks=
      Number(q.marks||1);


    totalMarks+=marks;


    let status;


    if(!selected){

      unanswered++;

      status="unanswered";

    }else if(
      selected===correctAnswer
    ){

      correct++;

      earnedMarks+=marks;

      status="correct";

    }else{

      wrong++;

      status="wrong";

    }


    detailedAnswers.push({

      question:q,

      selected,

      correctAnswer,

      status,

      marks

    });

  });


  const percentage=
    totalMarks>0
    ?Math.round(
      (earnedMarks/
       totalMarks)*100
    )
    :0;


  const passMark=
    Number(
      currentExam.pass_mark||
      40
    );


  const resultStatus=
    percentage>=passMark
    ?"passed"
    :"failed";


  /*
    Update attempt.
  */

  const attemptUpdate={

    submitted_at:
      new Date().toISOString(),

    status:
      "completed",

    score:
      earnedMarks,

    percentage,

    correct_answers:
      correct,

    wrong_answers:
      wrong,

    unanswered,

    total_questions:
      currentExamQuestions.length

  };


  const updateResult=
    await db
      .from("exam_attempts")
      .update(attemptUpdate)
      .eq(
        "id",
        currentAttempt.id
      );


  if(updateResult.error){

    alert(
      updateResult.error.message
    );

    return;

  }


  const resultData={

    exam:
      currentExam,

    attempt:
      {
        ...currentAttempt,
        ...attemptUpdate,
        result_status:resultStatus
      },

    answers:
      detailedAnswers

  };


  currentAttempt=
    resultData.attempt;


  currentExam=
    resultData.exam;


  renderResult(
    resultData
  );

}

async function genericAdminTable(
  title,
  table,
  columns,
  fields
){

  document.getElementById("app").innerHTML=`

    <div class="portal">

      ${adminSidebar()}

      <div class="main">

        ${portalHeader(title)}

        <main class="content">

          <h1>
            ${escapeHTML(title)}
          </h1>

          <div class="moduleToolbar">

            <button
              class="btn primary"
              onclick="openGenericTableForm(
                '${table}',
                '${escapeHTML(title)}',
                ${JSON.stringify(fields)
                  .replace(/"/g,"&quot;")}
              )">

              + Add

            </button>

            <button
              class="btn secondary"
              onclick="
                genericAdminTable(
                  '${table}',
                  '${table}',
                  ${JSON.stringify(columns)},
                  ${JSON.stringify(fields)}
                )">

              ↻ Refresh

            </button>

          </div>

          <div
            id="genericArea"
            class="studentTableWrap">

            <div class="loading">
              Loading...
            </div>

          </div>

        </main>

      </div>

    </div>

  `;


  const result=
    await db
      .from(table)
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(500);


  const area=
    document.getElementById(
      "genericArea"
    );


  if(result.error){

    area.innerHTML=`
      <div class="errorBox">
        ${escapeHTML(
          result.error.message
        )}
      </div>
    `;

    return;

  }


  const rows=
    result.data||[];


  if(!rows.length){

    area.innerHTML=`
      <div class="tableEmpty">
        <h3>No records found.</h3>
      </div>
    `;

    return;

  }


  area.innerHTML=`

    <table class="studentTable">

      <thead>

        <tr>

          ${columns.map(c=>`
            <th>
              ${escapeHTML(c[1])}
            </th>
          `).join("")}

        </tr>

      </thead>

      <tbody>

        ${rows.map(r=>`

          <tr>

            ${columns.map(c=>`

              <td>
                ${escapeHTML(
                  r[c[0]]??"—"
                )}
              </td>

            `).join("")}

          </tr>

        `).join("")}

      </tbody>

    </table>

  `;

}

function openGenericTableForm(
  table,
  title,
  fields
){

  document.body.insertAdjacentHTML(
    "beforeend",
    `

      <div class="modal"
           id="genericModal">

        <div class="modalBox">

          <div class="modalHead">

            <h2>
              Add ${escapeHTML(title)}
            </h2>

            <button
              class="closeBtn"
              onclick="
                closeGenericModal('genericModal')">

              ✕

            </button>

          </div>

          <div class="formGrid">

            ${fields.map(f=>`

              <div class="
                formGroup
                ${
                  f[2]==="textarea"
                  ?"full"
                  :""
                }">

                <label>
                  ${escapeHTML(f[1])}
                </label>

                ${
                  f[2]==="textarea"
                  ?`

                    <textarea
                      id="generic_${f[0]}">
                    </textarea>

                  `
                  :`

                    <input
                      id="generic_${f[0]}"
                      type="${f[2]}">

                  `
                }

              </div>

            `).join("")}

          </div>

          <div id="genericMessage"></div>

          <button
            class="btn primary"
            style="margin-top:20px"
            onclick="
              saveGenericTableRecord(
                '${table}',
                ${JSON.stringify(fields)
                  .replace(/"/g,"&quot;")}
              )">

            Create

          </button>

        </div>

      </div>

    `
  );

}


async function saveGenericTableRecord(
  table,
  fields
){

  const payload={};


  fields.forEach(f=>{

    const el=
      document.getElementById(
        "generic_"+f[0]
      );


    if(!el)return;


    let value=
      el.value.trim();


    if(value===""){

      payload[f[0]]=null;

    }else if(f[2]==="number"){

      payload[f[0]]=Number(value);

    }else{

      payload[f[0]]=value;

    }

  });


  const result=
    await db
      .from(table)
      .insert(payload);


  if(result.error){

    document.getElementById(
      "genericMessage"
    ).innerHTML=`

      <div class="errorBox">

        ${escapeHTML(
          result.error.message
        )}

      </div>

    `;

    return;

  }


  closeGenericModal(
    "genericModal"
  );


  alert(
    "Record created successfully."
  );

}

let loggingOut=false;


async function logout(){

  if(loggingOut)return;


  loggingOut=true;


  try{

    await db.auth.signOut();

  }catch(error){

    console.error(
      "Logout error:",
      error
    );

  }


  clearInterval(cbtTimer);


  user=null;
  profile=null;
  role=null;

  currentExam=null;
  currentAttempt=null;
  currentExamQuestions=[];
  selectedAnswers={};


  loggingOut=false;


  renderLogin();

}
