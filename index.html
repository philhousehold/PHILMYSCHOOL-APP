<!DOCTYPE html>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;

  --border:#e2e8f0;
  --green:#16a34a;
  --red:#dc2626;

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);

}

button,
input,
select,
textarea{
  font:inherit;
}

button{

}

a{

}

.hidden{
  display:none!important;
}

.muted{
  color:var(--muted);
}

.loading{
  padding:35px;
  text-align:center;
  color:var(--muted);
}

.errorBox{
  padding:15px;
  border-radius:10px;
  background:#fee2e2;
  color:#991b1b;
  margin-top:15px;
  white-space:pre-wrap;
}

.successBox{
  padding:15px;
  border-radius:10px;
  background:#dcfce7;
  color:#166534;
  margin-top:15px;
}

.tableEmpty{

  padding:50px 20px;
  color:var(--muted);
}

.btn{
  border:0;
  border-radius:9px;

  font-weight:700;

}

.btn:hover{

}

.btn.primary{

  color:#fff;
}

.btn.primary:hover{

}

.btn.secondary{

}

.btn.danger{

  color:#b91c1c;
}

.btn.success{
  background:#dcfce7;
  color:#166534;
}

.btn.full{
  width:100%;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{

}

textarea{

<script>
/* =========================================================
   PHILMYSCHOOL
   COMPLETE SUPABASE REPLACEMENT
========================================================= */

const SUPABASE_URL =
  "https://qyoonyndkrlprobuikul.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_-HIg7bCv6G1hLQoh5OWasA_hvhWrYOx";

let db=null;

function initializeSupabase(){

  try{
    if(
      typeof window.supabase === "undefined" ||
      typeof window.supabase.createClient !== "function"
    ){
      throw new Error("Supabase library failed to load. Check your internet connection or CDN access.");
    }

    db=window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth:{
          autoRefreshToken:true,
          persistSession:true,
          detectSessionInUrl:true,
          flowType:"pkce"
        }
      }
    );

    return true;
  }catch(error){
    console.error("Supabase initialization error:",error);
    showFatalStartupError(error);
    return false;
  }
}

function showFatalStartupError(error){
  const app=document.getElementById("app");
  if(!app)return;
  app.innerHTML=`
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f5f7fb;font-family:Arial,sans-serif">
      <div style="max-width:560px;width:100%;background:#fff;padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(15,23,42,.12)">
        <h2 style="color:#dc2626">PHILMYSCHOOL could not start</h2>
        <p style="margin-top:12px;color:#475569;line-height:1.6">The application could not initialize. The exact error is shown below.</p>
        <pre style="margin-top:18px;padding:14px;background:#fef2f2;color:#991b1b;border-radius:10px;white-space:pre-wrap;overflow:auto">${String(error?.stack||error?.message||error||"Unknown error").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</pre>
        <button onclick="location.reload()" style="margin-top:18px;border:0;border-radius:9px;padding:12px 18px;background:#2563eb;color:#fff;font-weight:700">Reload</button>
      </div>
    </div>`;
}

window.addEventListener("error",function(event){
  console.error("PHILMYSCHOOL runtime error:",event.error||event.message);
});

window.addEventListener("unhandledrejection",function(event){
  console.error("PHILMYSCHOOL unhandled rejection:",event.reason);
});

/* =========================================================
   GLOBAL STATE
========================================================= */

let user=null;
let profile=null;
let role=null;

let subjects=[];
let topics=[];
let questionRows=[];
let allStudents=[];
let tutorRows=[];
let currentModuleRows=[];

let currentExam=null;
let currentExamQuestions=[];
let currentExamSubjectIds=[];
let currentExamIndex=0;
let currentExamAnswers={};

let cbt={
  timer:null,
  seconds:0,
  attemptId:null,
  startedAt:null
};

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  let text=String(value??"");

  /* Normalize common mojibake from older records/hosting encodings. */
  text=text
    .replace(/\u00e2\u20ac\u201d/g,"-")
    .replace(/\u00e2\u20ac\u201c/g,"-")
    .replace(/\u00e2\u2020\u0090/g,"<-")
    .replace(/\u00e2\u2020\u0092/g,"->")
    .replace(/\u00e2\u201a\u00a6/g,"NGN ");

  /* Keep all displayed application text ASCII-safe. */
  text=text.replace(/[^\x00-\x7F]/g,"");

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeJSON(value){

  try{
    return JSON.stringify(value);
  }catch{
    return String(value);
  }
}

function dateText(value){

  if(!value)return "-";

  const d=new Date(value);

  if(Number.isNaN(d.getTime()))
    return String(value);

  return d.toLocaleString();
}

function money(value,currency="NGN"){

  const n=Number(value||0);

  return new Intl.NumberFormat(
    "en-NG",
    {
      style:"currency",
      currency:currency||"NGN"
    }
  ).format(n);
}

function normalizeAnswer(value){

  if(value===null||
     value===undefined)
    return "";

  let x=String(value)
    .trim()
    .toUpperCase();

  if(["A","B","C","D"].includes(x))
    return x;

  if(x.startsWith("OPTION "))
    x=x.replace("OPTION ","");

  if(x.startsWith("ANSWER "))
    x=x.replace("ANSWER ","");

  if(["A","B","C","D"].includes(x))
    return x;

  return x;
}

function showError(message){

  alert(message);
}

function getOptionValue(q,letter){

  const l=letter.toLowerCase();

  if(q["option_"+l]!==undefined)
    return q["option_"+l];

  if(q.options &&
     typeof q.options==="object"){

    return q.options[letter]||
           q.options[l]||
           "";
  }

  return "";
}

/* =========================================================
   AUTH / PROFILE
========================================================= */

async function loadCurrentUser(){

  window.__philyschoolBooted = true;

  const sessionResult=
    await db.auth.getSession();

  const session=
    sessionResult.data?.session;

  if(!session){

    renderLanding();
    return;
  }

  user=session.user;

  const profileResult=
    await db
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

  profile=
    profileResult.data||
    {
      id:user.id,
      email:user.email
    };

  const roleResult=
    await db
      .from("user_roles")
      .select("role,is_active")
      .eq("user_id",user.id)
      .order("created_at",{ascending:true})
      .limit(10);

  if(roleResult.error){

    console.error(
      "Role lookup:",
      roleResult.error
    );

    role="student";

  }else{

    const active=
      (roleResult.data||[])
      .find(x=>x.is_active!==false);

    role=
      active?.role||
      "student";
  }

  if(role==="admin"){

    renderAdmin();

  }else if(role==="tutor"){

    renderTutor();

  }else{

    renderStudent();
  }
}

/* =========================================================
   LANDING
========================================================= */

function renderLanding(){

  window.__philyschoolBooted = true;

async function registerStudent(){

  const firstName=
    document.getElementById(
      "regFirstName"
    ).value.trim();

  const lastName=
    document.getElementById(
      "regLastName"
    ).value.trim();

  const email=
    document.getElementById(
      "regEmail"
    ).value.trim();

  const password=
    document.getElementById(
      "regPassword"
    ).value;

  const password2=
    document.getElementById(
      "regPassword2"
    ).value;

  const phone=
    document.getElementById(
      "regPhone"
    ).value.trim();

  const state=
    document.getElementById(
      "regState"
    ).value.trim();

  const lga=
    document.getElementById(
      "regLGA"
    ).value.trim();

  if(
    !firstName||
    !lastName||
    !email||
    !password
  ){

    document.getElementById(
      "registerMessage"
    ).innerHTML=`

    <div class="errorBox">
     First name, last name, email and password
     are required.
    </div>`;

    return;
  }

  if(password!==password2){

    document.getElementById(
      "registerMessage"
    ).innerHTML=`

    <div class="errorBox">
     Passwords do not match.
    </div>`;

    return;
  }

  const auth=
    await db.auth.signUp({
      email,
      password,
      options:{
        data:{
          first_name:firstName,
          last_name:lastName,
          display_name:
            `${firstName} ${lastName}`
        }
      }
    });

  if(auth.error){

    document.getElementById(
      "registerMessage"
    ).innerHTML=`

    <div class="errorBox">
     ${escapeHTML(auth.error.message)}
    </div>`;

    return;
  }

  const newUser=auth.data.user;

  if(!newUser){

    document.getElementById(
      "registerMessage"
    ).innerHTML=`

    <div class="successBox">
     Registration submitted.
     Check your email if confirmation is required.
    </div>`;

    return;
  }

  /*
   * Some projects have a database trigger that creates
   * profiles automatically. We therefore try the profile
   * insert/update but do not break registration if a trigger
   * already created it.
  */

  const profilePayload={
    id:newUser.id,
    email,
    first_name:firstName,
    last_name:lastName,
    display_name:`${firstName} ${lastName}`,
    phone:phone||null,
    state:state||null,
    lga:lga||null
  };

  const profileWrite=
    await db
      .from("profiles")
      .upsert(
        profilePayload,
        {onConflict:"id"}
      );

  if(profileWrite.error){

    console.warn(
      "Profile write:",
      profileWrite.error
    );
  }

  /*
   * If the database allows the client to create the role,
   * create student role. If RLS blocks it, the account can
   * still be created by an existing trigger/admin workflow.
  */

  const roleWrite=
    await db
      .from("user_roles")
      .upsert({
        user_id:newUser.id,
        role:"student",
        is_active:true
      });

  if(roleWrite.error){

    console.warn(
      "Role write:",
      roleWrite.error
    );
  }

  if(auth.data.session){

    await loadCurrentUser();

  }else{

    document.getElementById(
      "registerMessage"
    ).innerHTML=`

    <div class="successBox">
     Account created successfully.
     Please check your email if email confirmation
     is enabled, then sign in.
    </div>`;

  }
}

========================================================= */

async function countTable(
  table,
  filters=[]
){

  try{

    let query=
      db
        .from(table)
        .select("*",{count:"exact",head:true});

    for(
      const filter
      of filters
    ){

      query=
        query.eq(
          filter[0],
          filter[1]
        );
    }

    const result=await query;

    if(result.error){

      console.warn(
        table,
        result.error.message
      );

      return "-";
    }

    return result.count??0;

  }catch(error){

    console.warn(error);

    return "-";
  }
}

async function saveSubject(id){

  const name=
    document.getElementById(
      "subjectName"
    ).value.trim();

  const code=
    document.getElementById(
      "subjectCode"
    ).value.trim();

  const subjectCodeValue=
    document.getElementById(
      "subjectCode2"
    ).value.trim();

  const description=
    document.getElementById(
      "subjectDescription"
    ).value.trim();

  if(!name){

    document.getElementById(
      "subjectMessage"
    ).innerHTML=`

    <div class="errorBox">
     Subject name is required.
    </div>`;

    return;
  }

  const existing=
    id
    ?subjects.find(
      s=>String(s.id)===String(id)
    )
    :null;

  const payload={};

  /*
   * Use columns that actually exist in the current
   * subjects table. This avoids sending nonexistent
   * columns.
  */

  if(
    existing?.name!==undefined||
    !existing
  )
    payload.name=name;

  if(
    existing?.code!==undefined||
    (!existing &&
     !existing?.subject_name)
  )
    payload.code=code||null;

  if(
    existing?.subject_code!==undefined
  )
    payload.subject_code=
      subjectCodeValue||null;

  if(
    existing?.description!==undefined
  )
    payload.description=
      description||null;

  /*
   * If the table already uses subject_name instead of
   * name, support it.
  */

  if(existing?.subject_name!==undefined){

    delete payload.name;

    payload.subject_name=name;
  }

  let result;

  if(id){

    result=
      await db
        .from("subjects")
        .update(payload)
        .eq("id",id);

  }else{

    result=
      await db
        .from("subjects")
        .insert(payload);
  }

  if(result.error){

    document.getElementById(
      "subjectMessage"
    ).innerHTML=`

    <div class="errorBox">
     ${escapeHTML(
       result.error.message
     )}
    </div>`;

    return;
  }

  closeSubjectModal();

  await adminSubjects();
}

async function deleteSubject(id){

  if(!confirm(
    "Delete this subject? Questions using this subject may be affected."
  ))
    return;

  const result=
    await db
      .from("subjects")
      .delete()
      .eq("id",id);

  if(result.error){

    alert(result.error.message);
    return;
  }

  await adminSubjects();
}

async function saveTopic(id){

  const name=
    document.getElementById(
      "topicName"
    ).value.trim();

  const subject_id=
    document.getElementById(
      "topicSubject"
    ).value||null;

  const description=
    document.getElementById(
      "topicDescription"
    ).value.trim()||null;

  if(!name){

    document.getElementById(
      "topicMessage"
    ).innerHTML=`

    <div class="errorBox">
     Topic name is required.
    </div>`;

    return;
  }

  const existing=
    id
    ?topics.find(
      t=>String(t.id)===String(id)
    )
    :null;

  const payload={};

  if(existing?.name!==undefined||!existing)
    payload.name=name;

  if(existing?.topic_name!==undefined){

    delete payload.name;

    payload.topic_name=name;
  }

  if(existing?.title!==undefined){

    delete payload.name;

    payload.title=name;
  }

  if(existing?.subject_id!==undefined||!existing)
    payload.subject_id=subject_id;

  if(existing?.description!==undefined||!existing)
    payload.description=description;

  let result;

  if(id){

    result=
      await db
        .from("topics")
        .update(payload)
        .eq("id",id);

  }else{

    result=
      await db
        .from("topics")
        .insert(payload);
  }

  if(result.error){

    document.getElementById(
      "topicMessage"
    ).innerHTML=`

    <div class="errorBox">
     ${escapeHTML(
       result.error.message
     )}
    </div>`;

    return;
  }

  closeTopicModal();

  await adminTopics();
}

async function loadQuestionBank(){

  const area=
    document.getElementById(
      "questionArea"
    );

  if(!area)return;

  area.innerHTML=`

  <div class="loading">
   Loading question bank...
  </div>`;

  /*
   * We first load the question table itself.
   */

  const result=
    await db
      .from("questions")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(5000);

  if(result.error){

    area.innerHTML=`

    <div class="errorBox">
     ${escapeHTML(
       result.error.message
     )}
    </div>`;

    return;
  }

  questionRows=result.data||[];

  /*
   * If question_options exists, attempt to attach
   * A/B/C/D options to the question rows.
   *
   * This is deliberately non-fatal because some
   * databases store options directly on questions.
   */

  if(questionRows.length){

    try{

      const ids=
        questionRows
          .map(q=>q.id)
          .filter(Boolean);

      const optionsResult=
        await db
          .from("question_options")
          .select("*")
          .in("question_id",ids);

      if(!optionsResult.error){

        const optionMap={};

        (optionsResult.data||[])
          .forEach(o=>{

            if(!optionMap[o.question_id])
              optionMap[o.question_id]=[];

            optionMap[o.question_id].push(o);
          });

        questionRows=
          questionRows.map(q=>({

            ...q,

            question_options:
              optionMap[q.id]||[]

          }));
      }

    }catch(error){

      console.warn(
        "Question options:",
        error
      );
    }
  }

  renderQuestionBank(questionRows);
}

function filterQuestionBank(){

  const search=
    document.getElementById(
      "questionSearch"
    )?.value
      .toLowerCase()
      .trim()||"";

  const subject=
    document.getElementById(
      "questionSubjectFilter"
    )?.value||"";

  const rows=
    questionRows.filter(q=>{

      const text=
        JSON.stringify(q)
          .toLowerCase();

      const matchesSearch=
        !search||
        text.includes(search);

      const matchesSubject=
        !subject||
        String(q.subject_id)===String(subject);

      return (
        matchesSearch&&
        matchesSubject
      );
    });

  renderQuestionBank(rows);
}

async function saveQuestion(id){

  const subject_id=getSubjectPickerIds("qSubjectPicker")[0]||"";

  const topic=
    document.getElementById(
      "qTopic"
    ).value.trim();

  const question_text=
    document.getElementById(
      "qText"
    ).value.trim();

  const option_a=
    document.getElementById(
      "qA"
    ).value.trim();

  const option_b=
    document.getElementById(
      "qB"
    ).value.trim();

  const option_c=
    document.getElementById(
      "qC"
    ).value.trim();

  const option_d=
    document.getElementById(
      "qD"
    ).value.trim();

  const correct_answer=
    document.getElementById(
      "qAnswer"
    ).value;

  const difficulty=
    document.getElementById(
      "qDifficulty"
    ).value;

  const marks=
    Number(
      document.getElementById(
        "qMarks"
      ).value||1
    );

  const status=
    document.getElementById(
      "qStatus"
    ).value;

  const feedback=
    document.getElementById(
      "qFeedback"
    ).value.trim()||null;

  const recommendation=
    document.getElementById(
      "qRecommendation"
    ).value.trim()||null;

  if(
    !subject_id||
    !question_text||
    !option_a||
    !option_b||
    !option_c||
    !option_d
  ){

    document.getElementById(
      "questionMessage"
    ).innerHTML=`

    <div class="errorBox">
     Subject, question and all four options
     are required.
    </div>`;

    return;
  }

  const existing=
    id
    ?questionRows.find(
      q=>String(q.id)===String(id)
    )
    :null;

  /*
   * Build the question payload using the common
   * columns from the existing system.
  */

  const payload={
    subject_id,
    topic_id: topic || null,
    question_text,
    correct_answer,
    difficulty,
    marks,
    status,
    feedback,
    recommendation
  };

  payload.topic_id=topic||null;

  /*
   * If the existing questions table stores the
   * four options directly, use those columns.
   */

  const hasDirectOptions=
    !existing||
    existing.option_a!==undefined||
    existing.option_b!==undefined||
    existing.option_c!==undefined||
    existing.option_d!==undefined;

  if(hasDirectOptions){

    payload.option_a=option_a;
    payload.option_b=option_b;
    payload.option_c=option_c;
    payload.option_d=option_d;
  }

  if(!id){

    payload.created_by=
      user?.id||null;
  }

  let result;

  if(id){

    result=
      await db
        .from("questions")
        .update(payload)
        .eq("id",id);

  }else{

    result=
      await db
        .from("questions")
        .insert(payload)
        .select()
        .single();
  }

  if(result.error){

    document.getElementById(
      "questionMessage"
    ).innerHTML=`

    <div class="errorBox">
     ${escapeHTML(
       result.error.message
     )}
    </div>`;

    return;
  }

  /*
   * If the database uses question_options,
   * synchronize A/B/C/D there as well.
   *
   * We do this only when the table is accessible.
  */

  const questionId=
    id||
    result.data?.id;

  if(questionId){

    const optionSync=await saveQuestionOptions(
      questionId,
      [
        ["A",option_a],
        ["B",option_b],
        ["C",option_c],
        ["D",option_d]
      ],
      correct_answer
    );

    if(!optionSync.success){
      document.getElementById("questionMessage").innerHTML=`<div class="errorBox">${escapeHTML(optionSync.error)}</div>`;
      return;
    }
  }

  closeQuestionModal();

  await adminQuestionBank();
}

async function saveQuestionOptions(questionId, options, correctAnswer=""){

  try{
    const normalizedCorrect=normalizeAnswer(correctAnswer);

    const del=await db
      .from("question_options")
      .delete()
      .eq("question_id",questionId);

    if(del.error){
      throw new Error("Could not clear existing options: "+del.error.message);
    }

    const rows=(options||[])
      .map((item,index)=>{
        const letter=String(item?.[0]||"").trim().toUpperCase();
        const text=String(item?.[1]||"").trim();
        return {
          question_id:questionId,
          option_key:letter,
          option_letter:letter,
          option_text:text,
          is_correct:letter===normalizedCorrect,
          sort_order:index
        };
      })
      .filter(row=>row.option_key && row.option_text);

    if(!rows.length){
      throw new Error("No valid answer options were supplied.");
    }

    const ins=await db
      .from("question_options")
      .insert(rows);

    if(ins.error){
      throw new Error(ins.error.message);
    }

    return {success:true};

  }catch(error){
    console.error("Question options sync:",error);
    return {success:false,error:error.message||"Could not save options."};
  }
}

async function deleteQuestion(id){

  if(!confirm(
    "Delete this question permanently?"
  ))
    return;

  /*
   * Delete options first where possible.
  */

  try{

    await db
      .from("question_options")
      .delete()
      .eq("question_id",id);

  }catch(error){

    console.warn(error);
  }

  const result=
    await db
      .from("questions")
      .delete()
      .eq("id",id);

  if(result.error){

function parseCSV(text){

  const rows=[];
  let row=[];
  let cell="";
  let quoted=false;

  for(let i=0;i<text.length;i++){

    const char=text[i];
    const next=text[i+1];

    if(char==='"'){

      if(quoted&&next==='"'){

        cell+='"';
        i++;

      }else{

        quoted=!quoted;
      }

      continue;
    }

    if(char===","&&!quoted){

      row.push(cell);
      cell="";
      continue;
    }

    if(
      (char==="\n"||
       char==="\r")&&!quoted
    ){

      if(
        char==="\r"&&
        next==="\n"
      ){
        i++;
      }

      row.push(cell);
      cell="";

      if(row.some(x=>x.trim()!==""))
        rows.push(row);

      row=[];
      continue;
    }

    cell+=char;
  }

  if(cell.length||row.length){

    row.push(cell);

    if(row.some(x=>x.trim()!==""))
      rows.push(row);
  }

  return rows;
}

function csvObjects(text){

  const rows=parseCSV(text);

  if(rows.length<2)
    return [];

  const headers=
    rows[0].map(
      h=>h.trim().toLowerCase()
    );

  return rows.slice(1).map(row=>{

    const obj={};

    headers.forEach(
      (h,i)=>{
        obj[h]=
          (row[i]||"").trim();
      }
    );

    return obj;
  });
}

async function importCSV(){

  const fileInput=document.getElementById("csvFile");
  const subjectSelect=document.getElementById("csvSubject");
  const message=document.getElementById("csvMessage");
  const button=document.getElementById("csvImportButton");

  if(!fileInput || !message){
    alert("The import window could not be opened correctly. Refresh the page and try again.");
    return;
  }

  const file=fileInput.files?.[0];
  if(!file){
    message.innerHTML=`<div class="errorBox">Select a CSV file first.</div>`;
    return;
  }

  if(button){
    button.disabled=true;
    button.textContent="Importing... Importing...";
  }

  message.innerHTML=`<div class="panel">Reading and validating your CSV...</div>`;

  try{
    const text=await file.text();
    const rows=csvObjects(text);

    if(!rows.length){
      throw new Error("No CSV records were found. Make sure the first row contains column headers.");
    }

    const defaultSubjectId=subjectSelect?.value||"";

    // Load subjects/topics once so CSV files may use IDs, names, or codes.
    const [subjectsResult,topicsResult]=await Promise.all([
      db.from("subjects").select("id,name,code,is_active"),
      db.from("topics").select("id,subject_id,name,is_active")
    ]);

    if(subjectsResult.error){
      throw new Error("Could not load subjects: "+subjectsResult.error.message);
    }

    if(topicsResult.error){
      throw new Error("Could not load topics: "+topicsResult.error.message);
    }

    const subjectList=subjectsResult.data||[];
    const topicList=topicsResult.data||[];

    const findSubjectId=(raw)=>{
      const value=String(raw||"").trim();
      if(!value)return defaultSubjectId||null;
      if(subjectList.some(x=>String(x.id)===value))return value;
      const lower=value.toLowerCase();
      const match=subjectList.find(x=>
        String(x.name||"").trim().toLowerCase()===lower ||
        String(x.code||"").trim().toLowerCase()===lower
      );
      return match?.id||null;
    };

    const findTopicId=(raw,subjectId)=>{
      const value=String(raw||"").trim();
      if(!value)return null;
      if(topicList.some(x=>String(x.id)===value))return value;
      const lower=value.toLowerCase();
      const match=topicList.find(x=>
        String(x.subject_id||"")===String(subjectId||"") &&
        String(x.name||"").trim().toLowerCase()===lower
      );
      return match?.id||null;
    };

    let inserted=0;
    let failed=0;
    const errors=[];

    for(let i=0;i<rows.length;i++){
      const r=rows[i]||{};

      try{
        const subjectId=findSubjectId(
          r.subject_id||r.subject_id_uuid||r.subject||r.subject_name||r.subject_code
        );

        const topicId=findTopicId(
          r.topic_id||r.topic||r.topic_name,
          subjectId
        );

        const questionText=String(
          r.question_text||r.question||r.text||""
        ).trim();

        const optionA=String(r.option_a||r.a||"").trim();
        const optionB=String(r.option_b||r.b||"").trim();
        const optionC=String(r.option_c||r.c||"").trim();
        const optionD=String(r.option_d||r.d||"").trim();

        const correctAnswer=normalizeAnswer(
          r.correct_answer||r.answer||r.correct
        );

        if(!subjectId)throw new Error("Subject was not found. Use a subject UUID, subject name/code, or select Default Subject.");
        if(!questionText)throw new Error("Question text is missing.");
        if(!optionA||!optionB||!optionC||!optionD)throw new Error("Options A, B, C and D are all required.");
        if(!["A","B","C","D"].includes(correctAnswer))throw new Error("Correct answer must be A, B, C or D.");

        const payload={
          subject_id:subjectId,
          topic_id:topicId,
          question_text:questionText,
          explanation:r.explanation||null,
          difficulty:r.difficulty||"medium",
          marks:Number(r.marks||1),
          source_type:r.source_type||"import",
          source_name:r.source_name||null,
          source_year:r.source_year?Number(r.source_year):null,
          status:r.status||"published",
          created_by:user?.id||null,
          reviewed_by:null,
          image_url:r.image_url||null,
          option_a:optionA,
          option_b:optionB,
          option_c:optionC,
          option_d:optionD,
          correct_answer:correctAnswer,
          feedback:r.feedback||null,
          recommendation:r.recommendation||null
        };

        const result=await db
          .from("questions")
          .insert(payload)
          .select("id")
          .single();

        if(result.error){
          throw new Error(result.error.message);
        }

        const questionId=result.data?.id;
        if(!questionId)throw new Error("Question was saved but no question ID was returned.");

        const optionResult=await saveQuestionOptions(
          questionId,
          [["A",optionA],["B",optionB],["C",optionC],["D",optionD]],
          correctAnswer
        );

        if(!optionResult.success){
          await db.from("questions").delete().eq("id",questionId);
          throw new Error(optionResult.error||"Could not save the answer options.");
        }

        inserted++;

      }catch(rowError){
        failed++;
        errors.push(`Row ${i+2}: ${rowError.message||"Unknown error"}`);
      }
    }

    const errorBlock=errors.length
      ?`<div style="margin-top:14px;max-height:240px;overflow:auto;white-space:pre-wrap;font-size:13px">${escapeHTML(errors.slice(0,30).join("\n"))}</div>`
      :"";

    message.innerHTML=`
      <div class="${failed?"errorBox":"successBox"}">
        <strong>Import complete</strong><br><br>
        Added: <strong>${inserted}</strong><br>
        Failed: <strong>${failed}</strong>
        ${errorBlock}
      </div>`;

    await loadQuestionBank();

  }catch(error){
    console.error("CSV IMPORT ERROR",error);
    message.innerHTML=`<div class="errorBox"><strong>Import failed</strong><br><br>${escapeHTML(error.message||"Unknown error")}</div>`;
  }finally{
    if(button){
      button.disabled=false;
      button.textContent=" Import Questions";
    }
  }
}

async function loadStudents(){

  const area=
    document.getElementById(
      "studentManagementArea"
    );

  const rolesResult=
    await db
      .from("user_roles")
      .select(
        "id,user_id,role,is_active,created_at"
      )
      .eq("role","student")
      .order(
        "created_at",
        {ascending:false}
      );

  if(rolesResult.error){

    area.innerHTML=`

    <div class="errorBox">
     ${escapeHTML(
       rolesResult.error.message
     )}
    </div>`;

    return;
  }

  const roles=
    rolesResult.data||[];

  const ids=
    roles
      .map(x=>x.user_id)
      .filter(Boolean);

  if(!ids.length){

    allStudents=[];

    area.innerHTML=`

    <div class="tableEmpty">
     <h3>No students yet</h3>
    </div>`;

    return;
  }

  const profilesResult=
    await db
      .from("profiles")
      .select("*")
      .in("id",ids);

  if(profilesResult.error){

    area.innerHTML=`

    <div class="errorBox">
     ${escapeHTML(
       profilesResult.error.message
     )}
    </div>`;

    return;
  }

  allStudents=
    roles.map(r=>{

      const p=
        (profilesResult.data||[])
          .find(
            x=>x.id===r.user_id
          )||{};

      return {
        ...p,
        user_id:r.user_id,
        role:r.role,
        is_active:r.is_active
      };
    });

  renderStudentTable(
    allStudents
  );
}

  try{

async function calculateStudentAverage(){

  const result=
    await db
      .from("exam_attempts")
      .select("*")
      .eq("student_id",user.id)
      .limit(500);

  if(result.error)
    return;

  const rows=result.data||[];

  const scores=
    rows
      .map(x=>{

        return Number(
          x.percentage||
          x.score_percentage||
          x.score||
          NaN
        );

      })
      .filter(
        x=>Number.isFinite(x)
      );

  const average=
    scores.length
    ?(
      scores.reduce(
        (a,b)=>a+b,
        0
      )/scores.length
    ).toFixed(1)+"%"
    :"-";

  const el=
    document.getElementById(
      "studentAverageScore"
    );

  if(el)
    el.textContent=average;
}

function normalizedExamStatus(value){
  return String(value||"")
    .trim()
    .toLowerCase()
    .replace(/[\s_-]+/g,"");
}

function isGeneralKnowledgeExam(exam){
  const title=String(exam?.title||"").trim().toLowerCase();
  const slug=String(exam?.slug||"").trim().toLowerCase();
  const type=String(exam?.exam_type||"").trim().toLowerCase();

  return (
    title.includes("general knowledge") ||
    slug.includes("general-knowledge") ||
    slug.includes("general_knowledge") ||
    type==="general knowledge"
  );
}

function isPublishedStudentExam(exam){
  return (
    normalizedExamStatus(exam?.status)==="published" &&
    !isGeneralKnowledgeExam(exam)
  );
}

async function getStudentExamSubjects(exam){
  const examId=String(exam?.id||"");
  if(!examId)return [];

  /*
   * IMPORTANT:
   * Students must only see subjects that are actually connected
   * to the published examination. The central subjects table is
   * the master list, but it must NOT be used as a fallback for an
   * exam selector because that would expose unrelated subjects.
   */
  try{
    const rpc=await db.rpc("get_student_exam_subjects",{p_exam_id:examId});
    if(!rpc.error){
      let data=rpc.data;
      if(typeof data==="string"){try{data=JSON.parse(data)}catch(_){}}
      if(Array.isArray(data)&&data.length)return data;
    }
  }catch(error){
    console.warn("Student exam subjects RPC:",error);
  }

  /* Direct fallback: Admin-configured exam_subjects -> subjects. */
  try{
    const link=await db
      .from("exam_subjects")
      .select("subject_id,is_compulsory,question_limit,sort_order,subject_order,is_active")
      .eq("exam_id",examId);

    if(!link.error&&(link.data||[]).length){
      const ids=[...(link.data||[]).map(x=>x.subject_id).filter(Boolean)];
      if(ids.length){
        const sr=await db
          .from("subjects")
          .select("*")
          .in("id",ids)
          .order("name",{ascending:true});
        if(!sr.error){
          const byId={};
          (link.data||[]).forEach(x=>byId[String(x.subject_id)]=x);
          return (sr.data||[])
            .filter(s=>byId[String(s.id)]?.is_active!==false)
            .map(s=>({
              ...s,
              is_compulsory:Boolean(byId[String(s.id)]?.is_compulsory),
              question_limit:Number(byId[String(s.id)]?.question_limit||0),
              sort_order:byId[String(s.id)]?.sort_order??byId[String(s.id)]?.subject_order??0
            }));
        }
      }
    }
  }catch(error){
    console.warn("Exam subject links:",error);
  }

  return [];
}

  const text=(String(exam?.title||"")+" "+String(exam?.exam_type||"")).toLowerCase();

async function loadExamQuestionPool(examId,subjectIds=[]){

  /*
   * IMPORTANT:
   * Do not trust get_exam_questions alone. Some installations
   * return only a small subset or return rows without the
   * question text/options. The source of truth is:
   *
   * exam_questions -> questions -> question_options
   *
   * The RPC is only used as a last-resort fallback.
   */

  let questions=[];
  try{
    const rpc=await db.rpc("get_student_exam_questions",{
      p_exam_id:String(examId),
      p_subject_ids:Array.isArray(subjectIds)?subjectIds:[]
    });
    let data=rpc.data;
    if(typeof data==="string"){try{data=JSON.parse(data);}catch(_){}}
    if(!rpc.error && Array.isArray(data)) questions=data;
  }catch(error){
    console.warn("Student question pool RPC:",error);
  }

  if(!questions.length && !subjectIds.length) questions=await loadStudentExamQuestionsLive(examId);

  if(questions.length){
    /*
     * Direct option_a/b/c/d fields remain the primary option source.
     * question_options is only a supplement.
     */
    try{
      const ids=questions.map(q=>q.id).filter(Boolean);

      if(ids.length){
        const optionsResult=await db
          .from("question_options")
          .select("*")
          .in("question_id",ids);

        if(!optionsResult.error){
          const optionMap={};

          (optionsResult.data||[]).forEach(o=>{
            if(!optionMap[o.question_id])
              optionMap[o.question_id]=[];

            optionMap[o.question_id].push(o);
          });

          questions=questions.map(q=>({
            ...q,
            question_options:
              optionMap[q.id]||
              q.question_options||
              []
          }));
        }
      }
    }catch(error){
      console.warn("Question options:",error);
    }

    questions=questions.filter(q=>{
      const questionText=String(
        q.question_text||
        q.question||
        q.text||
        ""
      ).trim();

      const options=getQuestionOptions(q);

      return Boolean(
        q.id &&
        questionText &&
        options.length>=2
      );
    });

    if(questions.length)
      return questions;
  }

  let links=[];
  let linkResult=await db
    .from("exam_questions")
    .select("*")
    .eq("exam_id",examId)
    .order("question_number",{ascending:true});

  if(!linkResult.error){
    links=linkResult.data||[];
  }else{
    console.warn(
      "exam_questions:",
      linkResult.error
    );
  }

  if(links.length){

    const ids=links
      .map(x=>x.question_id||x.questionId)
      .filter(Boolean);

    if(ids.length){

      const qr=await db
        .from("questions")
        .select("*")
        .in("id",ids);

      if(qr.error){
        throw new Error(
          "Could not load exam questions: "+
          qr.error.message
        );
      }

      const map={};
      (qr.data||[]).forEach(q=>{
        map[q.id]=q;
      });

      questions=links.map(link=>{

        const questionId=
          link.question_id||
          link.questionId;

        const q=map[questionId];

        if(!q)return null;

        return {
          ...q,
          exam_question_id:link.id,
          question_number:
            link.question_number
        };

      }).filter(Boolean);
    }
  }

  /*
   * RPC fallback for installations where exam_questions
   * is protected but the database function is available.
   */
  if(!questions.length){

    try{
      const rpc=await db.rpc(
        "get_exam_questions",
        {p_exam_id:examId}
      );

      if(!rpc.error){
        questions=rpc.data||[];
      }
    }catch(error){
      console.warn(
        "get_exam_questions fallback:",
        error
      );
    }
  }

  /*
   * Final fallback: match the published exam to its subject
   * and load the questions belonging to that subject.
   */
  if(!questions.length && currentExam){

    const fallbackSubjectIds=
      Array.isArray(subjectIds)&&subjectIds.length
      ?subjectIds
      :[];

    if(fallbackSubjectIds.length){

      const qr=await db
        .from("questions")
        .select("*")
        .in("subject_id",fallbackSubjectIds)
        .limit(5000);

      if(!qr.error){
        questions=qr.data||[];
      }
    }
  }

  if(!questions.length){
    throw new Error(
      "No published questions are available for the selected subject(s). "+
      "Assign each question to the correct registered subject in Admin Question Bank."
    );
  }

  /*
   * Attach question_options as a supplement.
   * Direct option_a/b/c/d values remain the preferred source.
   */
  try{

    const ids=questions
      .map(q=>q.id)
      .filter(Boolean);

    if(ids.length){

      const optionsResult=await db
        .from("question_options")
        .select("*")
        .in("question_id",ids);

      if(!optionsResult.error){

        const optionMap={};

        (optionsResult.data||[]).forEach(o=>{
          if(!optionMap[o.question_id])
            optionMap[o.question_id]=[];

          optionMap[o.question_id].push(o);
        });

        questions=questions.map(q=>({
          ...q,
          question_options:
            optionMap[q.id]||
            q.question_options||
            []
        }));
      }
    }

  }catch(error){
    console.warn(
      "Question options:",
      error
    );
  }

  /*
   * Validate the actual content before the CBT starts.
   * This prevents the student from seeing empty Question 1-5.
   */
  questions=questions.filter(q=>{
    const questionText=String(
      q.question_text||
      q.question||
      q.text||
      ""
    ).trim();

    const options=getQuestionOptions(q);

    return Boolean(
      q.id&&
      questionText&&
      options.length>=2
    );
  });

  return questions;
}

async function startExam(examId,requestedCount=0,subjectIds=[]){

  let result=await db
    .from("exams")
    .select("*")
    .eq("id",examId)
    .single();

  if(result.error || !result.data){
    const live=await getPublishedStudentExamsLive();

    const found=(live.data||[])
      .find(e=>String(e.id)===String(examId));

    if(!found){
      alert(
        result.error?.message||
        "This examination could not be found."
      );
      return;
    }

    result={data:found,error:null};
  }

  currentExam=result.data;

  /*
   * Never allow a student to start an unpublished exam.
   * Also keep General Knowledge hidden even if someone
   * manually opens an old button/link.
   */
  if(!isPublishedStudentExam(currentExam)){
    alert(
      "This examination is not currently available to students."
    );
    return;
  }

  let questions;

  try{
    questions=await loadExamQuestionPool(examId,subjectIds);
  }catch(error){
    console.error(error);
    alert(error.message||"Could not load the examination questions.");
    return;
  }

  if(!questions.length){
    alert(
      "No complete questions are available for this examination."
    );
    return;
  }

  /*
   * JAMB uses the standard 4-subject structure:
   * English Language = 60 questions;
   * each of the other 3 selected subjects = 40 questions.
   */
  if(isJambExam(currentExam)){
    const subjectRows=await getStudentExamSubjects(currentExam);
    const uniqueIds=[...new Set((subjectIds||[]).map(String).filter(Boolean))];
    if(uniqueIds.length!==4){
      alert("JAMB requires exactly 4 different subjects.");
      return;
    }

    const selectedRows=subjectRows.filter(s=>
      uniqueIds.includes(String(s.id))
    );

    if(selectedRows.length!==4){
      alert("One or more selected JAMB subjects are not linked to this examination.");
      return;
    }

    const englishRow=selectedRows.find(s=>{
      const n=subjectDisplayName(s).toLowerCase();
      const c=String(s?.code||s?.subject_code||"").toLowerCase();
      return n==="english language" || c==="eng";
    });
    if(!englishRow){
      alert("English Language is compulsory for JAMB.");
      return;
    }
    const otherRows=selectedRows.filter(s=>String(s.id)!==String(englishRow.id));
    if(otherRows.length!==3){
      alert("JAMB requires English Language plus three other subjects.");
      return;
    }
    /* Never allow questions from an unselected subject into JAMB. */
    questions=questions.filter(q=>uniqueIds.includes(String(q.subject_id||"")));

    const bySubject={};
    questions.forEach(q=>{
      const sid=String(q.subject_id||"");
      if(!bySubject[sid])bySubject[sid]=[];
      bySubject[sid].push(q);
    });
    const needed=[[String(englishRow.id),60],...otherRows.map(s=>[String(s.id),40])];
    const missing=needed.find(([sid,n])=>(bySubject[sid]||[]).length<n);
    if(missing){
      const name=subjectDisplayName(selectedRows.find(s=>String(s.id)===missing[0]));
      alert(`Not enough questions for ${name}. Admin must upload at least ${missing[1]} published questions for this subject.`);
      return;
    }
    let jambQuestions=[];
    for(const [sid,n] of needed){
      const pool=shuffle([...(bySubject[sid]||[])]).slice(0,n);
      jambQuestions=jambQuestions.concat(pool);
    }
    questions=jambQuestions;
  }

  /*
   * The student-selected count is the only dashboard selection.
   * The Admin total_questions field is NOT used as the student's
   * available-question count. The actual loaded question pool is
   * the source of truth.
   */
  const requested=Math.floor(
    Number(requestedCount||0)
  );

  let limit=requested>0
    ?requested
    :questions.length;

  limit=Math.max(
    1,
    Math.min(limit,questions.length)
  );

  /*
   * Randomize before selecting so students receive a
   * random subset when Randomize Questions is enabled.
   */
  if(currentExam.randomize_questions!==false){
    questions=shuffle(questions);
  }

  questions=questions.slice(0,limit);

  /*
   * Keep the question order stable when randomization is off.
   */
  if(currentExam.randomize_questions===false){
    questions.sort((a,b)=>
      Number(a.question_number||0)-
      Number(b.question_number||0)
    );
  }

  currentExamQuestions=questions;
  currentExamSubjectIds=Array.isArray(subjectIds)?subjectIds:[];
  currentExamIndex=0;
  currentExamAnswers={};

  const attemptPayload={
    exam_id:currentExam.id,
    student_id:user.id,
    started_at:new Date().toISOString(),
    status:"in_progress",
    total_questions:questions.length
  };

  let attempt=await db
    .from("exam_attempts")
    .insert(attemptPayload)
    .select()
    .single();

  if(
    attempt.error&&
    /student_id/i.test(
      attempt.error.message||""
    )
  ){
    delete attemptPayload.student_id;
    attemptPayload.user_id=user.id;

    attempt=await db
      .from("exam_attempts")
      .insert(attemptPayload)
      .select()
      .single();
  }

  if(attempt.error){
    console.warn(
      "Attempt creation:",
      attempt.error
    );

    cbt.attemptId=null;
  }else{
    cbt.attemptId=attempt.data?.id;
  }

  cbt.startedAt=new Date();

  cbt.seconds=
    Number(currentExam.duration_minutes||60)*60;

  document.body.dataset.submitting="0";

  renderCBT();
  startCBTTimer();
}

function shuffle(array){

  const copy=[...array];

  for(
    let i=copy.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [
      copy[i],
      copy[j]
    ]=[
      copy[j],
      copy[i]
    ];
  }

  return copy;
}

function renderCBT(){

  if(!q)return;

  const options=getQuestionOptions(q);

   * Defensive normalization: if a database/RPC returns
   * alternate field names, still render the real statement.
   */
  const questionText=String(
    q.question_text||
    q.question||
    q.text||

   * The option letter remains attached to its answer, so marking
   * stays correct.
   */
  let displayOptions=[...options];

  if(currentExam?.randomize_options!==false){

  }

  const allowBack=

       )}
      </strong>

      <div class="muted"
       style="margin-top:5px">
       Question
       ${currentExamIndex+1}
       of
       ${currentExamQuestions.length}
      </div>

     </div>

     <div>
      <div class="timer" id="cbtTimer">
       00:00:00
      </div>
     </div>

    </div>

    <div class="questionCard">

     <div class="questionNumber">
      Question ${currentExamIndex+1}
     </div>

     <div class="questionText">
      ${escapeHTML(questionText)}
     </div>

     <div class="optionList">

      ${displayOptions.map(o=>`

       <div
        class="option ${
          currentExamAnswers[q.id]===o.letter
          ?"selected"
          :""
        }"
        onclick="selectCBTAnswer('${o.letter}')">

        <div class="optionLetter">
         ${escapeHTML(o.letter)}
        </div>

        <div>
         ${escapeHTML(o.text)}
        </div>

           }

     }

   </div>

function getQuestionOptions(q){

  let options=[];

  /*
   * Direct question columns are the primary source because
   * the Admin importer stores option_a/b/c/d there.
   */
  const direct=[
    ["A",q?.option_a],
    ["B",q?.option_b],
    ["C",q?.option_c],
    ["D",q?.option_d]
  ];

  const directOptions=direct
    .filter(x=>
      x[1]!==undefined&&
      x[1]!==null&&
      String(x[1]).trim()!==""
    )
    .map(x=>({
      letter:x[0],
      text:String(x[1])
    }));

  if(directOptions.length>=2){
    return directOptions;
  }

  /*
   * Fallback for schemas that store options in
   * question_options.
   */
  const rows=
    Array.isArray(q?.question_options)
    ?q.question_options
    :[];

  options=rows.map(o=>{

    let letter=String(
      o?.option_letter||
      o?.label||
      o?.key||
      o?.option||
      ""
    )
    .trim()
    .toUpperCase();

    letter=letter
      .replace(/^OPTION\s+/,"")
      .replace(/^ANSWER\s+/,"");

    return {
      letter,
      text:String(
        o?.option_text||
        o?.text||
        o?.value||
        ""
      )
    };

  }).filter(o=>
    ["A","B","C","D"].includes(o.letter)&&
    o.text.trim()!==""
  );

  return options.sort(
    (a,b)=>
      "ABCD".indexOf(a.letter)-
      "ABCD".indexOf(b.letter)
  );
}

function selectCBTAnswer(letter){

  const q=
    currentExamQuestions[
      currentExamIndex
    ];

  if(!q)return;

  currentExamAnswers[q.id]=
    letter;

  renderCBT();
}

function nextCBTQuestion(){

  if(
    currentExamIndex<
    currentExamQuestions.length-1
  ){

    currentExamIndex++;
    renderCBT();
  }
}

function previousCBTQuestion(){

  if(
    currentExamIndex>0
  ){

    currentExamIndex--;
    renderCBT();
  }
}

function goToCBTQuestion(index){

  if(
    index>=0&&
    index<
    currentExamQuestions.length
  ){

    currentExamIndex=index;
    renderCBT();
  }
}

/* =========================================================
   TIMER
========================================================= */

function startCBTTimer(){

  clearInterval(
    cbt.timer
  );

  updateCBTTimer();

  cbt.timer=
    setInterval(()=>{

      cbt.seconds--;

      updateCBTTimer();

      if(cbt.seconds<=0){

        clearInterval(
          cbt.timer
        );

        submitExam(true);
      }

    },1000);
}

function updateCBTTimer(){

  const el=
    document.getElementById(
      "cbtTimer"
    );

  if(!el)return;

  const total=
    Math.max(
      0,
      cbt.seconds
    );

  const h=
    Math.floor(
      total/3600
    );

  const m=
    Math.floor(
      (total%3600)/60
    );

  const s=
    total%60;

  el.textContent=
    [
      h,
      m,
      s
    ]
    .map(
      x=>String(x).padStart(2,"0")
    )
    .join(":");
}

function confirmSubmitExam(){

  const total=
    currentExamQuestions.length;

  const answered=
    Object.keys(
      currentExamAnswers
    ).length;

  if(
    answered<total
  ){

    const proceed=
      confirm(
        `You have answered ${answered} of ${total} questions. Submit anyway?`
      );

    if(!proceed)
      return;
  }

  submitExam(false);
}

async function submitExam(auto=false){

  if(!currentExamQuestions.length)
    return;

  clearInterval(
    cbt.timer
  );

  /*
   * Prevent double submission.
  */

  if(
    document.body.dataset.submitting==="1"
  )
    return;

  document.body.dataset.submitting="1";

  const result=
    calculateExamResult();

  /*
   * Store individual answers.
  */

  for(
    const item
    of result.answers
  ){

    const payload={
      attempt_id:cbt.attemptId,
      question_id:item.question_id,
      selected_answer:
        item.selected_answer||
        null,
      is_correct:
        item.is_correct,
      marks_awarded:
        item.marks_awarded
    };

    if(!cbt.attemptId)
      continue;

    let answerWrite=
      await db
        .from("exam_answers")
        .insert(payload);

    /*
     * Common alternate schema.
    */

    if(
      answerWrite.error&&
      /selected_answer/i.test(
        answerWrite.error.message||""
      )
    ){

      delete payload.selected_answer;

      payload.answer=
        item.selected_answer||
        null;

      answerWrite=
        await db
          .from("exam_answers")
          .insert(payload);
    }

    if(answerWrite.error){

      console.warn(
        "Answer write:",
        answerWrite.error
      );
    }
  }

  /*
   * Update attempt.
  */

  if(cbt.attemptId){

    const attemptPayload={
      submitted_at:
        new Date().toISOString(),
      completed_at:
        new Date().toISOString(),
      status:"completed",
      score:
        result.score,
      percentage:
        result.percentage,
      total_questions:
        result.total,
      correct_answers:
        result.correct,
      wrong_answers:
        result.wrong,
      unanswered:
        result.unanswered
    };

    let update=
      await db
        .from("exam_attempts")
        .update(attemptPayload)
        .eq("id",cbt.attemptId);

    if(update.error){

      console.warn(
        "Attempt update:",
        update.error
      );
    }
  }

  document.body.dataset.submitting="0";

  renderExamResult(
    result,
    auto
  );
}

function calculateExamResult(){

  let score=0;
  let totalMarks=0;
  let correct=0;
  let wrong=0;
  let unanswered=0;

  const subjectStats={};
  const topicStats={};

  const answers=
    currentExamQuestions.map(q=>{

      const selected=
        currentExamAnswers[q.id]||
        "";

      const correctAnswer=
        normalizeAnswer(
          q.correct_answer||
          q.answer
        );

      const isAnswered=
        Boolean(selected);

      const isCorrect=
        isAnswered&&
        selected===correctAnswer;

      const marks=
        Number(q.marks||1);

      totalMarks+=marks;

      if(isCorrect){

        correct++;
        score+=marks;

      }else if(isAnswered){

        wrong++;

      }else{

        unanswered++;
      }

      const sid=
        q.subject_id||
        "unknown";

      const topic=
        q.topic||
        q.topic_name||
        "General";

      if(!subjectStats[sid]){

        subjectStats[sid]={
          subject_id:sid,
          total:0,
          correct:0,
          wrong:0,
          unanswered:0
        };
      }

      subjectStats[sid].total++;

      if(isCorrect)
        subjectStats[sid].correct++;
      else if(isAnswered)
        subjectStats[sid].wrong++;
      else
        subjectStats[sid].unanswered++;

      const topicKey=
        sid+"::"+topic;

      if(!topicStats[topicKey]){

        topicStats[topicKey]={
          subject_id:sid,
          topic,
          total:0,
          correct:0,
          wrong:0,
          unanswered:0
        };
      }

      topicStats[topicKey].total++;

      if(isCorrect)
        topicStats[topicKey].correct++;
      else if(isAnswered)
        topicStats[topicKey].wrong++;
      else
        topicStats[topicKey].unanswered++;

      return {
        question_id:q.id,
        selected_answer:
          selected||null,
        correct_answer:
          correctAnswer,
        is_correct:
          isCorrect,
        marks_awarded:
          isCorrect
          ?marks
          :0,
        subject_id:sid,
        topic
      };
    });

  const percentage=
    totalMarks
    ?Number(
      ((score/totalMarks)*100)
        .toFixed(2)
    )
    :0;

  const weakTopics=
    Object.values(topicStats)
      .filter(x=>{

        const rate=
          x.total
          ?x.correct/x.total
          :0;

        return rate<0.6;
      })
      .sort(
        (a,b)=>
          (a.correct/a.total)-
          (b.correct/b.total)
      );

  const recommendations=
    weakTopics.map(x=>({

      subject:
        subjectName(x.subject_id),

      topic:x.topic,

      recommendation:
        `Study ${x.topic} under ${subjectName(x.subject_id)} and practise more questions in this area.`
    }));

  return {
    score,
    totalMarks,
    percentage,
    total:
      currentExamQuestions.length,
    correct,
    wrong,
    unanswered,
    answers,
    subjectStats:
      Object.values(subjectStats),
    topicStats:
      Object.values(topicStats),
    weakTopics,
    recommendations
  };
}

async function loadStudentResults(){

  const area=
    document.getElementById(
      "resultsArea"
    );

  let result=
    await db
      .from("exam_attempts")
      .select("*")
      .eq("student_id",user.id)
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(200);

  /*
   * Alternate schema.
  */

  if(
    result.error&&
    /student_id/i.test(
      result.error.message||""
    )
  ){

    result=
      await db
        .from("exam_attempts")
        .select("*")
        .eq("user_id",user.id)
        .order(
          "created_at",
          {ascending:false}
        )
        .limit(200);
  }

  if(result.error){

    area.innerHTML=`

    <div class="errorBox">
     ${escapeHTML(
       result.error.message

    return;
  }

  const rows=
    result.data||[];

  if(!rows.length){

    area.innerHTML=`

    <div class="tableEmpty">

     <button
      class="btn primary"
      style="margin-top:15px"
      onclick="studentExams()">

    return;
  }

  /*

  const examIds=
    rows

  let exams=[];

  if(examIds.length){

    const er=
      await db
        .from("exams")

function openModuleForm(
  module,
  id=null
){

  const cfg=
    MODULES[module];

  const existing=
    id
    ?currentModuleRows.find(
      x=>String(x.id)===String(id)
    )
    :null;

  const fields=
    cfg.fields.map(
      f=>{

        const key=f[0];
        const label=f[1];
        const type=f[2];
        const required=f[3];

        let value=
          existing?.[key];

        if(
          value===undefined||
          value===null||
          value===""
        ){

          value=
            cfg.defaults?.[key]||
            "";
        }

        if(type==="checkbox"){

          return `

          <div class="formGroup">

           <label>

            <input
             type="checkbox"
             id="field_${key}"
             ${
               value
               ?"checked"
               :""
             }
             style="width:auto">

            ${escapeHTML(label)}

           </label>

          </div>`;
        }

        if(type==="textarea"){

          return `

          <div class="formGroup full">

           <label>
            ${escapeHTML(label)}
           </label>

           <textarea
            id="field_${key}"
            ${
              required
              ?"required"
              :""
            }>${escapeHTML(
              value
            )}</textarea>

          </div>`;
        }

        return `

        <div class="formGroup">

         <label>
          ${escapeHTML(label)}
         </label>

         <input
          id="field_${key}"
          type="${type}"
          value="${escapeHTML(
            value
          )}"
          ${
            required
            ?"required"
            :""
          }>

        </div>`;
      }
    ).join("");

  document.body.insertAdjacentHTML(
    "beforeend",
    `

    <div
     class="modal"

        ${id
          ?"Save Changes"
          :"Create Record"}

       </button>

     </div>

  );

  if(module==="exams"){

    })();

}

    .getElementById(
      "moduleModal"
    )
    ?.remove();
}

async function saveModuleRecord(
  module,
  id
){

  const cfg=
    MODULES[module];

  const payload={};

  for(
    const f
    of cfg.fields
  ){

    const key=f[0];
    const type=f[2];

    const el=
      document.getElementById(
        "field_"+key
      );

    if(!el)
      continue;

    if(type==="checkbox"){

      payload[key]=
        el.checked;

      continue;
    }

    let value=
      el.value;

    if(value===""){

      payload[key]=null;

      continue;
    }

    if(type==="number"){

      payload[key]=
        Number(value);

      continue;
    }

    payload[key]=
      value;
  }

  let result;
  let savedId=id||"";

  if(id){
    result=await db.from(cfg.table).update(payload).eq("id",id).select("id").single();
  }else{
    result=await db.from(cfg.table).insert(payload).select("id").single();
    if(!result.error)savedId=result.data?.id||"";
  }

  if(result.error){

    document.getElementById(
      "moduleFormMessage"
    ).innerHTML=`

    <div class="errorBox">
     ${escapeHTML(
       result.error.message
     )}
    </div>`;

    return;
  }

  if(module==="exams" && savedId){
    const ids=getSubjectPickerIds("adminExamSubjectPicker");
    try{
      const del=await db.from("exam_subjects").delete().eq("exam_id",savedId);
      if(del.error)throw del.error;
      if(ids.length){
        const rows=ids.map((subject_id,index)=>({exam_id:savedId,subject_id,is_compulsory:false,question_limit:40,sort_order:index+1,subject_order:index+1,is_active:true}));
        const text=(String(payload.exam_type||"")+" "+String(payload.title||"")).toLowerCase();
        if(text.includes("jamb")){rows.forEach(r=>{const sub=subjects.find(x=>String(x.id)===String(r.subject_id));const n=subjectDisplayName(sub).toLowerCase();const c=String(sub?.code||sub?.subject_code||"").toLowerCase();if(n==="english language"||c==="eng"){r.is_compulsory=true;r.question_limit=60;}})}
        const ins=await db.from("exam_subjects").insert(rows);
        if(ins.error)throw ins.error;
      }
    }catch(error){alert("Exam saved, but subject links could not be saved: "+(error.message||""));return;}
  }

  closeModal();

  await loadModule(module);
}

async function deleteModuleRecord(
  module,
  id
){

  const cfg=
    MODULES[module];

  if(!confirm(
    `Delete this ${cfg.title.toLowerCase()} record?`
  ))
    return;

  const result=
    await db
      .from(cfg.table)
      .delete()
      .eq("id",id);

  if(result.error){

    alert(result.error.message);
    return;
  }

  await loadModule(module);
}

      <div class="loading">

      </div>

   </div>

  await loadTutors();
}

async function loadTutors(){

  const area=
    document.getElementById(
      "tutorArea"
    );

  const roles=
    await db
      .from("user_roles")
      .select(
        "user_id,role,is_active,created_at"
      )
      .eq("role","tutor")
      .order(
        "created_at",
        {ascending:false}
      );

  if(roles.error){

    area.innerHTML=`

    <div class="errorBox">
     ${escapeHTML(
       roles.error.message
     )}
    </div>`;

    return;
  }

  const ids=
    (roles.data||[])
      .map(x=>x.user_id);

  if(!ids.length){

    area.innerHTML=`

    <div class="tableEmpty">
     <h3>No tutors yet.</h3>
    </div>`;

    return;
  }

  const profiles=
    await db
      .from("profiles")
      .select("*")
      .in("id",ids);

  if(profiles.error){

    area.innerHTML=`

    <div class="errorBox">
     ${escapeHTML(
       profiles.error.message
     )}
    </div>`;

    return;
  }

  tutorRows=
    (roles.data||[])
      .map(r=>{

        const p=
          (profiles.data||[])
            .find(
              x=>x.id===r.user_id
            )||{};

        return {
          ...p,
          user_id:r.user_id,
          is_active:r.is_active
        };
      });

  renderTutorTable(
    tutorRows
  );
}

function filterTutors(){

  const q=
    document.getElementById(
      "tutorSearch"
    )?.value
      .toLowerCase()
      .trim()||"";

  const rows=
    !q
    ?tutorRows
    :tutorRows.filter(
      t=>
        JSON.stringify(t)
          .toLowerCase()
          .includes(q)
    );

  renderTutorTable(rows);
}

function renderTutorTable(rows){

  const area=
    document.getElementById(
      "tutorArea"
    );

  if(!rows.length){

    area.innerHTML=`

    <div class="tableEmpty">
     <h3>No tutors found.</h3>
    </div>`;

    return;
  }

  area.innerHTML=`

  <table class="studentTable">

   <thead>

    <tr>
     <th>Tutor</th>
     <th>Email</th>
     <th>Phone</th>
     <th>State</th>
     <th>Status</th>
    </tr>

   </thead>

   <tbody>

    ${rows.map(t=>{

      const name=
        t.display_name||
        `${t.first_name||""} ${t.last_name||""}`
          .trim()||
        "Tutor";

      return `

      <tr>

       <td>
        <strong>
         ${escapeHTML(name)}
        </strong>
       </td>

       <td>
        ${escapeHTML(
          t.email||"-"
        )}
       </td>

       <td>
        ${escapeHTML(
          t.phone||"-"
        )}
       </td>

       <td>
        ${escapeHTML(
          t.state||"-"
        )}
       </td>

       <td>

        <span class="badge ${
          t.is_active
          ?"badgeGreen"
          :"badgeRed"
        }">

         ${
           t.is_active
           ?"Active"
           :"Inactive"
         }

        </span>

       </td>

      </tr>`;
    }).join("")}

   </tbody>

  </table>`;
}

========================================================= */

let loggingOut=false;

async function logout(){

  if(loggingOut)
    return;

  loggingOut=true;

  try{

    await db.auth.signOut();

  }catch(error){

    console.error(
      "Logout:",
      error
    );
  }

  user=null;
  profile=null;
  role=null;

  clearInterval(
    cbt.timer
  );

  allStudents=[];
  tutorRows=[];
  currentModuleRows=[];
  subjects=[];
  topics=[];
  questionRows=[];

  loggingOut=false;

  renderLogin();
}

/* =========================================================
   AUTH STATE
========================================================= */

function registerAuthListener(){
  if(!db)return;
  db.auth.onAuthStateChange(
    (event,session)=>{
      console.log("AUTH EVENT:",event);
      if(event==="SIGNED_OUT"){
        user=null;
        profile=null;
        role=null;
        clearInterval(cbt.timer);
        renderLogin();
      }
    }
  );
}

/* =========================================================
   INITIAL LOAD
========================================================= */

(async function startPHILMYSCHOOL(){

  try{
    const app=document.getElementById("app");
    if(app){
      app.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f5f7fb"><div style="text-align:center"><div style="font-size:28px;font-weight:900;color:#2563eb">PHILMYSCHOOL</div><div style="margin-top:10px;color:#64748b">Loading...</div></div></div>`;
    }

    if(!initializeSupabase())return;

    registerAuthListener();

    try{
      window.philExamRealtime=
        db
          .channel("philmyschool-exams-live")
          .on(
            "postgres_changes",
            {
              event:"*",
              schema:"public",
              table:"exams"
            },
            ()=>{
              if(
                role==="student" &&
                document.getElementById("studentExamArea")
              ){
                loadStudentExams();
              }
            }
          )
          .subscribe();
    }catch(error){
      console.warn(
        "Exam realtime subscription:",
        error
      );
    }

    const result=await db.auth.getSession();

    if(result.error){
      console.error("Session error:",result.error);
      renderLanding();
      return;
    }

    if(result.data?.session){
      await loadCurrentUser();
    }else{
      renderLanding();
    }

  }catch(error){
    console.error("PHILMYSCHOOL startup error:",error);
    showFatalStartupError(error);
  }

})();
</script>
