<style>
*{

  margin:0;
  padding:0;
}

:root{
  --navy:#10233f;
  --blue:#155eef;
  --light:#f5f7fb;
  --white:#fff;
  --muted:#718096;
  --border:#e3e8ef;
  --green:#159447;
  --red:#d92d20;
  --orange:#f79009;
}

body{

}

button,input,select,textarea{

}

button{

}

.hidden{
  display:none!important;
}

.navbar{
  height:74px;
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:19px;
}

.logoIcon{
  width:39px;
  height:39px;
  border-radius:10px;
  background:var(--blue);
  color:white;
  display:grid;
  place-items:center;
  font-weight:900;
}

.navButtons{
  display:flex;
  gap:10px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  font-weight:700;
}

.primary{
  background:var(--blue);
  color:#fff;
}

.secondary{
  background:#eaf2ff;
  color:var(--blue);
}

.danger{
  background:#fff0ef;
  color:#b42318;
}

.success{
  background:#e9f8ef;
  color:#126b35;
}

.warning{

  color:#8a5700;
}

.hero{

  padding:80px 25px;
  display:grid;

  gap:55px;

}

.eyebrow{

  font-size:12px;

}

.hero h1{

  line-height:1;

}

}

.heroText{

  font-size:18px;
  line-height:1.7;
}

.heroButtons{

}

.preview{

  border-radius:25px;
  padding:27px;

}

.progress{

  border-radius:20px;

}

.progress span{

}

.previewGrid{
  display:grid;

  gap:10px;
}

.previewCard{

  padding:18px;
}

.previewCard small{
  color:#b4c2d4;
}

.previewCard strong{

}

.features{

}

.sectionTitle{
  text-align:center;
  max-width:700px;
  margin:auto;
}

.sectionTitle h2{
  font-size:40px;
  margin:10px 0;
}

.muted{
  color:var(--muted);
  line-height:1.6;
}

.featureGrid{
  max-width:1180px;
  margin:40px auto 0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.feature{
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  background:#fff;
}

.featureIcon{

}

.feature h3{

}

.feature p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

/* AUTH */

.authPage{
  min-height:100vh;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#fff;
}

.authBrand{
  background:var(--navy);
  color:white;
  padding:55px 9%;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.authBrand .logoIcon{
  background:white;
  color:var(--navy);
}

.authBrand h1{
  font-size:55px;
  line-height:1;
}

.authBrand p{
  color:#b9c7d8;
  margin-top:20px;
  line-height:1.7;
}

.authBoxWrap{
  display:grid;
  place-items:center;
  padding:30px;
}

.authBox{
  width:min(430px,100%);
}

.authBox h2{
  font-size:34px;
  margin:18px 0 7px;
}

.formGroup{
  margin-top:15px;
}

.formGroup label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.formGroup input,
.formGroup select,
.formGroup textarea{
  width:100%;
  padding:13px;
  border:1px solid #d8e0e9;
  border-radius:9px;
  outline:none;
  background:white;
}

.formGroup textarea{
  min-height:100px;
  resize:vertical;
}

.formGroup input:focus,
.formGroup select:focus,
.formGroup textarea:focus{
  border-color:var(--blue);
}

.roleGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.roleChoice{
  border:1px solid var(--border);
  background:white;
  padding:13px;
  border-radius:9px;
  font-weight:700;
}

.roleChoice.active{
  border-color:var(--blue);
  background:#eaf2ff;
  color:var(--blue);
}

.authMessage{
  margin-top:15px;
  padding:11px;
  border-radius:8px;
  font-size:13px;
  display:none;
}

.authMessage.show{
  display:block;
  background:#fff3dc;
  color:#7a510e;
}

.authMessage.error{
  display:block;
  background:#fff0ef;
  color:#b42318;
}

.authMessage.success{
  display:block;
  background:#e9f8ef;
  color:#126b35;
}

.authSwitch{
  text-align:center;
  margin-top:18px;
  font-size:13px;
}

.linkButton{
  border:0;
  background:none;
  color:var(--blue);
  font-weight:700;
}

/* PORTAL */

.portal{
  min-height:100vh;
}

.sidebar{
  width:250px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  background:var(--navy);
  color:white;
  padding:20px 14px;
  z-index:100;
  overflow-y:auto;
}

.sidebarLogo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  margin-bottom:28px;
  padding:7px;
}

.sidebarLogoIcon{
  width:35px;
  height:35px;
  border-radius:9px;
  background:white;
  color:var(--navy);
  display:grid;
  place-items:center;
  font-weight:900;
}

.sideLabel{
  color:#8196b2;
  font-size:10px;
  font-weight:800;
  margin:0 10px 9px;
}

.sideButton{
  width:100%;
  border:0;
  background:transparent;
  color:#b7c6d9;
  text-align:left;
  padding:12px;
  border-radius:8px;
  margin-bottom:3px;
}

.sideButton:hover,
.sideButton.active{

}

.logoutButton{

  color:#fff;
}

.main{
  margin-left:250px;
  min-height:100vh;
}

.topbar{

  background:#fff;
  border-bottom:1px solid var(--border);

  align-items:center;
  padding:0 30px;
  gap:15px;
}

.topUser{

.mobileLogout{

  background:#fff0ef;

.content{

.content h1{

.stats{

.stat{

.stat small{

.stat strong{

.panelGrid{

  grid-template-columns:1fr 1fr;

.panel{

  padding:25px;

.panel h2{

}

.panel p{
  color:var(--muted);
  line-height:1.6;
}

.empty{

  display:grid;
  place-items:center;
  text-align:center;

}

.status{

  padding:12px;
  background:#e9f8ef;
  color:#126b35;
  border-radius:9px;
  font-size:13px;
}

/* TABLES */

  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-top:25px;

}

.searchBox{

  border-radius:9px;
  background:white;

.studentTableWrap{

  border:1px solid var(--border);
  border-radius:15px;
  margin-top:18px;

}

.studentTable{

  min-width:750px;
}

.studentTable th{

  text-align:left;
  padding:15px;
  font-size:12px;
  color:#607089;

}

.studentTable td{

  border-bottom:1px solid var(--border);

}

.studentName{

}

.studentEmail{

}

.badge{

  font-size:11px;

}

.badgeGreen{
  background:#e9f8ef;
  color:#126b35;
}

.badgeRed{
  background:#fff0ef;

}

.badgeOrange{

  color:#8a5700;
}

.tableEmpty,

  padding:45px 20px;

}

.studentCard{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:22px;
  margin-top:18px;

.detailGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;

.detailItem{
  padding:15px;
  background:#f8fafc;
  border-radius:9px;
}

.detailItem small{

  display:block;
  margin-bottom:5px;
}

.errorBox{

  padding:15px;
  border-radius:9px;
  background:#fff0ef;
  color:#b42318;
}

/* MODULE */

  border:1px solid var(--border);
  border-radius:15px;
  padding:22px;
  margin-top:20px;
}

.formGrid{

  grid-template-columns:1fr 1fr;
  gap:15px;
}

.optionGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.questionBox{

  border:1px solid var(--border);
  border-radius:15px;
  padding:22px;
  margin-top:15px;
}

.questionText{
  font-size:18px;
  line-height:1.6;
  font-weight:700;

.optionButton{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  padding:15px;
  text-align:left;
  border-radius:10px;
  margin-top:10px;
  transition:.15s;
}

.optionButton:hover{
  border-color:var(--blue);
  background:#f5f9ff;
}

.optionButton.selected{
  border-color:var(--blue);
  background:#eaf2ff;
  color:var(--blue);
  font-weight:700;
}

.examTop{
  background:var(--navy);
  color:#fff;
  border-radius:15px;
  padding:20px;

  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.timer{

  padding:12px 18px;
  border-radius:10px;
  font-size:20px;
  font-weight:800;
}

.timer.warningTimer{
  background:#8a5700;
}

.resultBox{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:35px;
  text-align:center;
  margin-top:25px;
}

.resultScore{
  font-size:60px;
  font-weight:900;
  color:var(--blue);
  margin:15px 0;
}

.resultPass{
  color:var(--green);

  font-size:20px;
}

.resultFail{
  color:var(--red);

  font-size:20px;
}

.examCard{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:22px;
}

.examCard h3{
  margin-bottom:8px;
}

.examCards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  margin-top:20px;
}

.inlineActions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.smallBtn{

  font-size:12px;
}

.adminForm{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:25px;
  margin-top:20px;
}

.sectionDivider{
  margin:28px 0 10px;
  padding-bottom:10px;

}

.answerCorrect{
  border:2px solid var(--green)!important;

/* MOBILE */

.mobileMenu{

  border:0;
  background:#eaf2ff;
  color:var(--blue);
  border-radius:8px;
  padding:9px 12px;

@media(max-width:900px){

  .hero{

  .featureGrid{

  }

  .authPage{

  }

  .authBrand{
    display:none;
  }

  .sidebar{

  .main{
    margin-left:0;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .panelGrid{
    grid-template-columns:1fr;
  }

  .mobileLogout{
    display:block;
  }

  .mobileMenu{
    display:block;
  }

  .examCards{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .navbar{
    padding:0 15px;
  }

  .hero{
    padding:55px 18px;
  }

  .hero h1{
    font-size:44px;
  }

  .heroButtons{
    flex-direction:column;
  }

  .heroButtons .btn{
    width:100%;
  }

  .featureGrid{
    grid-template-columns:1fr;
  }

  .content{
    padding:22px 15px;
  }

  .topbar{
    padding:0 15px;
  }

  .topUser span{
    display:none;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .detailGrid,
  .formGrid,
  .optionGrid{
    grid-template-columns:1fr;
  }

  .mobileLogout{
    padding:8px 10px;
    font-size:12px;
  }

  .resultScore{
    font-size:45px;
  }

}
</style>
</head>

function escapeHTML(value){

  if(value===null || value===undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function showAuthMessage(message,type=""){

  const box=document.getElementById("authMessage");

  if(!box)return;

  box.textContent=message;

  box.className="authMessage show "+type;
}


function clearAuthMessage(){

  const box=document.getElementById("authMessage");

  if(!box)return;

  box.textContent="";
  box.className="authMessage";
}


function notify(message){

  alert(message);

}


function formatDate(value){

  if(!value)return "—";

  try{

    return new Date(value).toLocaleDateString(
      "en-NG",
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );

  }catch(e){

    return value;

  }

}


function formatMoney(value){

  return "₦"+Number(value||0).toLocaleString(
    "en-NG",
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  );

}

/* =========================================================
   REGISTER
========================================================= */

async function register(event){

  event.preventDefault();

  clearAuthMessage();

  const firstName=
    document.getElementById("firstName").value.trim();

  const lastName=
    document.getElementById("lastName").value.trim();

  const email=
    document.getElementById("registerEmail").value.trim();

  const password=
    document.getElementById("registerPassword").value;

  const button=
    document.getElementById("registerButton");

  if(button){
    button.disabled=true;
    button.textContent="Creating account...";
  }

  showAuthMessage(
    "Creating your account...",
    ""
  );


  try{

    const result=
      await db.auth.signUp({

        email,
        password,

        options:{
          data:{
            first_name:firstName,
            last_name:lastName,
            requested_role:selectedRole
          }
        }

      });


    if(result.error){

      showAuthMessage(
        result.error.message,
        "error"
      );

      if(button){
        button.disabled=false;
        button.textContent="Create Account";
      }

      return;
    }


    if(!result.data.session){

      showAuthMessage(
        "Account created successfully. Please check your email and confirm your account, then sign in.",
        "success"
      );

      if(button){
        button.disabled=false;
        button.textContent="Create Account";
      }

      return;
    }


    await loadCurrentUser();


  }catch(error){

    console.error(error);

    showAuthMessage(
      error.message || "Registration failed.",
      "error"
    );

    if(button){
      button.disabled=false;
      button.textContent="Create Account";
    }

  }

}

/* =========================================================
   CURRENT USER
========================================================= */

async function loadCurrentUser(){

  try{

    const auth=
      await db.auth.getUser();


    if(auth.error || !auth.data.user){

      user=null;
      profile=null;
      role=null;

      renderLanding();

      return;
    }


    user=auth.data.user;


    const profileResult=
      await db
        .from("profiles")
        .select("*")
        .eq("id",user.id)
        .maybeSingle();


    profile=
      profileResult.data || {

        id:user.id,
        email:user.email,
        display_name:user.email

      };


    const roleResult=
      await db
        .from("user_roles")
        .select("role,is_active,created_at")
        .eq("user_id",user.id)
        .eq("is_active",true)
        .order("created_at",{ascending:true})
        .limit(1)
        .maybeSingle();


    role=
      roleResult.data?.role || "student";


    openPortal();


  }catch(error){

    console.error(error);

    renderLanding();

  }

}

}

      .from("exams")
      .select("id",{count:"exact",head:true});

      .from("exam_attempts")
      .select("id",{count:"exact",head:true});


  const qEl=document.getElementById("adminQuestionCount");
  const eEl=document.getElementById("adminExamCount");
  const aEl=document.getElementById("adminAttemptCount");


  if(qEl)
    qEl.textContent=q.error?"—":(q.count||0);

  if(eEl)
    eEl.textContent=e.error?"—":(e.count||0);

  if(aEl)
    aEl.textContent=a.error?"—":(a.count||0);

}

async function loadStudents(){

  const area=
    document.getElementById("studentManagementArea");

  if(!area)return;


  area.innerHTML=`

    <div class="loading">
      Loading students...
    </div>

  `;


  try{

    const rolesResult=
      await db
        .from("user_roles")
        .select(
          "id,user_id,role,is_active,created_at"
        )
        .eq("role","student")
        .order(
          "created_at",
          {ascending:false}
        );


    if(rolesResult.error){

      area.innerHTML=`

        <div class="errorBox">

          <strong>
            Unable to load students.
          </strong>

          <br><br>

          ${escapeHTML(
            rolesResult.error.message
          )}

        </div>

      `;

      return;
    }


    const roles=
      rolesResult.data||[];


    const userIds=
      roles
        .map(x=>x.user_id)
        .filter(Boolean);


    if(userIds.length===0){

      allStudents=[];

      updateStudentStats();


      area.innerHTML=`

        <div class="tableEmpty">

          <h3>
            No students yet
          </h3>

          <p style="margin-top:8px">
            Registered student accounts will appear here.
          </p>

        </div>

      `;

      return;
    }


    const profilesResult=
      await db
        .from("profiles")
        .select("*")
        .in("id",userIds);


    if(profilesResult.error){

      area.innerHTML=`

        <div class="errorBox">

          <strong>
            Student profiles could not be loaded.
          </strong>

          <br><br>

          ${escapeHTML(
            profilesResult.error.message
          )}

        </div>

      `;

      return;
    }


    const profiles=
      profilesResult.data||[];


    allStudents=
      roles.map(roleRow=>{

        const p=
          profiles.find(
            profileRow=>
              profileRow.id===roleRow.user_id
          )||{};


        return{

          ...p,

          user_id:roleRow.user_id,

          role:roleRow.role,

          is_active:roleRow.is_active,

          role_created_at:
            roleRow.created_at

        };

      });


    updateStudentStats();

    renderStudentTable(allStudents);


  }catch(error){

    console.error(error);

    area.innerHTML=`

      <div class="errorBox">

        <strong>
          Something went wrong.
        </strong>

        <br><br>

        ${escapeHTML(
          error.message ||
          "Unable to load students."
        )}

      </div>

    `;

  }

}


function updateStudentStats(){

  const total=
    allStudents.length;

  const active=
    allStudents.filter(
      student=>
        student.is_active!==false
    ).length;

  const inactive=
    total-active;


  const totalEl=
    document.getElementById("totalStudents");

  const activeEl=
    document.getElementById("activeStudents");

  const inactiveEl=
    document.getElementById("inactiveStudents");

  const showingEl=
    document.getElementById("showingStudents");


  if(totalEl)
    totalEl.textContent=total;

  if(activeEl)
    activeEl.textContent=active;

  if(inactiveEl)
    inactiveEl.textContent=inactive;

  if(showingEl)
    showingEl.textContent=total;

}


function filterStudents(){

  const input=
    document.getElementById("studentSearch");

  if(!input)return;


  const search=
    input.value
      .trim()
      .toLowerCase();


  const filtered=
    !search
    ?allStudents
    :allStudents.filter(student=>{

      const name=
        `
        ${student.first_name||""}
        ${student.last_name||""}
        ${student.display_name||""}
        `
        .toLowerCase();


      const email=
        (student.email||"").toLowerCase();


      const phone=
        (student.phone||"").toLowerCase();


      return(
        name.includes(search)||
        email.includes(search)||
        phone.includes(search)
      );

    });


  const showingEl=
    document.getElementById("showingStudents");


  if(showingEl)
    showingEl.textContent=
      filtered.length;


  renderStudentTable(filtered);

}

async function loadQuestions(){

  area.innerHTML=`

      Loading questions...
    </div>

  `;


  const result=
    await db
      .from("questions")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(result.error){

    area.innerHTML=`

      <div class="errorBox">

        <strong>
          Could not load questions.
        </strong>

        <br><br>

        ${escapeHTML(result.error.message)}

      </div>

    `;

    return;

  }


  allQuestions=
    result.data||[];


  renderQuestionTable(allQuestions);

}


function filterQuestionBank(){

  const value=
    (
      document.getElementById("questionSearch")?.value||
      ""
    )
    .toLowerCase()
    .trim();


  const filtered=
    allQuestions.filter(q=>{

      const text=
        [
          q.question_text,
          q.exam_type,
          q.difficulty,
          q.source_name
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


      return text.includes(value);

    });


  renderQuestionTable(filtered);

}

async function saveQuestion(){

  const id=
    document.getElementById("questionEditId").value;


  const questionText=
    document.getElementById("questionText").value.trim();

  const optionA=
    document.getElementById("optionA").value.trim();

  const optionB=
    document.getElementById("optionB").value.trim();

  const optionC=
    document.getElementById("optionC").value.trim();

  const optionD=
    document.getElementById("optionD").value.trim();

  const correctAnswer=
    document.getElementById("correctAnswer").value;

  const examType=
    document.getElementById("questionExamType").value.trim();

  const difficulty=
    document.getElementById("questionDifficulty").value;

  const marks=
    Number(
      document.getElementById("questionMarks").value||1
    );

  const explanation=
    document.getElementById("questionExplanation").value.trim();

  const sourceType=
    document.getElementById("questionSourceType").value.trim();

  const sourceName=
    document.getElementById("questionSourceName").value.trim();

  const sourceYear=
    document.getElementById("questionSourceYear").value;

  const status=
    document.getElementById("questionStatus").value;


  if(
    !questionText||
    !optionA||
    !optionB||
    !optionC||
    !optionD||
    !correctAnswer
  ){

    showModuleMessage(
      "questionFormMessage",
      "Please enter the question, all four options and the correct answer.",
      "error"
    );

    return;

  }


  const payload={

    question_text:questionText,

    option_a:optionA,
    option_b:optionB,
    option_c:optionC,
    option_d:optionD,

    correct_answer:correctAnswer,

    exam_type:examType||null,

    difficulty:difficulty,

    marks:marks,

    explanation:explanation||null,

    source_type:sourceType||"original",

    source_name:sourceName||null,

    source_year:
      sourceYear
      ?Number(sourceYear)
      :null,

    status:status,

    created_by:user.id

  };


  let result;


  if(id){

    delete payload.created_by;


    result=
      await db
        .from("questions")
        .update(payload)
        .eq("id",id);

  }else{

    result=
      await db
        .from("questions")
        .insert(payload);

  }


  if(result.error){

    showModuleMessage(
      "questionFormMessage",
      result.error.message,
      "error"
    );

    return;

  }


  showModuleMessage(
    "questionFormMessage",
    id
    ?"Question updated successfully."
    :"Question created successfully.",
    "success"
  );


  resetQuestionForm(false);

  await loadQuestions();

}


function showModuleMessage(id,message,type=""){

  const el=
    document.getElementById(id);

  if(!el)return;

  el.textContent=message;

  el.className=
    "authMessage show "+type;

}


function editQuestion(id){

  const q=
    allQuestions.find(
      item=>item.id===id
    );


  if(!q)return;


  document.getElementById("questionEditId").value=q.id;

  document.getElementById("questionText").value=
    q.question_text||"";

  document.getElementById("optionA").value=
    q.option_a||"";

  document.getElementById("optionB").value=
    q.option_b||"";

  document.getElementById("optionC").value=
    q.option_c||"";

  document.getElementById("optionD").value=
    q.option_d||"";

  document.getElementById("correctAnswer").value=
    q.correct_answer||"";

  document.getElementById("questionExamType").value=
    q.exam_type||"";

  document.getElementById("questionDifficulty").value=
    q.difficulty||"medium";

  document.getElementById("questionMarks").value=
    q.marks||1;

  document.getElementById("questionExplanation").value=
    q.explanation||"";

  document.getElementById("questionSourceType").value=
    q.source_type||"original";

  document.getElementById("questionSourceName").value=
    q.source_name||"";

  document.getElementById("questionSourceYear").value=
    q.source_year||"";

  document.getElementById("questionStatus").value=
    q.status||"draft";


  const title=
    document.getElementById("questionFormTitle");

  if(title)
    title.textContent="Edit Question";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function resetQuestionForm(clearMessage=true){

  const ids=[
    "questionEditId",
    "questionText",
    "optionA",
    "optionB",
    "optionC",
    "optionD",
    "questionExamType",
    "questionExplanation",
    "questionSourceName",
    "questionSourceYear"
  ];


  ids.forEach(id=>{

    const el=document.getElementById(id);

    if(el)
      el.value="";

  });


  const answer=
    document.getElementById("correctAnswer");

  if(answer)
    answer.value="";


  const difficulty=
    document.getElementById("questionDifficulty");

  if(difficulty)
    difficulty.value="medium";


  const marks=
    document.getElementById("questionMarks");

  if(marks)
    marks.value=1;


  const source=
    document.getElementById("questionSourceType");

  if(source)
    source.value="original";


  const status=
    document.getElementById("questionStatus");

  if(status)
    status.value="draft";


  const title=
    document.getElementById("questionFormTitle");

  if(title)
    title.textContent="Add New Question";


  if(clearMessage){

    const message=
      document.getElementById("questionFormMessage");

    if(message)
      message.className="authMessage";

  }

}


async function deleteQuestion(id){

  const q=
    allQuestions.find(
      item=>item.id===id
    );


  if(!q)return;


  if(
    !confirm(
      "Delete this question permanently?"
    )
  ){

    return;

  }


  const result=
    await db
      .from("questions")
      .delete()
      .eq("id",id);


  if(result.error){

    notify(
      "Unable to delete question: "+
      result.error.message
    );

    return;

  }


  await loadQuestions();

}

async function saveExam(){

  const id=
    document.getElementById("examEditId").value;


  const title=
    document.getElementById("examTitle").value.trim();

  const slug=
    document.getElementById("examSlug").value.trim();

  const examType=
    document.getElementById("examType").value.trim();

  const mode=
    document.getElementById("examMode").value;

  const duration=
    Number(
      document.getElementById("examDuration").value||60
    );

  const totalQuestions=
    Number(
      document.getElementById("examTotalQuestions").value||20
    );

  const passMark=
    Number(
      document.getElementById("examPassMark").value||50
    );

  const status=
    document.getElementById("examStatus").value;

  const accessLevel=
    document.getElementById("examAccessLevel").value;

  const price=
    Number(
      document.getElementById("examPrice").value||0
    );

  const description=
    document.getElementById("examDescription").value.trim();

  const instructions=
    document.getElementById("examInstructions").value.trim();


  if(!title||!slug||!examType){

    showModuleMessage(
      "examFormMessage",
      "Please enter the exam title, slug and exam type.",
      "error"
    );

    return;

  }


  const payload={

    title,
    slug,
    description:description||null,
    exam_type:examType,
    mode,
    duration_minutes:duration,
    total_questions:totalQuestions,
    pass_mark:passMark,
    instructions:instructions||null,
    randomize_questions:
      document.getElementById("examRandomQuestions").checked,
    randomize_options:
      document.getElementById("examRandomOptions").checked,
    allow_back_navigation:
      document.getElementById("examBackNavigation").checked,
    show_result_immediately:
      document.getElementById("examShowResult").checked,
    access_level:accessLevel,
    price,
    currency:"NGN",
    status

  };


  let result;


  if(id){

    result=
      await db
        .from("exams")
        .update(payload)
        .eq("id",id);

  }else{

    payload.created_by=user.id;

    result=
      await db
        .from("exams")
        .insert(payload);

  }


  if(result.error){

    showModuleMessage(
      "examFormMessage",
      result.error.message,
      "error"
    );

    return;

  }


  showModuleMessage(
    "examFormMessage",
    id
    ?"Exam updated successfully."
    :"Exam created successfully.",
    "success"
  );


  resetExamForm(false);

  await loadExams();

}

/* =========================================================
   AUTOMATICALLY GENERATE EXAM QUESTIONS
========================================================= */

async function generateExamQuestions(examId){

  const exam=
    allExams.find(
      x=>x.id===examId
    );


  if(!exam)return;


  const amount=
    Number(exam.total_questions||20);


  let query=
    db
      .from("questions")
      .select("id,marks")
      .eq("status","published");


  if(exam.exam_type){

    query=
      query.eq(
        "exam_type",
        exam.exam_type
      );

  }


  const result=
    await query;


  if(result.error){

    notify(
      "Could not load matching questions:\n"+
      result.error.message
    );

    return;

  }


  let questions=
    result.data||[];


  if(questions.length<amount){

    notify(
      `This exam requires ${amount} questions, but only ${questions.length} published matching questions are available.`
    );

    return;

  }


  if(exam.randomize_questions!==false){

    questions=
      questions.sort(
        ()=>Math.random()-.5
      );

  }


  questions=
    questions.slice(
      0,
      amount
    );


  const existing=
    await db
      .from("exam_questions")
      .delete()
      .eq("exam_id",examId);


  if(existing.error){

    notify(
      "Could not clear old exam questions:\n"+
      existing.error.message
    );

    return;

  }


  const rows=
    questions.map(
      (q,index)=>({

        exam_id:examId,

        question_id:q.id,

        question_order:index+1,

        marks:Number(q.marks||1)

      })
    );


  const insert=
    await db
      .from("exam_questions")
      .insert(rows);


  if(insert.error){

    notify(
      "Could not generate exam questions:\n"+
      insert.error.message
    );

    return;

  }


  notify(
    `${questions.length} questions were automatically added to "${exam.title}".`
  );

}

async function deleteExam(id){

  const exam=
    allExams.find(
      x=>x.id===id
    );


  if(!exam)return;


  if(
    !confirm(
      `Delete "${exam.title}"? This will also remove its exam questions.`
    )
  ){

    return;

  }


  const result=
    await db
      .from("exams")
      .delete()
      .eq("id",id);


  if(result.error){

    notify(
      "Unable to delete exam:\n"+
      result.error.message
    );

    return;

  }


  await loadExams();

}

/* =========================================================
   START EXAM
========================================================= */

async function startExam(examId){

  const examResult=
    await db
      .from("exams")
      .select("*")
      .eq("id",examId)
      .maybeSingle();


  if(examResult.error){

    notify(examResult.error.message);
    return;

  }


  if(!examResult.data){

    notify("Exam could not be found.");
    return;

  }


  currentExam=
    examResult.data;


  const questionsResult=
    await db
      .from("exam_questions")
      .select(`
        id,
        question_id,
        question_order,
        marks,
        questions (
          id,
          question_text,
          option_a,
          option_b,
          option_c,
          option_d,
          correct_answer,
          explanation,
          marks
        )
      `)
      .eq("exam_id",examId)
      .order(
        "question_order",
        {ascending:true}
      );


  if(questionsResult.error){

    notify(
      "Could not load exam questions:\n"+
      questionsResult.error.message
    );

    return;

  }


  currentExamQuestions=
    (questionsResult.data||[])
      .map(row=>{

        return{

          ...row.questions,

          exam_question_id:row.id,

          exam_marks:
            Number(
              row.marks||
              row.questions?.marks||
              1
            )

        };

      })
      .filter(Boolean);


  if(!currentExamQuestions.length){

    notify(
      "This exam has no questions yet. Please ask the administrator to generate the exam questions."
    );

    return;

  }


  if(currentExam.randomize_questions!==false){

    currentExamQuestions=
      currentExamQuestions.sort(
        ()=>Math.random()-.5
      );

  }


  currentExamAnswers={};

  currentExamIndex=0;


  const attempt=
    await db
      .from("exam_attempts")
      .insert({

        exam_id:currentExam.id,

        student_id:user.id,

        status:"in_progress",

        total_marks:
          currentExamQuestions.reduce(
            (sum,q)=>
              sum+Number(q.exam_marks||1),
            0
          ),

        answers:{}

      })
      .select()
      .single();


  if(attempt.error){

    notify(
      "Could not start exam:\n"+
      attempt.error.message
    );

    return;

  }


  currentAttemptId=
    attempt.data.id;


  examSecondsRemaining=
    Number(
      currentExam.duration_minutes||60
    )*60;


  renderExamScreen();

  startExamTimer();

}

  updateExamTimerDisplay();

}


function selectExamAnswer(answer){

  const q=
    currentExamQuestions[currentExamIndex];


  currentExamAnswers[q.id]=answer;


  renderExamScreen();

}


function nextExamQuestion(){

  if(
    currentExamIndex<
    currentExamQuestions.length-1
  ){

    currentExamIndex++;

    renderExamScreen();

  }

}


function previousExamQuestion(){

  if(currentExamIndex>0){

    currentExamIndex--;

    renderExamScreen();

  }

}


function jumpToExamQuestion(index){

  currentExamIndex=index;

  renderExamScreen();

}


/* =========================================================
   TIMER
========================================================= */

function startExamTimer(){

  clearInterval(examTimer);


  examTimer=
    setInterval(()=>{

      examSecondsRemaining--;


      updateExamTimerDisplay();


      if(examSecondsRemaining<=0){

        clearInterval(examTimer);

        alert(
          "Time is up. Your exam will now be submitted."
        );

        submitExam(true);

      }

    },1000);

}


function updateExamTimerDisplay(){

  const timer=
    document.getElementById("examTimer");

  if(!timer)return;


  const minutes=
    Math.floor(
      examSecondsRemaining/60
    );

  const seconds=
    examSecondsRemaining%60;


  timer.textContent=
    String(minutes).padStart(2,"0")+
    ":"+
    String(seconds).padStart(2,"0");


  timer.classList.toggle(
    "warningTimer",
    examSecondsRemaining<=300
  );

}


/* =========================================================
   CONFIRM EXIT
========================================================= */

function confirmExitExam(){

  if(
    confirm(
      "Exit this exam? Your current attempt will remain unfinished."
    )
  ){

    clearInterval(examTimer);

    renderStudentExams();

  }

}


/* =========================================================
   SUBMIT EXAM
========================================================= */

async function submitExam(force=false){

  if(!currentExam)return;


  if(!force){

    const ok=
      confirm(
        "Submit your exam now?"
      );

    if(!ok)return;

  }


  clearInterval(examTimer);


  let score=0;
  let totalMarks=0;
  let correct=0;
  let wrong=0;
  let unanswered=0;


  currentExamQuestions.forEach(q=>{

    const marks=
      Number(q.exam_marks||1);


    totalMarks+=marks;


    const answer=
      currentExamAnswers[q.id];


    if(!answer){

      unanswered++;

      return;

    }


    if(
      String(answer).toUpperCase()===
      String(q.correct_answer||"").toUpperCase()
    ){

      correct++;

      score+=marks;

    }else{

      wrong++;

    }

  });


  const percentage=
    totalMarks>0
    ?(score/totalMarks)*100
    :0;


  const passed=
    percentage>=
    Number(currentExam.pass_mark||0);


  const result=
    await db
      .from("exam_attempts")
      .update({

        submitted_at:new Date().toISOString(),

        score,

        total_marks:totalMarks,

        percentage:Number(
          percentage.toFixed(2)
        ),

        correct_answers:correct,

        wrong_answers:wrong,

        unanswered,

        passed,

        status:"submitted",

        answers:currentExamAnswers

      })
      .eq("id",currentAttemptId);


  if(result.error){

    notify(
      "Your score was calculated, but the result could not be saved:\n"+
      result.error.message
    );

    return;

  }


  currentAttemptId=null;


  renderExamResult({

    score,

    totalMarks,

    percentage,

    correct,

    wrong,

    unanswered,

    passed

  });

}

let practiceQuestions=[];
let practiceIndex=0;
let practiceAnswer=null;


async function loadPracticeQuestion(){

  const area=
    document.getElementById("practiceArea");

  if(!area)return;


  if(!practiceQuestions.length){

    const result=
      await db
        .from("questions")
        .select("*")
        .eq("status","published")
        .limit(50);


    if(result.error){

      area.innerHTML=`

        <div class="errorBox">

          ${escapeHTML(result.error.message)}

        </div>

      `;

      return;

    }


    practiceQuestions=
      result.data||[];

    practiceQuestions=
      practiceQuestions.sort(
        ()=>Math.random()-.5
      );

  }


  if(!practiceQuestions.length){

    area.innerHTML=`

      <div class="empty">

        <div>

          <h2>
            No practice questions available
          </h2>

          <p style="margin-top:8px">
            Published questions will appear here.
          </p>

        </div>

      </div>

    `;

    return;

  }


  const q=
    practiceQuestions[
      practiceIndex%
      practiceQuestions.length
    ];


  practiceAnswer=null;


  area.innerHTML=`

    <div style="
      color:#718096;
      font-size:13px;
      margin-bottom:12px;
    ">

      Practice Question

    </div>


    <div class="questionText">

      ${escapeHTML(q.question_text)}

    </div>


    <div style="margin-top:20px">

      ${[
        ["A",q.option_a],
        ["B",q.option_b],
        ["C",q.option_c],
        ["D",q.option_d]
      ].map(
        ([letter,text])=>`

          <button
            class="optionButton"
            onclick="answerPractice('${letter}')">

            <strong>
              ${letter}.
            </strong>

            ${escapeHTML(text||"")}

          </button>

        `
      ).join("")}

    </div>


    <div id="practiceResult"></div>


    <button
      class="btn primary"
      style="margin-top:20px"
      onclick="nextPracticeQuestion()">

      Next Question →

    </button>

  `;

}


function answerPractice(answer){

  const q=
    practiceQuestions[
      practiceIndex%
      practiceQuestions.length
    ];


  const buttons=
    document.querySelectorAll(
      ".optionButton"
    );


  buttons.forEach(button=>{

    button.disabled=true;

  });


  const correct=
    String(answer).toUpperCase()===
    String(q.correct_answer||"").toUpperCase();


  const result=
    document.getElementById(
      "practiceResult"
    );


  if(correct){

    result.innerHTML=`

      <div class="status"
           style="margin-top:20px">

        ✓ Correct answer!

        ${
          q.explanation
          ?`<div style="margin-top:8px">
              ${escapeHTML(q.explanation)}
            </div>`
          :""
        }

      </div>

    `;

  }else{

    result.innerHTML=`

      <div class="errorBox">

        ✗ Incorrect.

        <br><br>

        Correct answer:
        <strong>
          ${escapeHTML(q.correct_answer||"—")}
        </strong>

        ${
          q.explanation
          ?`<div style="margin-top:8px">
              ${escapeHTML(q.explanation)}
            </div>`
          :""
        }

      </div>

    `;

  }

}


function nextPracticeQuestion(){

  practiceIndex++;

  loadPracticeQuestion();

}

async function loadExamReports(){

  const area=
    document.getElementById("reportsArea");

  if(!area)return;


  const result=
    await db
      .from("exam_attempts")
      .select(`
        *,
        exams (
          title,
          exam_type
        ),
        profiles (
          first_name,
          last_name,
          email
        )
      `)
      .order(
        "created_at",
        {ascending:false}
      );


  if(result.error){

    area.innerHTML=`

      <div class="errorBox">

        ${escapeHTML(result.error.message)}

      </div>

    `;

    return;

  }


  const attempts=
    result.data||[];


  if(!attempts.length){

    area.innerHTML=`

      <div class="tableEmpty">

        <h3>
          No exam attempts yet
        </h3>

      </div>

    `;

    return;

  }


  let rows="";


  attempts.forEach((attempt,index)=>{

    const student=
      attempt.profiles||{};


    const name=
      `
      ${student.first_name||""}
      ${student.last_name||""}
      `
      .trim()||
      student.email||
      "Student";


    rows+=`

      <tr>

        <td>
          ${index+1}
        </td>

        <td>

          <div class="studentName">
            ${escapeHTML(name)}
          </div>

          <div class="studentEmail">
            ${escapeHTML(student.email||"")}
          </div>

        </td>


        <td>
          ${escapeHTML(
            attempt.exams?.title||
            "Exam"
          )}
        </td>


        <td>
          ${Number(
            attempt.percentage||0
          ).toFixed(1)}%
        </td>


        <td>
          ${attempt.correct_answers||0}
        </td>


        <td>

          <span class="badge ${
            attempt.passed
            ?"badgeGreen"
            :"badgeRed"
          }">

            ${
              attempt.passed
              ?"Passed"
              :"Failed"
            }

          </span>

        </td>


        <td>
          ${formatDate(
            attempt.submitted_at||
            attempt.created_at
          )}
        </td>

      </tr>

    `;

  });


  area.innerHTML=`

    <table class="studentTable">

      <thead>

        <tr>

          <th>#</th>
          <th>Student</th>
          <th>Exam</th>
          <th>Score</th>
          <th>Correct</th>
          <th>Result</th>
          <th>Date</th>

        </tr>

      </thead>

      <tbody>

        ${rows}

      </tbody>

    </table>

  `;

}
