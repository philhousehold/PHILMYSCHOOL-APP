/* =========================================================

function escapeHTML(value){
 if(value===null||value===undefined)return "";

 return String(value)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function showAuthMessage(message,type=""){
 const box=document.getElementById("authMessage");
 if(!box)return;

 box.textContent=message;
 box.className="authMessage show "+type;
}

function clearAuthMessage(){
 const box=document.getElementById("authMessage");
 if(!box)return;

 box.textContent="";
 box.className="authMessage";
}

function money(value){
 return "₦"+Number(value||0).toLocaleString("en-NG");
}

function dateText(value){
 if(!value)return "—";

 const d=new Date(value);

 return isNaN(d)
  ?"—"
  :d.toLocaleDateString("en-NG");
}

function safeJSON(value){
 try{
  return JSON.stringify(value||{});
 }catch(e){
  return "{}";
 }
}

function normalizeAnswer(value){
 return String(value||"")
 .trim()
 .toUpperCase()
 .replace("OPTION ","")
 .replace("ANSWER ","");
}

function percent(correct,total){
 if(!total)return 0;
 return Math.round((correct/total)*100);
}

function weaknessLevel(score){
 if(score<50)return "weak";
 if(score<70)return "medium";
 return "good";
}

function recommendationForTopic(topic,score){
 if(score<50){
  return `You need major improvement in ${topic}. Revise this topic carefully and practise at least 20 additional questions before your next examination.`;
 }

 if(score<70){
  return `You have some difficulty with ${topic}. Review your study material and practise more questions from this topic.`;
 }

 if(score<85){
  return `You are doing fairly well in ${topic}. Continue practising to improve your accuracy.`;
 }

 return `Excellent performance in ${topic}. Continue practising to maintain this level.`;
}

async function register(event){

 event.preventDefault();
 clearAuthMessage();

 const firstName=document.getElementById("firstName").value.trim();
 const lastName=document.getElementById("lastName").value.trim();
 const email=document.getElementById("registerEmail").value.trim();
 const password=document.getElementById("registerPassword").value;

 const button=document.getElementById("registerButton");

 button.disabled=true;
 button.textContent="Creating account...";

 showAuthMessage("Creating your account...");

 try{

  const result=await db.auth.signUp({
   email,
   password,
   options:{
    data:{
     first_name:firstName,
     last_name:lastName,
     requested_role:selectedRole
    }
   }
  });

  if(result.error){

   showAuthMessage(
    result.error.message,
    "error"
   );

   button.disabled=false;
   button.textContent="Create Account";
   return;
  }

  if(!result.data.session){

   showAuthMessage(
    "Account created. Please confirm your email, then sign in.",
    "success"
   );

   button.disabled=false;
   button.textContent="Create Account";

   return;
  }

  await loadCurrentUser();

 }catch(error){

  console.error(error);

  showAuthMessage(
   error.message||"Registration failed.",
   "error"
  );

  button.disabled=false;
  button.textContent="Create Account";
 }
}

async function loadCurrentUser(){

 try{

  const auth=await db.auth.getUser();

  if(auth.error||!auth.data.user){

   user=null;
   profile=null;
   role=null;

   renderLanding();
   return;
  }

  user=auth.data.user;

  const profileResult=await db
   .from("profiles")
   .select("*")
   .eq("id",user.id)
   .maybeSingle();

  profile=profileResult.data||{
   id:user.id,
   email:user.email,
   display_name:user.email
  };

  const roleResult=await db
   .from("user_roles")
   .select("role,is_active,created_at")
   .eq("user_id",user.id)
   .eq("is_active",true)
   .order("created_at",{ascending:true})
   .limit(1)
   .maybeSingle();

  role=roleResult.data?.role||"student";

  openPortal();

 }catch(error){

  console.error(error);
  renderLanding();
 }
}

  return;

 renderStudent();
}

async function loadStudentDashboard(){

 try{

  const result=await db
   .from("exam_attempts")
   .select("*")
   .eq("student_id",user.id);

  if(result.error)return;

  const attempts=result.data||[];

  const qCount=attempts.reduce(
   (sum,x)=>sum+Number(x.total_questions||0),
   0
  );

  const correct=attempts.reduce(
   (sum,x)=>sum+Number(x.correct_answers||0),
   0
  );

  const weak=attempts.filter(
   x=>Number(x.score||0)<70
  ).length;

  const q=document.getElementById("studentQuestions");
  const e=document.getElementById("studentExams");
  const a=document.getElementById("studentAccuracy");
  const w=document.getElementById("studentWeak");

  if(q)q.textContent=qCount;
  if(e)e.textContent=attempts.length;
  if(a)a.textContent=qCount
   ?percent(correct,qCount)+"%"
   :"—";

  if(w)w.textContent=weak||"—";

  const latest=attempts
   .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];

  if(latest){
   const rec=document.getElementById(
    "dashboardRecommendation"
   );

   if(rec){
    rec.textContent=
     latest.recommendation||
     "Continue practising your weaker areas.";
   }
  }

 }catch(e){}
}

async function startCBT(subjectId,subjectName){

    onclick="studentSubjects()">

      ${escapeHTML(subjectName)}.
     </p>

     <div class="loading">
      Please wait...
     </div>

    </div>

   </main>

  </div>

 </div>`;

 try{

  let questions=[];

  /*
   First use the random question-bank RPC
   installed in your Supabase database.
  */

  const rpc=await db.rpc(
   "get_random_subject_questions",
   {
    p_subject_id:subjectId,
    p_question_count:50
   }
  );

  if(!rpc.error&&rpc.data){
   questions=rpc.data;
  }

  /*
   Fallback: directly select up to 50 questions
   if the RPC returns an error.
  */

  if(!questions.length){

   const fallback=await db
    .from("questions")
    .select("*")
    .eq("subject_id",subjectId)
    .eq("status","published")
    .limit(50);

   if(fallback.error){
    throw fallback.error;
   }

   questions=fallback.data||[];

   questions.sort(
    ()=>Math.random()-.5
   );
  }

  if(!questions.length){

   alert(
    "There are no published questions available for this subject."
   );

   studentSubjects();
   return;
  }

  cbt={
   questions,
   answers:{},
   current:0,
   subject:subjectName,
   subjectId,
   started:true,
   submitted:false,
   timer:null,
   seconds:questions.length*60,
   startedAt:new Date().toISOString()
  };

  renderCBT();

  startCBTTimer();

 }catch(error){

  console.error(error);

  document.getElementById("app").innerHTML=`

   <div class="content">

    <div class="errorBox">

     <h3>Could not start CBT</h3>

     <p style="margin-top:10px">

    </div>

   </div>`;
 }
}

function selectCBTAnswer(id,answer){

 cbt.answers[id]=answer;

 renderCBT();
}

function nextCBTQuestion(){

 if(cbt.current<cbt.questions.length-1){

  cbt.current++;

  renderCBT();
 }
}

function previousCBTQuestion(){

 if(cbt.current>0){

  cbt.current--;

  renderCBT();
 }
}

function goCBTQuestion(index){

 cbt.current=index;

 renderCBT();
}

function startCBTTimer(){

 clearInterval(cbt.timer);

 cbt.timer=setInterval(()=>{

  cbt.seconds--;

  const el=document.getElementById("cbtTimer");

  if(el){

   const minutes=Math.floor(
    Math.max(0,cbt.seconds)/60
   );

   const seconds=Math.max(
    0,cbt.seconds%60
   );

   el.textContent=
    String(minutes).padStart(2,"0")+
    ":"+
    String(seconds).padStart(2,"0");

   if(cbt.seconds<=60){
    el.classList.add("dangerTimer");
   }
  }

  if(cbt.seconds<=0){

   clearInterval(cbt.timer);

   submitCBT();
  }

 },1000);
}

function confirmSubmitCBT(){

 const answered=
  Object.keys(cbt.answers).length;

 const total=cbt.questions.length;

 if(answered<total){

  const yes=confirm(
   `You have answered ${answered} of ${total} questions.\n\nSubmit anyway?`
  );

  if(!yes)return;
 }

 submitCBT();
}

/* =========================================================
   SUBMIT CBT + ANALYSIS
========================================================= */

async function submitCBT(){

 if(cbt.submitted)return;

 cbt.submitted=true;

 clearInterval(cbt.timer);

 let correct=0;
 let totalMarks=0;
 let earnedMarks=0;

 const topicStats={};
 const questionResults=[];

 for(const q of cbt.questions){

  const selected=normalizeAnswer(
   cbt.answers[q.id]
  );

  const correctAnswer=normalizeAnswer(
   q.correct_answer||
   q.answer||
   q.correct_option
  );

  const marks=Number(q.marks||1);

  totalMarks+=marks;

  const isCorrect=
   selected &&
   selected===correctAnswer;

  if(isCorrect){
   correct++;
   earnedMarks+=marks;
  }

  const topic=
   q.topic||
   q.topic_name||
   "General";

  if(!topicStats[topic]){

   topicStats[topic]={
    total:0,
    correct:0,
    marks:0,
    earned:0
   };
  }

  topicStats[topic].total++;
  topicStats[topic].marks+=marks;

  if(isCorrect){

   topicStats[topic].correct++;
   topicStats[topic].earned+=marks;
  }

  questionResults.push({
   question_id:q.id,
   question_text:q.question_text,
   selected_answer:selected,
   correct_answer:correctAnswer,
   is_correct:isCorrect,
   topic,
   feedback:q.feedback||"",
   recommendation:q.recommendation||""
  });
 }

 const score=percent(
  earnedMarks,
  totalMarks
 );

 const topicAnalysis=
  Object.entries(topicStats)
  .map(([topic,data])=>({

   topic,

   total:data.total,

   correct:data.correct,

   score:percent(
    data.correct,
    data.total
   ),

   level:weaknessLevel(
    percent(data.correct,data.total)
   ),

   recommendation:
    recommendationForTopic(
     topic,
     percent(data.correct,data.total)
    )
  }))
  .sort((a,b)=>a.score-b.score);

 const weakTopics=
  topicAnalysis.filter(x=>x.score<70);

 const strongTopics=
  topicAnalysis.filter(x=>x.score>=70);

 let overallRecommendation="";

 if(!topicAnalysis.length){

  overallRecommendation=
   "Continue practising regularly.";
 }
 else if(weakTopics.length){

  const names=weakTopics
   .slice(0,3)
   .map(x=>x.topic)
   .join(", ");

  overallRecommendation=
   `Your main area${weakTopics.length>1?"s are":" is"} ${names}. `+
   `Focus your next study session on these topics and `+
   `practise additional questions before attempting another full CBT.`;
 }
 else if(score>=85){

  overallRecommendation=
   "Excellent performance. Continue practising to maintain your strong performance.";
 }
 else{

  overallRecommendation=
   "You are making good progress. Continue practising and review the topics where your score is below 85%.";
 }

 const resultData={
  score,
  total_questions:cbt.questions.length,
  correct_answers:correct,
  wrong_answers:cbt.questions.length-correct,
  total_marks:totalMarks,
  earned_marks:earnedMarks,
  subject_id:cbt.subjectId,
  subject_name:cbt.subject,
  recommendation:overallRecommendation,
  weak_topics:weakTopics,
  strong_topics:strongTopics
 };

 /*
  Save the overall attempt when the exam_attempts
  table is available.
 */

 try{

  await db.from("exam_attempts").insert({
   student_id:user.id,
   subject_id:cbt.subjectId,
   total_questions:cbt.questions.length,
   correct_answers:correct,
   wrong_answers:cbt.questions.length-correct,
   score,
   total_marks:totalMarks,
   earned_marks:earnedMarks,
   recommendation:overallRecommendation,
   created_at:new Date().toISOString()
  });

 }catch(error){

  console.warn(
   "Attempt save warning:",
   error
  );
 }

 /*
  Store the result locally as well, so the result
  can always be displayed even if the optional
  result-history table is not installed yet.
 */

 localStorage.setItem(
  "philmyschool_last_result",
  JSON.stringify({
   ...resultData,
   questionResults,
   topicAnalysis,
   date:new Date().toISOString()
  })
 );

 renderCBTResult({
  ...resultData,
  questionResults,
  topicAnalysis
 });
}

async function startPractice(subjectId,subjectName){

 const result=await db
  .from("questions")
  .select("*")
  .eq("subject_id",subjectId)
  .eq("status","published")
  .limit(20);

 if(result.error){

  alert(result.error.message);
  return;
 }

 const rows=(result.data||[])
  .sort(()=>Math.random()-.5);

 if(!rows.length){

  alert("No published questions found.");
  return;
 }

 let index=0;
 let score=0;

 function showPractice(){

  const q=rows[index];

  document.getElementById("app").innerHTML=`

   <div class="portal">

    <div class="main"
     style="margin-left:0">

     <header class="topbar">
      <strong>
       ❓ ${escapeHTML(subjectName)}
      </strong>

      <div class="topUser">
       ${index+1}/${rows.length}
      </div>
     </header>

     <main class="content">

      <div class="cbtWrap">

       <div class="questionCard">

        <div class="questionNumber">
         PRACTICE QUESTION ${index+1}
        </div>

        <div class="questionText">
         ${escapeHTML(q.question_text)}
        </div>

        <div class="options">

         ${[
          ["A",q.option_a],
          ["B",q.option_b],
          ["C",q.option_c],
          ["D",q.option_d]
         ].map(o=>`

          <button class="option"
           onclick="answerPractice(
            '${q.id}',
            '${o[0]}'
           )">

           <span class="optionLetter">
            ${o[0]}
           </span>

           <span>
            ${escapeHTML(o[1]||"")}
           </span>

          </button>

         `).join("")}

        </div>

        <div id="practiceFeedback"></div>

       </div>

      </div>

     </main>

    </div>

   </div>`;

  window.answerPractice=function(id,answer){

   const correct=
    normalizeAnswer(q.correct_answer);

   const chosen=
    normalizeAnswer(answer);

   const ok=chosen===correct;

   if(ok)score++;

   const feedback=
    document.getElementById(
     "practiceFeedback"
    );

   feedback.innerHTML=`

    <div class="feedbackBox ${
     ok
     ?"feedbackCorrect"
     :"feedbackWrong"
    }">

     ${
      ok
      ?"✓ Correct!"
      :"✕ Incorrect."
     }

     <br>

     Correct answer:
     <strong>${escapeHTML(correct)}</strong>

    </div>

    ${
     q.feedback
     ?`
      <div class="notice">
       <strong>Feedback:</strong>
       ${escapeHTML(q.feedback)}
      </div>
     `
     :""
    }

    ${
     q.recommendation
     ?`
      <div class="recommendation">
       <strong>Recommendation:</strong>
       ${escapeHTML(q.recommendation)}
      </div>
     `
     :""
    }

    <button class="btn primary"
     style="margin-top:15px"
     onclick="
      if(${index+1}>=${rows.length}){
       alert('Practice complete! Score: '+${score}+'/'+${rows.length});
       studentSubjects();
      }else{
       ${index}++;
       showPractice();
      }
     ">
     ${index+1>=rows.length?"Finish":"Next Question →"}
    </button>
   `;
  };
 }

 showPractice();
}

async function countTable(table,filters=[]){

 try{

  let q=db
   .from(table)
   .select("*",{count:"exact",head:true});

  filters.forEach(([column,value])=>{
   q=q.eq(column,value);
  });

  const r=await q;

  return r.error
   ?0
   :(r.count||0);

 }catch(e){

  return 0;
 }
}

function processCSVFile(file){

}

/*
 Robust CSV parser supporting:
 - commas
 - quoted questions
 - commas inside feedback
 - commas inside recommendations
 - escaped quotes
*/

function parseCSV(text){

 const rows=[];
 let row=[];
 let cell="";
 let quoted=false;

 for(let i=0;i<text.length;i++){

  const char=text[i];
  const next=text[i+1];

  if(char==='"'){

   if(quoted&&next==='"'){

    cell+='"';
    i++;

   }else{

    quoted=!quoted;
   }

   continue;
  }

  if(char===","&&!quoted){

   row.push(cell.trim());
   cell="";
   continue;
  }

  if(
   (char==="\n"||char==="\r")&&!quoted
  ){

   if(char==="\r"&&next==="\n")i++;

   row.push(cell.trim());

   if(row.some(x=>x!=="")){
    rows.push(row);
   }

   row=[];
   cell="";

   continue;
  }

  cell+=char;
 }

 if(cell.length||row.length){

  row.push(cell.trim());

  if(row.some(x=>x!=="")){
   rows.push(row);
  }
 }

 if(!rows.length)return[];

 const headers=rows[0].map(
  h=>String(h)
   .trim()
   .toLowerCase()
 );

 return rows.slice(1).map(values=>{

  const obj={};

  headers.forEach((h,i)=>{
   obj[h]=values[i]??"";
  });

  return obj;
 });
}

async function importCSVRows(){

 const rows=window.csvRows||[];

 if(!rows.length){

  alert("No CSV rows selected.");
  return;
 }

 const action=document.getElementById(
  "csvImportActions"
 );

 action.innerHTML=`
  <button class="btn primary" disabled>
   Importing...
  </button>`;

 const progress=document.getElementById(
  "csvProgress"
 );

 progress.innerHTML=`

  <div style="margin-top:20px">
   <strong id="importStatus">
    Preparing...
   </strong>

   <div class="importProgress">
    <span id="importProgressBar"></span>
   </div>
  </div>`;

 let imported=0;
 let failed=0;
 const errors=[];

 /*
  Cache subjects so hundreds of rows do not
  require repeated subject searches.
 */

 const subjectCache={};

 for(let i=0;i<rows.length;i++){

  const r=rows[i];

  try{

   const subjectName=
    String(r.subject_name||"").trim();

   const subjectCode=
    String(r.subject_code||"")
    .trim()
    .toUpperCase();

   const topic=
    String(r.topic||"General").trim();

   const questionText=
    String(r.question_text||"").trim();

   if(
    !subjectName||
    !subjectCode||
    !questionText||
    !r.option_a||
    !r.option_b||
    !r.option_c||
    !r.option_d||
    !r.correct_answer
   ){

    throw new Error(
     "Missing required question information."
    );
   }

   /*
    Validate answer.
   */

   const answer=
    normalizeAnswer(r.correct_answer);

   if(!["A","B","C","D"].includes(answer)){

    throw new Error(
     "correct_answer must be A, B, C or D."
    );
   }

   /*
    Get/create subject.
   */

   const cacheKey=subjectCode;

   let subjectId=
    subjectCache[cacheKey];

   if(!subjectId){

    const existing=await db
     .from("subjects")
     .select("id,subject_name,subject_code")
     .eq("subject_code",subjectCode)
     .maybeSingle();

    if(existing.error){

     throw existing.error;
    }

    if(existing.data){

     subjectId=existing.data.id;

    }else{

     const created=await db
      .from("subjects")
      .insert({
       subject_name:subjectName,
       subject_code:subjectCode
      })
      .select("id")
      .single();

     if(created.error){

      throw created.error;
     }

     subjectId=created.data.id;
    }

    subjectCache[cacheKey]=subjectId;
   }

   /*
    Build question payload.
   */

   const payload={
    subject_id:subjectId,
    question_text:questionText,
    option_a:String(r.option_a||"").trim(),
    option_b:String(r.option_b||"").trim(),
    option_c:String(r.option_c||"").trim(),
    option_d:String(r.option_d||"").trim(),
    correct_answer:answer,
    feedback:String(r.feedback||"").trim()||null,
    recommendation:String(r.recommendation||"").trim()||null,
    difficulty:String(
     r.difficulty||"medium"
    ).trim().toLowerCase(),
    marks:Number(r.marks||1),
    exam_type:String(
     r.exam_type||"CBT"
    ).trim(),
    source_name:String(
     r.source_name||""
    ).trim()||null,
    source_year:r.source_year
     ?Number(r.source_year)
     :null,
    status:String(
     r.status||"published"
    ).trim().toLowerCase(),
    topic:topic
   };

   /*
    Optional fields that may exist in your
    questions table.
   */

   if(r.topic_id){
    payload.topic_id=r.topic_id;
   }

   if(r.image_url){
    payload.image_url=r.image_url;
   }

   if(r.source_type){
    payload.source_type=r.source_type;
   }

   const inserted=await db
    .from("questions")
    .insert(payload);

   if(inserted.error){

    throw inserted.error;
   }

   imported++;

  }catch(error){

   failed++;

   errors.push({
    row:i+2,
    message:error.message
   });
  }

  const progressValue=
   Math.round(
    ((i+1)/rows.length)*100
   );

  const bar=document.getElementById(
   "importProgressBar"
  );

  const status=document.getElementById(
   "importStatus"
  );

  if(bar){
   bar.style.width=
    progressValue+"%";
  }

  if(status){

   status.textContent=
    `Processing ${i+1} of ${rows.length} — ${progressValue}%`;
  }
 }

 document.getElementById(
  "csvImportActions"
 ).innerHTML=`

  <div class="status">

   ✓ Import completed.

   <br><br>

   <strong>
    Successfully imported:
    ${imported}
   </strong>

   <br>

   Failed:
   ${failed}

  </div>

  <button class="btn primary"
   style="margin-top:15px"
   onclick="adminQuestionBank()">
   Open Question Bank
  </button>

  <button class="btn secondary"
   style="margin-top:15px"
   onclick="csvImporter()">
   Import Another CSV
  </button>`;

 if(errors.length){

  document.getElementById(
   "csvPreview"
  ).innerHTML+=`

   <div class="errorBox">

    <h3>
     Rows that could not be imported
    </h3>

    <div style="margin-top:10px">

     ${errors.map(e=>`

      <div style="margin-top:7px">
       Row ${e.row}:
       ${escapeHTML(e.message)}
      </div>

     `).join("")}

    </div>

   </div>`;
 }
}

function closeQuestionModal(){

 document.getElementById(
  "questionModal"
 )?.remove();
}

async function saveQuestion(id){

 const payload={
  subject_id:
   document.getElementById(
    "qSubject"
   ).value,

  topic:
   document.getElementById(
    "qTopic"
   ).value.trim(),

  question_text:
   document.getElementById(
    "qText"
   ).value.trim(),

  option_a:
   document.getElementById(
    "qA"
   ).value.trim(),

  option_b:
   document.getElementById(
    "qB"
   ).value.trim(),

  option_c:
   document.getElementById(
    "qC"
   ).value.trim(),

  option_d:
   document.getElementById(
    "qD"
   ).value.trim(),

  correct_answer:
   document.getElementById(
    "qAnswer"
   ).value,

  difficulty:
   document.getElementById(
    "qDifficulty"
   ).value,

  marks:Number(
   document.getElementById(
    "qMarks"
   ).value||1
  ),

  status:
   document.getElementById(
    "qStatus"
   ).value,

  feedback:
   document.getElementById(
    "qFeedback"
   ).value.trim()||null,

  recommendation:
   document.getElementById(
    "qRecommendation"
   ).value.trim()||null
 };

 if(
  !payload.subject_id||
  !payload.question_text||
  !payload.option_a||
  !payload.option_b||
  !payload.option_c||
  !payload.option_d
 ){

  alert(
   "Subject, question and all four options are required."
  );

  return;
 }

 let result;

 if(id){

  result=await db
   .from("questions")
   .update(payload)
   .eq("id",id);

 }else{

  payload.created_by=user.id;

  result=await db
   .from("questions")
   .insert(payload);
 }

 if(result.error){

  document.getElementById(
   "questionMessage"
  ).innerHTML=`

   <div class="errorBox">
    ${escapeHTML(
     result.error.message
    )}
   </div>`;

  return;
 }

 closeQuestionModal();

 await adminQuestionBank();
}

async function deleteQuestion(id){

 if(!confirm(
  "Delete this question permanently?"
 ))return;

 const result=await db
  .from("questions")
  .delete()
  .eq("id",id);

 if(result.error){

  alert(result.error.message);
  return;
 }

 await adminQuestionBank();
}

async function loadStudents(){

 const area=document.getElementById(
  "studentManagementArea"
 );

 if(!area)return;

 const rolesResult=await db
  .from("user_roles")
  .select(
   "id,user_id,role,is_active,created_at"
  )
  .eq("role","student")
  .order(
   "created_at",
   {ascending:false}
  );

 if(rolesResult.error){

  area.innerHTML=`
   <div class="errorBox">
    ${escapeHTML(
     rolesResult.error.message
    )}
   </div>`;

  return;
 }

 const roles=rolesResult.data||[];

 const ids=roles
  .map(x=>x.user_id)
  .filter(Boolean);

 if(!ids.length){

  allStudents=[];

  area.innerHTML=`
   <div class="tableEmpty">
    <h3>No students yet</h3>
   </div>`;

  return;
 }

 const profilesResult=await db
  .from("profiles")
  .select("*")
  .in("id",ids);

 if(profilesResult.error){

  area.innerHTML=`
   <div class="errorBox">
    ${escapeHTML(
     profilesResult.error.message
    )}
   </div>`;

  return;
 }

 allStudents=roles.map(r=>{

  const p=
   (profilesResult.data||[])
   .find(
    x=>x.id===r.user_id
   )||{};

  return {
   ...p,
   user_id:r.user_id,
   role:r.role,
   is_active:r.is_active
  };
 });

 renderStudentTable(allStudents);
}

function filterStudents(){

 const search=
  document.getElementById(
   "studentSearch"
  )?.value.toLowerCase().trim()||"";

 const rows=
  !search
  ?allStudents
  :allStudents.filter(s=>
   [
    s.first_name,
    s.last_name,
    s.display_name,
    s.email,
    s.phone
   ]
   .filter(Boolean)
   .join(" ")
   .toLowerCase()
   .includes(search)
  );

 renderStudentTable(rows);
}

  .from(cfg.table)
  .select("*")

 );

 if(!rows.length){

  area.innerHTML=`

    <h3>No records found.</h3>
   </div>`;

  return;
 }

 area.innerHTML=`

  <thead>

     c=>`<th>${escapeHTML(c[1])}</th>`
    ).join("")}

   </tr>
  </thead>

  <tbody>

   ${rows.map(row=>`

    <tr>

     ${cfg.columns.map(c=>{

      let value=row[c[0]];

      if(
       String(c[0]).includes("at")
      ){
       value=dateText(value);
      }

      if(
       Array.isArray(value)
      ){
       value=value.join(", ");
      }

      if(
       typeof value==="object"&&
       value!==null
      ){
       value=safeJSON(value);

      return `

   `).join("")}

 </table>`;
}

function openModuleForm(module,id=null){

 const cfg=MODULES[module];

 const existing=
  id
  ?currentModuleRows.find(
   x=>x.id===id
  )
  :null;

 const fields=cfg.fields.map(
  f=>{

   const key=f[0];
   const label=f[1];
   const type=f[2];
   const required=f[3];

   let value=
    existing?.[key]||
    cfg.defaults?.[key]||
    "";

   if(type==="checkbox"){

    return `

     <div class="formGroup">

      <label>

       <input
        type="checkbox"
        id="field_${key}"
        ${
         value
         ?"checked"
         :""
        }
        style="width:auto">

       ${escapeHTML(label)}

      </label>

     </div>`;
   }

   if(type==="textarea"){

    return `

     <div class="formGroup full">

      <label>
       ${escapeHTML(label)}
      </label>

      <textarea
       id="field_${key}"
       ${
        required
        ?"required"
        :""
       }>${escapeHTML(value)}</textarea>

     </div>`;
   }

   return `

    <div class="formGroup">

     <label>
      ${escapeHTML(label)}
     </label>

     <input
      id="field_${key}"
      type="${type}"
      value="${escapeHTML(value)}"
      ${
       required
       ?"required"
       :""
      }>

    </div>`;
  }
 ).join("");

 document.body.insertAdjacentHTML(
  "beforeend",
  `

  <div class="modal"
   id="moduleModal">

   <div class="modalBox">

    <div class="modalHead">

     <h2>
      ${id?"Edit":"Add"}
      ${escapeHTML(cfg.title)}
     </h2>

     <button
      class="closeBtn"
      onclick="closeModal()">
      ✕
     </button>

    </div>

    <div class="formGrid">
     ${fields}
    </div>

    <div id="moduleFormMessage"></div>

    <div style="
     display:flex;
     gap:10px;
     margin-top:20px">

     <button
      class="btn secondary"
      onclick="closeModal()">
      Cancel
     </button>

     <button
      class="btn primary"
      onclick="saveModuleRecord('${module}','${id||""}')">

      ${id
       ?"Save Changes"
       :"Create Record"}

     </button>

    </div>

   </div>

  </div>`
 );
}

function closeModal(){

 document.getElementById(
  "moduleModal"
 )?.remove();
}

async function saveModuleRecord(module,id){

 const cfg=MODULES[module];

 const payload={};

 for(const f of cfg.fields){

  const key=f[0];
  const type=f[2];

  const el=document.getElementById(
   "field_"+key
  );

  if(!el)continue;

  if(type==="checkbox"){

   payload[key]=el.checked;
   continue;
  }

  let value=el.value;

  if(value===""){

   payload[key]=null;
   continue;
  }

  if(type==="number"){

   payload[key]=Number(value);
   continue;
  }

  payload[key]=value;
 }

 let result;

 if(id){

  result=await db
   .from(cfg.table)
   .update(payload)
   .eq("id",id);

 }else{

  result=await db
   .from(cfg.table)
   .insert(payload);
 }

 if(result.error){

  document.getElementById(
   "moduleFormMessage"
  ).innerHTML=`

   <div class="errorBox">
    ${escapeHTML(
     result.error.message
    )}
   </div>`;

  return;
 }

 closeModal();

 await loadModule(module);
}

async function deleteModuleRecord(module,id){

 const cfg=MODULES[module];

 if(!confirm(
  `Delete this ${cfg.title.toLowerCase()} record?`
 ))return;

 const result=await db
  .from(cfg.table)
  .delete()
  .eq("id",id);

 if(result.error){

  alert(result.error.message);
  return;
 }

 await loadModule(module);
}

async function loadTutors(){

 const area=document.getElementById(
  "tutorArea"
 );

 const roles=await db
  .from("user_roles")
  .select(
   "user_id,role,is_active,created_at"
  )
  .eq("role","tutor")
  .order(
   "created_at",
   {ascending:false}
  );

 if(roles.error){

  area.innerHTML=`
   <div class="errorBox">
    ${escapeHTML(
     roles.error.message
    )}
   </div>`;

  return;
 }

 const ids=(roles.data||[])
  .map(x=>x.user_id);

 if(!ids.length){

  area.innerHTML=`
   <div class="tableEmpty">
    <h3>No tutors yet.</h3>
   </div>`;

  return;
 }

 const profiles=await db
  .from("profiles")
  .select("*")
  .in("id",ids);

 if(profiles.error){

  area.innerHTML=`
   <div class="errorBox">
    ${escapeHTML(
     profiles.error.message
    )}
   </div>`;

  return;
 }

 tutorRows=(roles.data||[]).map(r=>{

  const p=
   (profiles.data||[])
   .find(x=>x.id===r.user_id)||{};

  return {
   ...p,
   user_id:r.user_id,
   is_active:r.is_active
  };
 });

 renderTutorTable(tutorRows);
}

function filterTutors(){

 const q=
  document.getElementById(
   "tutorSearch"
  )?.value.toLowerCase().trim()||"";

 const rows=
  !q
  ?tutorRows
  :tutorRows.filter(t=>
   JSON.stringify(t)
   .toLowerCase()
   .includes(q)
  );

 renderTutorTable(rows);
}

function renderTutorTable(rows){

 const area=document.getElementById(
  "tutorArea"
 );

 if(!rows.length){

  area.innerHTML=`
   <div class="tableEmpty">
    <h3>No tutors found.</h3>
   </div>`;

  return;
 }

 area.innerHTML=`

 <table class="studentTable">

  <thead>
   <tr>
    <th>Tutor</th>
    <th>Email</th>
    <th>Phone</th>
    <th>State</th>
    <th>Status</th>
   </tr>
  </thead>

  <tbody>

   ${rows.map(t=>{

    const name=
     t.display_name||
     `${t.first_name||""} ${t.last_name||""}`
     .trim()||
     "Tutor";

    return `

     <tr>

      <td>
       <strong>
        ${escapeHTML(name)}
       </strong>
      </td>

      <td>
       ${escapeHTML(t.email||"—")}
      </td>

      <td>
       ${escapeHTML(t.phone||"—")}
      </td>

      <td>
       ${escapeHTML(t.state||"—")}
      </td>

      <td>

       <span class="badge ${
        t.is_active
        ?"badgeGreen"
        :"badgeRed"
       }">

        ${
         t.is_active
         ?"Active"
         :"Inactive"
        }

       </span>

      </td>

     </tr>`;
   }).join("")}

  </tbody>

 </table>`;
}
