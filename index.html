function escapeHTML(value){

  if(value===null || value===undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showAuthMessage(message){

  const box=document.getElementById("authMessage");

  if(!box)return;

  box.textContent=message;
  box.classList.add("show");
}

function clearAuthMessage(){

  const box=document.getElementById("authMessage");

function chooseRole(type){

selectedRole=type;

document
.getElementById("studentRole")
.classList
.toggle("active",type==="student");

.getElementById("tutorRole")
.classList

/* =========================================================
   REGISTER
========================================================= */

async function register(event){

event.preventDefault();

clearAuthMessage();

const firstName=
document.getElementById("firstName").value.trim();

const lastName=
document.getElementById("lastName").value.trim();

const email=
document.getElementById("registerEmail").value.trim();

const password=
document.getElementById("registerPassword").value;

showAuthMessage("Creating your account...");

const result=
await db.auth.signUp({

email,
password,

options:{
data:{
first_name:firstName,
last_name:lastName,
requested_role:selectedRole
}
}

});

if(result.error){

showAuthMessage(result.error.message);
return;

}

if(!result.data.session){

showAuthMessage(
"Account created. Check your email to confirm your account, then sign in."
);

return;

}

await ensureProfileAndRole(
result.data.user,
firstName,
lastName,
selectedRole
);

await loadCurrentUser();

}


/* =========================================================
   PROFILE + ROLE
========================================================= */

async function ensureProfileAndRole(
authUser,
firstName,
lastName,
requestedRole
){

const profilePayload={

id:authUser.id,
email:authUser.email,
first_name:firstName,
last_name:lastName,
display_name:`${firstName} ${lastName}`.trim(),
account_status:"active",
onboarding_completed:false

};

const profileResult=
await db
.from("profiles")
.upsert(
profilePayload,
{onConflict:"id"}
);

if(profileResult.error){

console.warn(
"Profile creation:",
profileResult.error.message
);

}

const roleResult=
await db
.from("user_roles")
.select("id,role,is_active")
.eq("user_id",authUser.id)
.eq("is_active",true)
.limit(1)
.maybeSingle();

if(!roleResult.data){

const insertRole=
await db
.from("user_roles")
.insert({

user_id:authUser.id,
role:requestedRole,
is_active:true

});

if(insertRole.error){

console.warn(
"Role creation:",
insertRole.error.message
);

}

}

}

async function loadCurrentUser(){

const auth=
await db.auth.getUser();

if(auth.error || !auth.data.user){

renderLanding();
return;

}

user=auth.data.user;

const profileResult=
await db
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();

profile=
profileResult.data||{
id:user.id,
email:user.email,
display_name:user.email
};

const roleResult=
await db
.from("user_roles")
.select("role")
.eq("user_id",user.id)
.eq("is_active",true)
.order("created_at",{ascending:true})
.limit(1)
.maybeSingle();

role=
roleResult.data?.role||"student";

openPortal();

}

/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadStudents(){

const area=
document.getElementById("studentManagementArea");

if(!area)return;

area.innerHTML=`
<div class="loading">
Loading students...
</div>
`;

try{

/*
  We first get all active/inactive roles
  belonging to students.
*/

const rolesResult=
await db
.from("user_roles")
.select("id,user_id,role,is_active,created_at")
.eq("role","student")
.order("created_at",{ascending:false});


if(rolesResult.error){

console.error(rolesResult.error);

area.innerHTML=`
<div class="errorBox">
<strong>Unable to load students.</strong>
<br><br>
${escapeHTML(rolesResult.error.message)}
</div>
`;

return;

}


const roles=rolesResult.data||[];

const userIds=
roles
.map(x=>x.user_id)
.filter(Boolean);


/*
  No students found.
*/

if(userIds.length===0){

allStudents=[];

updateStudentStats();

area.innerHTML=`

<div class="tableEmpty">

<h3>No students yet</h3>

<p style="margin-top:8px">
Registered student accounts will appear here.
</p>

</div>

`;

return;

}


/*
  Load profiles.
*/

const profilesResult=
await db
.from("profiles")
.select(`
id,
email,
first_name,
last_name,
display_name,
phone,
avatar_url,
date_of_birth,
gender,
state,
lga,
country,
account_status,
onboarding_completed,
created_at,
updated_at
`)
.in("id",userIds);


if(profilesResult.error){

console.error(profilesResult.error);

area.innerHTML=`
<div class="errorBox">
<strong>Student profiles could not be loaded.</strong>
<br><br>
${escapeHTML(profilesResult.error.message)}
</div>
`;

return;

}


const profiles=profilesResult.data||[];


/*
  Combine profile + role.
*/

allStudents=roles.map(roleRow=>{

const p=
profiles.find(
profileRow=>profileRow.id===roleRow.user_id
)||{};

return{

...p,

user_id:roleRow.user_id,

role:roleRow.role,

is_active:roleRow.is_active,

role_created_at:roleRow.created_at

};

});


updateStudentStats();

renderStudentTable(allStudents);

}catch(error){

console.error(error);

area.innerHTML=`
<div class="errorBox">
<strong>Something went wrong.</strong>
<br><br>
${escapeHTML(error.message||"Unable to load students.")}
</div>
`;

}

}


/* =========================================================
   STUDENT STATS
========================================================= */

function updateStudentStats(){

const total=
allStudents.length;

const active=
allStudents.filter(
student=>student.is_active!==false
).length;

const inactive=
total-active;

const totalEl=
document.getElementById("totalStudents");

const activeEl=
document.getElementById("activeStudents");

const inactiveEl=
document.getElementById("inactiveStudents");

const showingEl=
document.getElementById("showingStudents");

if(totalEl)totalEl.textContent=total;

if(activeEl)activeEl.textContent=active;

if(inactiveEl)inactiveEl.textContent=inactive;

if(showingEl)showingEl.textContent=total;

}


/* =========================================================
   FILTER STUDENTS
========================================================= */

function filterStudents(){

const input=
document.getElementById("studentSearch");

if(!input)return;

const search=
input.value
.trim()
.toLowerCase();

if(!search){

renderStudentTable(allStudents);

return;

}

const filtered=
allStudents.filter(student=>{

const name=
`${student.first_name||""} ${student.last_name||""} ${student.display_name||""}`
.toLowerCase();

const email=
(student.email||"").toLowerCase();

const phone=
(student.phone||"").toLowerCase();

return(
name.includes(search)||
email.includes(search)||
phone.includes(search)
);

});

const showingEl=
document.getElementById("showingStudents");

if(showingEl){
showingEl.textContent=filtered.length;
}

renderStudentTable(filtered);

}

/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

await db.auth.signOut();

user=null;
profile=null;
role=null;

renderLanding();

}


/* =========================================================
   AUTH LISTENER
========================================================= */

db.auth.onAuthStateChange(
(event,session)=>{

if(event==="SIGNED_OUT"){

user=null;
profile=null;
role=null;

renderLanding();

}

}
);


/* =========================================================
   INITIAL LOAD
========================================================= */

(async function(){

try{

const sessionResult=
await db.auth.getSession();

if(sessionResult.error){

console.error(
sessionResult.error
);

renderLanding();

return;

}

if(sessionResult.data.session){

await loadCurrentUser();

}else{

renderLanding();

}

}catch(error){

console.error(error);

document.getElementById("app").innerHTML=`

<div style="
padding:40px;
font-family:Arial;
">

<h2>PHILMYSCHOOL</h2>

<p style="margin-top:10px;color:#718096">

The application could not finish loading.

</p>

<button
class="btn primary"
style="margin-top:20px"
onclick="renderLanding()">

Reload PHILMYSCHOOL

</button>

</div>

`;

}

})();

</script>
