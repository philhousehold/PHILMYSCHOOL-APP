function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showAuthMessage(message){

/* =========================================================
   REGISTER ACCOUNT
========================================================= */

async function register(event){

  event.preventDefault();

  clearAuthMessage();


  const firstName =
    document
      .getElementById("firstName")
      .value
      .trim();


  const lastName =
    document
      .getElementById("lastName")
      .value
      .trim();


  const email =
    document
      .getElementById("registerEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("registerPassword")
      .value;


  showAuthMessage(
    "Creating your account..."
  );


  const result =
    await db.auth.signUp({

      email,

      password,

      options:{
        data:{
          first_name:firstName,
          last_name:lastName,
          requested_role:selectedRole
        }
      }

    });


  if(result.error){

    showAuthMessage(
      result.error.message
    );

    return;

  }


  if(!result.data.session){

    showAuthMessage(
      "Account created. Check your email to confirm your account, then sign in."
    );

    return;

  }


  await ensureProfileAndRole(
    result.data.user,
    firstName,
    lastName,
    selectedRole
  );


  await loadCurrentUser();

}


/* =========================================================
   PROFILE + ROLE
========================================================= */

async function ensureProfileAndRole(
  authUser,
  firstName,
  lastName,
  requestedRole
){

  const profileResult =
    await db
      .from("profiles")
      .upsert({

        id:authUser.id,

        email:authUser.email,

        first_name:firstName,

        last_name:lastName,

        display_name:
          `${firstName} ${lastName}`.trim(),

        account_status:"active",

        onboarding_completed:false

      },{
        onConflict:"id"
      });


  if(profileResult.error){

    console.warn(
      "Profile:",
      profileResult.error.message
    );

  }


  const roleResult =
    await db
      .from("user_roles")
      .select(
        "id,role,is_active"
      )
      .eq(
        "user_id",
        authUser.id
      )
      .eq(
        "is_active",
        true
      )
      .limit(1)
      .maybeSingle();


  if(!roleResult.data){

    const insertRole =
      await db
        .from("user_roles")
        .insert({

          user_id:authUser.id,

          role:requestedRole,

          is_active:true

        });


    if(insertRole.error){

      console.warn(
        "Role:",
        insertRole.error.message
      );

    }

  }

}

========================================================= */

async function loadCurrentUser(){

  const result =
    await db.auth.getUser();


  if(
    result.error ||
    !result.data.user
  ){

    renderLanding();

    return;

  }


  user =
    result.data.user;


  const profileResult =
    await db
      .from("profiles")
      .select("*")
      .eq(
        "id",
        user.id
      )
      .maybeSingle();


  profile =
    profileResult.data ||
    {

      id:user.id,

      email:user.email,

      display_name:user.email

    };


  const roleResult =
    await db
      .from("user_roles")
      .select("role")
      .eq(
        "user_id",
        user.id
      )
      .eq(
        "is_active",
        true
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      )
      .limit(1)
      .maybeSingle();


  role =
    roleResult.data?.role ||
    "student";


  openPortal();

}

  document.getElementById(

    rows.filter(

  document.getElementById(
    "adminAdmins"
  ).textContent =
    rows.filter(

        x.is_active
    ).length;

}

/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadStudents(){

  const area =
    document.getElementById(
      "studentTableArea"
    );


  try{


    const profiles =
      await db
        .from("profiles")
        .select(`
          id,
          email,
          first_name,
          last_name,
          display_name,
          phone,
          state,
          lga,
          country,
          account_status,
          onboarding_completed,
          created_at
        `)
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(profiles.error){

      area.innerHTML = `

        <div class="empty">

          <div>

            <h3>
              Unable to load profiles
            </h3>


            <p
              style="
                margin-top:8px
              ">

              ${escapeHTML(
                profiles.error.message
              )}

            </p>

          </div>

        </div>

      `;

      return;

    }


    const roles =
      await db
        .from("user_roles")
        .select(
          "user_id,role,is_active"
        );


    if(roles.error){

      console.warn(
        roles.error.message
      );

    }


    const roleMap = {};


    (roles.data || [])
      .forEach(item => {

        if(
          item.is_active &&
          !roleMap[item.user_id]
        ){

          roleMap[item.user_id] =
            item.role;

        }

      });


    allStudents =
      (profiles.data || [])
        .map(item => ({

          ...item,

          role:
            roleMap[item.id] ||
            "student"

        }));


    updateStudentStats();


    renderStudentTable(
      allStudents
    );


  }catch(error){

    area.innerHTML = `

      <div class="empty">

        <div>

          <h3>
            Something went wrong
          </h3>


          <p>
            ${escapeHTML(
              error.message
            )}
          </p>

        </div>

      </div>

    `;

  }

}


/* =========================================================
   STUDENT STATISTICS
========================================================= */

function updateStudentStats(){

  const total =
    allStudents.length;


  const students =
    allStudents.filter(
      x =>
        x.role === "student"
    ).length;


  const active =
    allStudents.filter(
      x =>
        x.role === "student" &&
        (
          x.account_status === "active" ||
          !x.account_status
        )
    ).length;


  const admins =
    allStudents.filter(
      x =>
        x.role === "admin"
    ).length;


  document.getElementById(
    "totalProfiles"
  ).textContent =
    total;


  document.getElementById(
    "totalStudents"
  ).textContent =
    students;


  document.getElementById(
    "activeStudents"
  ).textContent =
    active;


  document.getElementById(
    "totalAdmins"
  ).textContent =
    admins;

}

function filterStudents(){

  const input =
    document.getElementById(
      "studentSearch"
    );


  const search =
    input.value
      .trim()
      .toLowerCase();


  if(!search){

    renderStudentTable(
      allStudents
    );

    return;

  }


  const filtered =
    allStudents.filter(
      student => {

        const text = [

          student.email,

          student.first_name,

          student.last_name,

          student.display_name,

          student.phone,

          student.state,

          student.lga

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        return text.includes(
          search
        );

      }
    );


  renderStudentTable(
    filtered
  );

}


/* =========================================================
   VIEW USER
========================================================= */

function viewStudent(id){

  const student =
    allStudents.find(
      x =>
        x.id === id
    );


  if(!student){

    alert(
      "User not found."
    );

    return;

  }


  const name =
    student.display_name ||
    `${student.first_name || ""} ${student.last_name || ""}`
      .trim() ||
    "Unnamed User";


  alert(

`PHILMYSCHOOL USER

Name: ${name}
Email: ${student.email || "—"}
Role: ${student.role || "—"}
Status: ${student.account_status || "active"}
Phone: ${student.phone || "—"}
State: ${student.state || "—"}
LGA: ${student.lga || "—"}
Country: ${student.country || "—"}
Created: ${
  student.created_at
    ? new Date(
        student.created_at
      ).toLocaleString()
    : "—"
}`

  );

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  await db.auth.signOut();

  user = null;
  profile = null;
  role = null;

  renderLanding();

}


/* =========================================================
   AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
  (event) => {

    if(
      event === "SIGNED_OUT"
    ){

      user = null;
      profile = null;
      role = null;

      renderLanding();

    }

  }
);


/* =========================================================
   START APPLICATION
========================================================= */

(async function(){

  const session =
    await db.auth.getSession();


  if(
    session.data.session
  ){

    await loadCurrentUser();

  }else{

    renderLanding();

  }

})();

</script>
